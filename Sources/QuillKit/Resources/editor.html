<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body.dark { background: #1c1c1e; color: #f0f0f0; }

    /* ── Toolbar ─────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      padding: 5px 16px;
      border-bottom: 1px solid #e0e0e0;
      background: inherit;
      flex-shrink: 0;
    }
    body.dark #toolbar { border-color: #3a3a3a; }

    #toolbar button, #toolbar select {
      font-family: inherit;
      font-size: 13px;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 3px 7px;
      cursor: pointer;
      background: transparent;
      color: inherit;
      transition: background 0.1s;
    }
    #toolbar button:hover { background: rgba(0,0,0,0.07); }
    body.dark #toolbar button:hover { background: rgba(255,255,255,0.1); }
    #toolbar button.active {
      background: rgba(0,122,255,0.12);
      color: #007aff;
      border-color: rgba(0,122,255,0.3);
    }
    #toolbar button:disabled { opacity: 0.35; cursor: default; }

    #heading-select {
      padding: 3px 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: transparent;
      color: inherit;
      font-size: 13px;
    }
    body.dark #heading-select { border-color: #555; }

    .tb-sep {
      width: 1px;
      height: 18px;
      background: #d0d0d0;
      margin: 0 4px;
      flex-shrink: 0;
    }
    body.dark .tb-sep { background: #444; }

    /* ── Editor area ─────────────────────────────────── */
    #editor-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
    }

    .ProseMirror {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100%;
      outline: none;
      font-size: 16px;
      line-height: 1.75;
      caret-color: #007aff;
    }
    .ProseMirror p { margin: 0 0 0.8em; }
    .ProseMirror h1 { font-size: 2em;   font-weight: 700; margin: 1em 0 0.4em; }
    .ProseMirror h2 { font-size: 1.5em; font-weight: 600; margin: 0.9em 0 0.35em; }
    .ProseMirror h3 { font-size: 1.25em;font-weight: 600; margin: 0.8em 0 0.3em; }
    .ProseMirror blockquote {
      border-left: 3px solid #ccc;
      margin: 0.8em 0;
      padding-left: 1em;
      color: #666;
      font-style: italic;
    }
    body.dark .ProseMirror blockquote { border-color: #555; color: #aaa; }
    .ProseMirror code {
      background: rgba(0,0,0,0.07);
      border-radius: 3px;
      padding: 1px 4px;
      font-family: "SF Mono", monospace;
      font-size: 0.88em;
    }
    body.dark .ProseMirror code { background: rgba(255,255,255,0.1); }
    .ProseMirror pre {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 0.8em 0;
    }
    body.dark .ProseMirror pre { background: #2a2a2a; }
    .ProseMirror pre code { background: none; padding: 0; }
    .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; margin: 0.5em 0; }
    .ProseMirror li { margin: 0.2em 0; }
    .ProseMirror img { max-width: 100%; border-radius: 4px; }

    /* ── Image NodeView ─────────────────────────────── */
    .image-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
    }
    .image-wrapper img { display: block; max-width: 100%; border-radius: 4px; }
    .image-wrapper.selected img {
      outline: 2px solid #007aff;
      border-radius: 4px;
    }
    body.dark .image-wrapper.selected img { outline-color: #0a84ff; }

    .resize-handle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #007aff;
      border: 1.5px solid #fff;
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
    body.dark .resize-handle { background: #0a84ff; }
    .image-wrapper.selected .resize-handle { opacity: 1; pointer-events: auto; }

    .resize-handle.nw { top: -4px; left: -4px; cursor: nwse-resize; }
    .resize-handle.n  { top: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .resize-handle.ne { top: -4px; right: -4px; cursor: nesw-resize; }
    .resize-handle.e  { top: calc(50% - 4px); right: -4px; cursor: ew-resize; }
    .resize-handle.se { bottom: -4px; right: -4px; cursor: nwse-resize; }
    .resize-handle.s  { bottom: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .resize-handle.sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
    .resize-handle.w  { top: calc(50% - 4px); left: -4px; cursor: ew-resize; }

    /* ── Image toolbar ──────────────────────────────── */
    #image-toolbar {
      display: none;
      position: fixed;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      font-size: 12px;
      white-space: nowrap;
      z-index: 200;
      user-select: none;
    }
    body.dark #image-toolbar { background: #2c2c2e; border-color: #444; color: #f0f0f0; }
    #image-toolbar input[type="number"] {
      width: 52px;
      padding: 2px 4px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 12px;
      text-align: center;
      background: transparent;
      color: inherit;
    }
    body.dark #image-toolbar input[type="number"] { border-color: #555; }
    #image-toolbar input[type="number"]::-webkit-inner-spin-button,
    #image-toolbar input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    #image-toolbar button {
      font-size: 12px;
      padding: 2px 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      color: inherit;
    }
    #image-toolbar button:hover { background: rgba(0,0,0,0.07); }
    body.dark #image-toolbar button:hover { background: rgba(255,255,255,0.1); }
    #image-toolbar button:disabled { opacity: 0.4; cursor: default; }
    #image-toolbar .img-tb-sep { width: 1px; height: 14px; background: #ddd; margin: 0 2px; }
    body.dark #image-toolbar .img-tb-sep { background: #444; }
    #image-toolbar .img-tb-label { color: #999; }

    /* Task list */
    .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 0.5em; }
    .ProseMirror ul[data-type="taskList"] li {
      display: flex; align-items: flex-start; gap: 8px;
    }
    .ProseMirror ul[data-type="taskList"] li > label { margin-top: 2px; }
    .ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div {
      text-decoration: line-through; color: #888;
    }

    /* Tables */
    .ProseMirror table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .ProseMirror th, .ProseMirror td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
      min-width: 60px;
    }
    body.dark .ProseMirror th,
    body.dark .ProseMirror td { border-color: #555; }
    .ProseMirror th { background: #f5f5f5; font-weight: 600; }
    body.dark .ProseMirror th { background: #2a2a2a; }
    .ProseMirror .selectedCell { background: rgba(0,122,255,0.08); }

    /* Placeholder */
    .ProseMirror p.is-editor-empty:first-child::before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
      float: left;
      height: 0;
    }

    /* ── Drop overlay ────────────────────────────────── */
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 4px;
      background: rgba(0, 122, 255, 0.06);
      border: 2px dashed rgba(0, 122, 255, 0.45);
      border-radius: 8px;
      z-index: 100;
      pointer-events: none;
      align-items: center;
      justify-content: center;
    }
    #drop-overlay.active { display: flex; }
    #drop-overlay span {
      font-size: 14px;
      font-weight: 500;
      color: #007aff;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    body.dark #drop-overlay { background: rgba(10, 132, 255, 0.08); border-color: rgba(10,132,255,0.45); }
    body.dark #drop-overlay span { background: rgba(30,30,30,0.92); color: #0a84ff; }
  </style>
</head>
<body>
  <div id="toolbar">
    <select id="heading-select" title="Heading">
      <option value="0">Paragraph</option>
      <option value="1">Heading 1</option>
      <option value="2">Heading 2</option>
      <option value="3">Heading 3</option>
    </select>
    <span class="tb-sep"></span>
    <button data-cmd="bold"      title="Bold (⌘B)"><b>B</b></button>
    <button data-cmd="italic"    title="Italic (⌘I)"><i>I</i></button>
    <button data-cmd="underline" title="Underline (⌘U)"><u>U</u></button>
    <button data-cmd="strike"    title="Strikethrough"><s>S</s></button>
    <button data-cmd="code"      title="Inline code" style="font-family:monospace">`</button>
    <span class="tb-sep"></span>
    <button data-cmd="blockquote" title="Blockquote">&ldquo;</button>
    <button data-cmd="codeBlock"  title="Code block" style="font-family:monospace">{}</button>
    <span class="tb-sep"></span>
    <button data-cmd="bulletList"  title="Bullet list">&#8226; List</button>
    <button data-cmd="orderedList" title="Ordered list">1. List</button>
    <button data-cmd="taskList"    title="Task list">&#9745; Tasks</button>
    <span class="tb-sep"></span>
    <button data-cmd="insertTable" title="Insert 3×3 table">&#8862; Table</button>
    <span id="table-controls" style="display:none">
      <button data-cmd="addRowAfter"    title="Add row below">+Row</button>
      <button data-cmd="addColumnAfter" title="Add column right">+Col</button>
      <button data-cmd="deleteRow"      title="Delete row">&minus;Row</button>
      <button data-cmd="deleteColumn"   title="Delete column">&minus;Col</button>
      <button data-cmd="deleteTable"    title="Delete table">&#10005; Table</button>
    </span>
    <span class="tb-sep"></span>
    <button data-cmd="link"  title="Insert / remove link">&#128279; Link</button>
    <button data-cmd="image" title="Insert image from media library">&#128444; Image</button>
    <span class="tb-sep"></span>
    <button data-cmd="undo" title="Undo (⌘Z)">&#8617; Undo</button>
    <button data-cmd="redo" title="Redo (⌘⇧Z)">&#8618; Redo</button>
  </div>
  <div id="drop-overlay"><span>Drop to upload</span></div>
  <div id="image-toolbar">
    <span class="img-tb-label">W</span>
    <input type="number" id="img-tb-w" min="50" placeholder="—">
    <span class="img-tb-label">H</span>
    <input type="number" id="img-tb-h" min="50" placeholder="—">
    <span class="img-tb-sep"></span>
    <button data-size="thumbnail" style="display:none">Thumb</button>
    <button data-size="medium"    style="display:none">Medium</button>
    <button data-size="large"     style="display:none">Large</button>
    <button data-size="full"      style="display:none">Full</button>
    <span class="img-tb-sep"></span>
    <button id="img-tb-reset">Reset</button>
  </div>
  <div id="editor-wrap"><div id="editor"></div></div>

  <script type="module">
    import { Editor }   from 'https://esm.sh/@tiptap/core@2'
    import StarterKit   from 'https://esm.sh/@tiptap/starter-kit@2'
    import Underline    from 'https://esm.sh/@tiptap/extension-underline@2'
    import Table        from 'https://esm.sh/@tiptap/extension-table@2'
    import TableRow     from 'https://esm.sh/@tiptap/extension-table-row@2'
    import TableCell    from 'https://esm.sh/@tiptap/extension-table-cell@2'
    import TableHeader  from 'https://esm.sh/@tiptap/extension-table-header@2'
    import { Image as TiptapImage } from 'https://esm.sh/@tiptap/extension-image@2'
    import Link         from 'https://esm.sh/@tiptap/extension-link@2'
    import TaskList     from 'https://esm.sh/@tiptap/extension-task-list@2'
    import TaskItem     from 'https://esm.sh/@tiptap/extension-task-item@2'
    import Placeholder  from 'https://esm.sh/@tiptap/extension-placeholder@2'

    // ── ImageNodeView ─────────────────────────────────
    class ImageNodeView {
      constructor(node, editor, getPos) {
        this.node    = node
        this.editor  = editor
        this.getPos  = getPos

        this.wrapper = document.createElement('div')
        this.wrapper.className = 'image-wrapper'

        this.img = document.createElement('img')
        this._applyAttrs(node.attrs)
        this.wrapper.appendChild(this.img)

        for (const pos of ['nw','n','ne','e','se','s','sw','w']) {
          const h = document.createElement('div')
          h.className = `resize-handle ${pos}`
          h.addEventListener('mousedown', e => this._onHandleMousedown(e, pos))
          this.wrapper.appendChild(h)
        }

        this.dom = this.wrapper
      }

      _applyAttrs(attrs) {
        this.img.src = attrs.src || ''
        if (attrs.alt)   this.img.alt   = attrs.alt
        if (attrs.title) this.img.title = attrs.title
        if (attrs.width != null) {
          this.img.width = attrs.width
          this.wrapper.style.width = attrs.width + 'px'
        } else {
          this.img.removeAttribute('width')
          this.wrapper.style.width = ''
        }
        if (attrs.height != null) {
          this.img.height = attrs.height
        } else {
          this.img.removeAttribute('height')
        }
      }

      update(node) {
        if (node.type.name !== 'image') return false
        this.node = node
        this._applyAttrs(node.attrs)
        // Sync toolbar inputs if this image is currently selected
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) {
          document.getElementById('img-tb-w').value = node.attrs.width  ?? ''
          document.getElementById('img-tb-h').value = node.attrs.height ?? ''
        }
        return true
      }

      selectNode() {
        this.wrapper.classList.add('selected')
        _showImageToolbar(this)
      }

      deselectNode() {
        this.wrapper.classList.remove('selected')
        // Delay so toolbar inputs can receive focus before we check
        setTimeout(() => {
          const tb = document.getElementById('image-toolbar')
          if (tb && tb.contains(document.activeElement)) return
          if (tb?._activeNodeView === this) _hideImageToolbar()
        }, 80)
      }

      destroy() {
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) _hideImageToolbar()
      }

      stopEvent(e) {
        // Prevent ProseMirror from stealing handle mousedown events
        return e.type === 'mousedown' && e.target.classList.contains('resize-handle')
      }

      ignoreMutation() { return true }

      _onHandleMousedown(_e, _pos) { /* filled in Task 3 */ }
    }

    // ── Image toolbar helpers ──────────────────────────
    function _positionImageToolbar(tb, wrapper) {
      const wRect = wrapper.getBoundingClientRect()
      tb.style.left = wRect.left + 'px'
      tb.style.top  = (wRect.bottom + 6) + 'px'
    }

    function _showImageToolbar(nv) {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      tb._activeNodeView = nv
      document.getElementById('img-tb-w').value = nv.node.attrs.width  ?? ''
      document.getElementById('img-tb-h').value = nv.node.attrs.height ?? ''
      _updateNamedSizeButtons(null)

      _positionImageToolbar(tb, nv.wrapper)
      tb.style.display = 'flex'

      // Reposition on scroll so the toolbar tracks the image
      tb._scrollHandler = () => _positionImageToolbar(tb, nv.wrapper)
      document.getElementById('editor-wrap').addEventListener('scroll', tb._scrollHandler)

      if (nv.node.attrs.mediaId != null) {
        window.webkit?.messageHandlers?.requestMediaSizes
          ?.postMessage({ mediaId: nv.node.attrs.mediaId })
      }
    }

    function _hideImageToolbar() {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      if (tb._scrollHandler) {
        document.getElementById('editor-wrap').removeEventListener('scroll', tb._scrollHandler)
        tb._scrollHandler = null
      }
      tb.style.display = 'none'
      tb._activeNodeView = null
    }

    function _updateNamedSizeButtons(sizes) {
      document.querySelectorAll('#image-toolbar [data-size]').forEach(btn => {
        if (!sizes || !sizes[btn.dataset.size]) {
          btn.style.display = 'none'
          btn._sizeData = null
        } else {
          btn.style.display = ''
          btn.disabled = false
          btn._sizeData = sizes[btn.dataset.size]
        }
      })
    }

    // ── ResizableImage extension ──────────────────────
    const ResizableImage = TiptapImage.extend({
      addAttributes() {
        return {
          ...this.parent?.(),
          width: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('width')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.width != null ? { width: attrs.width } : {},
          },
          height: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('height')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.height != null ? { height: attrs.height } : {},
          },
          mediaId: {
            default: null,
            parseHTML: el => {
              const dataId = el.getAttribute('data-media-id')
              if (dataId) return parseInt(dataId, 10)
              const m = (el.getAttribute('class') || '').match(/wp-image-(\d+)/)
              return m ? parseInt(m[1], 10) : null
            },
            renderHTML: attrs => attrs.mediaId != null ? { 'data-media-id': attrs.mediaId } : {},
          },
        }
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new ImageNodeView(node, editor, getPos)
      },
    })

    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: [
        StarterKit,
        Underline,
        Table.configure({ resizable: false }),
        TableRow,
        TableHeader,
        TableCell,
        ResizableImage.configure({ inline: false }),
        Link.configure({ openOnClick: false }),
        TaskList,
        TaskItem.configure({ nested: true }),
        Placeholder.configure({ placeholder: 'Start writing…' }),
      ],
      content: '',
      onTransaction: () => updateToolbar(),
      onCreate: () => {
        updateToolbar()
        if (window.webkit?.messageHandlers?.editorReady) {
          window.webkit.messageHandlers.editorReady.postMessage('ready')
        }
      },
    })

    // ── Toolbar commands ───────────────────────────────
    const COMMANDS = {
      bold:          () => editor.chain().focus().toggleBold().run(),
      italic:        () => editor.chain().focus().toggleItalic().run(),
      underline:     () => editor.chain().focus().toggleUnderline().run(),
      strike:        () => editor.chain().focus().toggleStrike().run(),
      code:          () => editor.chain().focus().toggleCode().run(),
      blockquote:    () => editor.chain().focus().toggleBlockquote().run(),
      codeBlock:     () => editor.chain().focus().toggleCodeBlock().run(),
      bulletList:    () => editor.chain().focus().toggleBulletList().run(),
      orderedList:   () => editor.chain().focus().toggleOrderedList().run(),
      taskList:      () => editor.chain().focus().toggleTaskList().run(),
      insertTable:   () => editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(),
      addRowAfter:   () => editor.chain().focus().addRowAfter().run(),
      addColumnAfter:() => editor.chain().focus().addColumnAfter().run(),
      deleteRow:     () => editor.chain().focus().deleteRow().run(),
      deleteColumn:  () => editor.chain().focus().deleteColumn().run(),
      deleteTable:   () => editor.chain().focus().deleteTable().run(),
      undo:          () => editor.chain().focus().undo().run(),
      redo:          () => editor.chain().focus().redo().run(),
      link: () => {
        const href = editor.getAttributes('link').href || ''
        const sel  = window.getSelection()
        let rect

        if (sel && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0)
          if (!range.collapsed) {
            // Text is selected — anchor to the selection rect
            const r = range.getBoundingClientRect()
            rect = { x: r.x, y: r.y, width: r.width, height: r.height }
          } else if (href) {
            // Collapsed cursor on a link — sel.anchorNode is unreliable at node
            // boundaries in ProseMirror; use domAtPos() and try adjacent offsets
            // to find the <a> regardless of where in the link the cursor sits.
            const from = editor.state.selection.from
            let linkEl = null
            for (const delta of [0, 1, -1, 2, -2]) {
              try {
                const dn = editor.view.domAtPos(from + delta).node
                const el = dn.nodeType === Node.TEXT_NODE ? dn.parentElement : dn
                const a  = el && el.closest('a')
                if (a) { linkEl = a; break }
              } catch (_) {}
            }
            if (linkEl) {
              const lr = linkEl.getBoundingClientRect()
              rect = { x: lr.x, y: lr.y, width: lr.width, height: lr.height }
            }
          }
        }

        // Fallback: toolbar button
        if (!rect) {
          const btn = document.querySelector('[data-cmd="link"]').getBoundingClientRect()
          rect = { x: btn.x, y: btn.y, width: btn.width, height: btn.height }
        }

        if (window.webkit?.messageHandlers?.showLinkPicker) {
          window.webkit.messageHandlers.showLinkPicker.postMessage({ href, rect })
        }
      },
      image: () => {
        if (window.webkit?.messageHandlers?.insertImageAtIndex) {
          window.webkit.messageHandlers.insertImageAtIndex.postMessage(0)
        }
      },
    }

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', e => {
        e.preventDefault()  // prevent focus loss before command runs
        COMMANDS[btn.dataset.cmd]?.()
      })
    })

    document.getElementById('heading-select').addEventListener('change', e => {
      const level = parseInt(e.target.value)
      if (level === 0) editor.chain().focus().setParagraph().run()
      else editor.chain().focus().toggleHeading({ level }).run()
    })

    // ── Active-state updates ───────────────────────────
    const TOGGLE_CMDS = ['bold','italic','underline','strike','code',
                         'blockquote','codeBlock','bulletList','orderedList','taskList','link']

    function updateToolbar() {
      TOGGLE_CMDS.forEach(cmd => {
        const btn = document.querySelector(`[data-cmd="${cmd}"]`)
        if (btn) btn.classList.toggle('active', editor.isActive(cmd))
      })
      // Heading select
      const sel = document.getElementById('heading-select')
      sel.value = '0'
      for (let i = 1; i <= 3; i++) {
        if (editor.isActive('heading', { level: i })) { sel.value = String(i); break }
      }
      // Table controls
      const inTable = editor.isActive('table')
      document.getElementById('table-controls').style.display = inTable ? 'contents' : 'none'
      // Undo / Redo
      document.querySelector('[data-cmd="undo"]').disabled = !editor.can().undo()
      document.querySelector('[data-cmd="redo"]').disabled = !editor.can().redo()
    }

    // ── Content change → Swift ─────────────────────────
    let debounce
    editor.on('update', () => {
      clearTimeout(debounce)
      debounce = setTimeout(() => {
        if (window.webkit?.messageHandlers?.contentChanged) {
          window.webkit.messageHandlers.contentChanged.postMessage(editor.getHTML())
        }
      }, 500)
    })

    // ── Swift → JS bridge (globals) ───────────────────
    window.setContent = html => {
      editor.commands.setContent(html || '', false)
    }
    window.getContent = () => editor.getHTML()
    window.setDarkMode = dark => document.body.classList.toggle('dark', dark)
    window.focusEditor = () => editor.commands.focus()
    window.insertImageAt = (_index, url, width, height, mediaId) => {
      const attrs = { src: url }
      if (width  != null) attrs.width   = width
      if (height != null) attrs.height  = height
      if (mediaId != null) attrs.mediaId = mediaId
      editor.chain().focus().setImage(attrs).run()
    }
    window.showDropOverlay = () => document.getElementById('drop-overlay').classList.add('active')
    window.hideDropOverlay = () => document.getElementById('drop-overlay').classList.remove('active')
    window.applyLink = url => {
      editor.chain().focus().setLink({ href: url }).run()
    }
    window.removeLink = () => {
      editor.chain().focus().unsetLink().run()
    }
    window.setMediaSizes = (mediaId, sizes) => {
      const tb = document.getElementById('image-toolbar')
      if (!tb || tb.style.display === 'none') return
      const nv = tb._activeNodeView
      if (!nv || nv.node.attrs.mediaId !== mediaId) return
      _updateNamedSizeButtons(sizes)
    }
  </script>
</body>
</html>
