    // Last raw HTML set via setContent() or saved from code view. Unlike _rawHTML,
    // this is never cleared by visual edits — so code view always shows the full
    // WordPress HTML (including block comments) even after the user has typed in
    // the visual editor.
    let _rawHTMLOnLoad = null
    // Textarea value when code view was opened. Used to detect whether the user
    // actually edited anything — if unchanged on exit, we skip setContent so
    // Tiptap's visual state is preserved unchanged.
    let _codeViewOriginal = null

    function _codeViewChanged() {
      clearTimeout(debounce)
      debounce = setTimeout(() => {
        _postContent(document.getElementById('code-editor').value, false)
      }, 500)
    }

    function _enterCodeView() {
      if (codeViewActive) return
      _closeFindBar()
      _hideImageToolbar()
      _closeEmbedMenu()
      codeViewActive = true
      // _rawHTML is cleared (set to null) on every Tiptap update event, so null means
      // the user has made visual edits since the last load/code-view save.
      // Always run the source through formatHTML for a readable, indented display.
      // _rawHTMLOnLoad is never updated unless the user edits in code view, so
      // formatHTML(_rawHTMLOnLoad) is idempotent across repeated enter/exit cycles.
      const hasVisualEdits = _rawHTML === null
      const sourceHTML = (!hasVisualEdits && _rawHTMLOnLoad !== null)
        ? _rawHTMLOnLoad
        : extractFootnotes(toWordPressHTML(editor.getHTML())).content
      const codeViewHTML = formatHTML(sourceHTML)
      _codeViewOriginal = codeViewHTML
      document.getElementById('code-editor').value = codeViewHTML
      document.getElementById('editor').style.display = 'none'
      document.getElementById('code-editor').style.display = 'block'
      document.getElementById('btn-code-view').classList.add('active')
      document.getElementById('toolbar').querySelectorAll('button:not(#btn-code-view), select').forEach(el => { el.disabled = true })
      const ta = document.getElementById('code-editor')
      ta.addEventListener('input', _codeViewChanged)
      ta.selectionStart = ta.selectionEnd = 0
      ta.scrollTop = 0
      ta.focus()
    }

    function _exitCodeView() {
      if (!codeViewActive) return
      codeViewActive = false
      const html = document.getElementById('code-editor').value
      document.getElementById('code-editor').removeEventListener('input', _codeViewChanged)
      clearTimeout(debounce)
      const userEdited = html !== _codeViewOriginal
      _codeViewOriginal = null
      if (userEdited) {
        // User changed the HTML — parse it back into Tiptap and update raw stores.
        _rawHTML = html
        _rawHTMLOnLoad = html
        let stored = []
        try { stored = JSON.parse(_footnotes) } catch (e) { stored = [] }
        editor.commands.setTextSelection(0)
        editor.commands.setContent(_wrapIncoming(inlineFootnotes(html, stored, document)), false)
        editor.commands.setTextSelection(0)
        _reportBlocksAtRisk(html)
      }
      document.getElementById('editor').style.display = ''
      document.getElementById('code-editor').style.display = 'none'
      document.getElementById('btn-code-view').classList.remove('active')
      document.getElementById('toolbar').querySelectorAll('button, select').forEach(el => { el.disabled = false })
      editor.commands.focus()
      // Always fire contentChanged so Swift's htmlContent stays current.
      // If not edited, getContent() returns the pre-code-view value unchanged.
      _postContent(userEdited ? html : window.getContent(), false)
      _postStats()
    }

    document.getElementById('btn-code-view').addEventListener('click', () => {
      codeViewActive ? _exitCodeView() : _enterCodeView()
    })

    _btnToggleCite.addEventListener('click', () => {
      const { state } = editor
      const { $head } = state.selection
      const bqDepth = _citeHostDepth($head)
      if (bqDepth === -1) return
      const bqNode = $head.node(bqDepth)
      const lastChild = bqNode.lastChild
      if (lastChild && lastChild.type.name === 'cite') {
        // Remove the cite
        const bqStart = $head.start(bqDepth)
        let citePos = bqStart
        bqNode.forEach((child, offset) => {
          if (child === lastChild) citePos = bqStart + offset
        })
        editor.chain().focus()
          .command(({ tr }) => {
            tr.delete(citePos, citePos + lastChild.nodeSize)
            return true
          }).run()
      } else {
        // Add a cite at the end of the blockquote
        const end = $head.after(bqDepth) - 1
        editor.chain().focus()
          .command(({ tr }) => {
            tr.insert(end, state.schema.nodes.cite.create())
            return true
          })
          .setTextSelection(end + 1)
          .run()
      }
    })

    // AI toolbar buttons
    window.setAIEnabled = enabled => {
      document.getElementById('ai-toolbar-group').style.display = enabled ? '' : 'none'
    }
    window.setEvaluating = active => {
      document.getElementById('btn-evaluate').disabled = active
    }
    window.setEvaluationPanelOpen = open => {
      document.getElementById('btn-evaluate').classList.toggle('active', open)
    }
    document.getElementById('btn-generate').addEventListener('mousedown', e => {
      e.preventDefault()
      window.webkit.messageHandlers.triggerGenerate.postMessage({})
    })
    document.getElementById('btn-evaluate').addEventListener('mousedown', e => {
      e.preventDefault()
      window.webkit.messageHandlers.triggerEvaluate.postMessage({})
    })

    // Only the entry points that receive post_content wrap; the AI reject
    // paths restore editor.getHTML(), which is already wrapped.
    const _wrapIncoming = html =>
      html ? wrapUnsupportedBlocks(html, BlockParser.parse, serializeBlock, document) : html

    // Image, gallery and embed model a block through bespoke passes in
    // toWordPressHTML rather than a descriptor entry, so they need naming here.
    const BLOCK_NAME_FOR_NODE = { image: 'image', galleryBlock: 'gallery', embedBlock: 'embed' }

    function _accountedBlockCounts() {
      const counts = new Map()
      const add = name => counts.set(name, (counts.get(name) || 0) + 1)
      editor.state.doc.descendants(node => {
        // A node holding verbatim source holds its inner blocks in that string.
        const source = node.attrs.unsupportedSource || node.attrs.sourceHTML
        if (source) {
          const own = countBlockNames(BlockParser.parse(source))
          own.forEach((n, name) => counts.set(name, (counts.get(name) || 0) + n))
          const name = BLOCK_NAME_FOR_NODE[node.type.name]
          if (name && !own.has(name)) add(name)
          return false
        }
        if (node.type.name === 'gutenbergPassthrough') {
          if (node.attrs.blockName) add(node.attrs.blockName)
          return false
        }
        const descriptor = blockDescriptorRegistry.descriptorFor(node.type.name)
        if (descriptor) add(shortBlockName(descriptor.blockName))
        if (BLOCK_NAME_FOR_NODE[node.type.name]) add(BLOCK_NAME_FOR_NODE[node.type.name])
        return true
      })
      return counts
    }

    function _reportBlocksAtRisk(originalHTML) {
      if (!originalHTML) return
      const expected = countBlockNames(BlockParser.parse(originalHTML))
      // Reported even when empty, or a post the user repaired keeps its banner.
      const names = unrepresentedBlockNames(expected, _accountedBlockCounts())
      window.webkit?.messageHandlers?.blocksAtRisk?.postMessage({ names })
    }

    window.setContent = (html, footnotesJSON) => {
      if (codeViewActive) {
        codeViewActive = false
        document.getElementById('editor').style.display = ''
        document.getElementById('code-editor').style.display = 'none'
        document.getElementById('btn-code-view').classList.remove('active')
        document.getElementById('toolbar').querySelectorAll('button, select').forEach(el => { el.disabled = false })
      }
      _closeFindBar()
      _footnotes = footnotesJSON || '[]'
      let storedFootnotes = []
      try { storedFootnotes = JSON.parse(_footnotes) } catch (e) { storedFootnotes = [] }
      const wrapped = _wrapIncoming(inlineFootnotes(html, storedFootnotes, document))
      // The raw stores keep the unwrapped original, so an unedited post saves
      // back byte-identically and code view shows real post_content.
      _rawHTML = html || null
      _rawHTMLOnLoad = html || null
      // Clear any NodeSelection before replacing the whole document: under jsdom
      // a stale one makes the replace drop incoming figure content.
      editor.commands.setTextSelection(0)
      editor.commands.setContent(wrapped || '', false)
      // setContent maps the old caret into the new doc, and a landing next to an
      // atom block becomes a NodeSelection that outlines it before any click.
      editor.commands.setTextSelection(0)
      _reportBlocksAtRisk(html)
      document.getElementById('editor-wrap').scrollTop = 0
      clearTimeout(debounce)  // cancel any contentChanged the setContent may have triggered
      _postStats()
      _toolbarIdle = true
      updateToolbar()
    }
    window.openFindBar = _openFindBar
    window.getContent = () => codeViewActive
      ? document.getElementById('code-editor').value
      : (_rawHTML !== null ? _rawHTML : extractFootnotes(toWordPressHTML(editor.getHTML())).content)
    window.getFootnotes = () => _footnotes

    // Debug entry point for --check-fixtures: the jsdom corpus, run in WebKit.
    window.__runFixtureCorpus = json => JSON.parse(json).map(({ name, source }) => {
      window.setContent(source)
      const untouched = window.getContent()
      const edited = extractFootnotes(toWordPressHTML(editor.getHTML())).content
      window.setContent(edited)
      const again = extractFootnotes(toWordPressHTML(editor.getHTML())).content
      return { name, untouched: untouched === source, identical: edited === source, idempotent: again === edited, saved: edited }
    })
    window.pushContentToSwift = () => _postContent(window.getContent(), _rawHTML === null)
    window.syncContentToSwift = () => {
      _rawHTML = null
      _rawHTMLOnLoad = null
      clearTimeout(debounce)
      _postContent(toWordPressHTML(editor.getHTML()), true)
    }
    window.setDarkMode = dark => document.body.classList.toggle('dark', dark)

    window.isInFootnote = () => _isInFootnote()

    window.insertImage = (url, width, height, mediaId, alt) => {
      if (_isInFootnote()) return
      const attrs = { src: url }
      if (width   != null) attrs.width   = width
      if (height  != null) attrs.height  = height
      if (mediaId != null) attrs.mediaId = mediaId
      if (alt)             attrs.alt     = alt
      editor.chain().focus().setImage(attrs).run()
      // setImage leaves the cursor inside the figure's empty figcaption. Move it
      // to a fresh paragraph after the image instead; the caption stays clickable.
      const { $from } = editor.state.selection
      const imgDepth = _ancestorDepth($from, 'image')
      if (imgDepth === -1) return
      const after = $from.after(imgDepth)
      editor.chain()
        .insertContentAt(after, { type: 'paragraph' })
        .setTextSelection(after + 1)
        .focus()
        .scrollIntoView()
        .run()
    }
    window.insertGallery = (json) => {
      if (_isInFootnote()) return
      let payload
      try { payload = JSON.parse(json) } catch { return }
      if (!Array.isArray(payload.images) || payload.images.length === 0) return
      editor.chain().focus().insertContent({
        type: 'galleryBlock',
        attrs: {
          images: payload.images,
          columns: payload.columns ?? 3,
          cropped: payload.cropped ?? true,
          linkTo: payload.linkTo ?? 'none',
          sizeSlug: payload.sizeSlug ?? 'large',
        },
      }).run()
    }
    window.insertTabs = (count) => {
      if (_isInFootnote()) return false
      const labels = Array.from({ length: count }, (_, i) => `Tab ${i + 1}`)
      const at = editor.state.selection.from
      editor.chain().focus().insertContent({
        type: 'tabsBlock',
        content: [
          { type: 'tabList', content: labels.map(l => ({ type: 'tabButton', content: [{ type: 'text', text: l }] })) },
          { type: 'tabPanels', content: labels.map(l => ({ type: 'tabPanel', attrs: { label: l }, content: [{ type: 'paragraph' }] })) },
        ],
      }).run()
      let target = null
      editor.state.doc.descendants((node, pos) => {
        if (target === null && node.type.name === 'tabPanel' && pos >= at - 1) target = pos + 2
      })
      if (target !== null) editor.commands.setTextSelection(target)
      return true
    }

    window.insertAccordion = () => {
      if (_isInFootnote()) return false
      editor.chain().focus().insertContent({
        type: 'accordionBlock',
        content: [{
          type: 'accordionItem',
          content: [
            { type: 'accordionHeading' },
            { type: 'accordionPanel', content: [{ type: 'paragraph' }] },
          ],
        }],
      }).run()
      return true
    }

    window.insertButtons = () => {
      if (_isInFootnote()) return false
      editor.chain().focus().insertContent({
        type: 'buttonsBlock',
        content: [{ type: 'buttonBlock' }],
      }).run()
      return true
    }

    window.insertDetails = () => {
      if (_isInFootnote()) return false
      editor.chain().focus().insertContent({
        type: 'detailsBlock',
        content: [{ type: 'detailsSummary' }, { type: 'paragraph' }],
      }).run()
      return true
    }

    window.insertSeparator = () => {
      if (_isInFootnote()) return false
      editor.chain().focus().setHorizontalRule().run()
      return true
    }

    window.insertColumns = (count) => {
      if (_isInFootnote()) return false
      const columns = Array.from({ length: count }, () => ({
        type: 'columnBlock',
        content: [{ type: 'paragraph' }],
      }))
      const at = editor.state.selection.from
      editor.chain().focus().insertContent({ type: 'columnsBlock', content: columns }).run()
      let target = null
      editor.state.doc.descendants((node, pos) => {
        if (target === null && node.type.name === 'columnBlock' && pos >= at - 1) target = pos + 2
      })
      if (target !== null) editor.commands.setTextSelection(target)
      return true
    }
    // Convert a Markdown string to HTML and insert it at the cursor.
    //
    // Backs the Edit ▸ Paste as Markdown command. Swift reads NSPasteboard itself
    // and calls this directly, so this deliberately never touches ProseMirror's
    // clipboard plumbing (handlePaste / transformPastedText / clipboardTextParser) —
    // an ordinary ⌘V behaves exactly as it did before this function existed.
    //
    // Returns a status string; EditorCoordinator turns a non-'ok' result into a toast.
    window.insertMarkdown = (text) => {
      if (typeof text !== 'string' || !text.trim()) return 'empty'
      // Contexts where block-level content cannot go: the raw-HTML textarea, a
      // footnote entry (inline content only), and a code block (literal text is
      // the entire point). Refuse rather than corrupting the document.
      if (codeViewActive) return 'code-view'
      if (_isInFootnote()) return 'footnote'
      if (editor.isActive('codeBlock')) return 'code-block'

      let html
      try {
        html = MarkedBundle.marked.parse(text, { gfm: true })
      } catch {
        return 'parse-error'
      }

      const tmp = document.createElement('div')
      tmp.innerHTML = html
      // marked passes raw HTML in the source straight through. The schema parse
      // below would drop these anyway (no matching node), but strip them up front
      // so nothing executable is ever built into a live DOM tree. <input> also
      // covers GFM task-list checkboxes, which have no Quill equivalent — the item
      // degrades to a plain list item rather than a broken node.
      tmp.querySelectorAll('script, style, iframe, object, embed, form, input').forEach(el => el.remove())
      // marked terminates fenced code with a newline, which would show as an empty
      // last line in the code block. Drop it so the block matches what was pasted.
      tmp.querySelectorAll('pre > code').forEach(el => {
        el.textContent = el.textContent.replace(/\n+$/, '')
      })
      // Remove whitespace-only text nodes between blocks — ProseMirror wraps the
      // first \n marked emits between block tags in a blank paragraph even with
      // preserveWhitespace: false. Same gotcha as the AI-insert path.
      Array.from(tmp.childNodes).forEach(n => {
        if (n.nodeType === Node.TEXT_NODE && !n.textContent.trim()) n.remove()
      })
      const clean = tmp.innerHTML.trim()
      if (!clean) return 'empty'

      editor.chain().focus().insertContent(clean, {
        parseOptions: { preserveWhitespace: false },
      }).run()
      return 'ok'
    }
    window.showDropOverlay = () => document.getElementById('drop-overlay').classList.add('active')
    window.hideDropOverlay = () => document.getElementById('drop-overlay').classList.remove('active')
    window.applyLink = url => {
      if (_setButtonHref(url)) return
      const existing = editor.getAttributes('link')
      editor.chain().focus().extendMarkRange('link').setLink({ ...existing, href: url }).run()
    }
    window.removeLink = () => {
      if (_setButtonHref(null)) return
      editor.chain().focus().unsetLink().run()
    }
    window.setMediaSizes = (mediaId, sizes) => {
      const tb = document.getElementById('image-toolbar')
      if (!tb || tb.style.display === 'none') return
      const nv = tb._activeNodeView
      if (!nv || nv.node.attrs.mediaId !== mediaId) return
      _updateNamedSizeButtons(sizes)
    }

    // ── Image toolbar event handlers ──────────────────
    ;(function () {
      function commitDims(newW, newH) {
        const tb = document.getElementById('image-toolbar')
        const nv = tb?._activeNodeView
        if (!nv) return
        const pos = nv.getPos()
        if (typeof pos !== 'number') return
        const { state, dispatch } = nv.editor.view
        dispatch(state.tr.setNodeMarkup(pos, null, { ...nv.node.attrs, width: newW, height: newH }))
      }

      document.getElementById('img-tb-w').addEventListener('change', e => {
        const tb  = document.getElementById('image-toolbar')
        const nv  = tb?._activeNodeView
        const newW = Math.max(50, parseInt(e.target.value) || 50)
        let newH = nv?.node.attrs.height ?? null
        const attrs = nv?.node.attrs
        if (attrs?.width && attrs?.height) {
          newH = Math.round(newW * (attrs.height / attrs.width))
          document.getElementById('img-tb-h').value = newH
        }
        commitDims(newW, newH)
      })

      document.getElementById('img-tb-h').addEventListener('change', e => {
        const tb  = document.getElementById('image-toolbar')
        const nv  = tb?._activeNodeView
        const newH = Math.max(50, parseInt(e.target.value) || 50)
        let newW = nv?.node.attrs.width ?? null
        const attrs = nv?.node.attrs
        if (attrs?.width && attrs?.height) {
          newW = Math.round(newH * (attrs.width / attrs.height))
          document.getElementById('img-tb-w').value = newW
        }
        commitDims(newW, newH)
      })

      document.getElementById('img-tb-reset').addEventListener('click', () => {
        const tb = document.getElementById('image-toolbar')
        const nv = tb?._activeNodeView
        if (!nv) return
        const pos = nv.getPos()
        if (typeof pos !== 'number') return
        const { state, dispatch } = nv.editor.view
        // Restore to full-size URL and dimensions if WordPress media sizes are available;
        // otherwise just remove the explicit constraints.
        const fullBtn = document.querySelector('#image-toolbar [data-size="full"]')
        const newAttrs = { ...nv.node.attrs, width: null, height: null }
        if (fullBtn?._sizeData) {
          newAttrs.src    = fullBtn._sizeData.url
          newAttrs.width  = fullBtn._sizeData.width
          newAttrs.height = fullBtn._sizeData.height
        }
        dispatch(state.tr.setNodeMarkup(pos, null, newAttrs))
        document.getElementById('img-tb-w').value = ''
        document.getElementById('img-tb-h').value = ''
      })

      let _altDebounceTimer = null
      function _commitAlt(value) {
        const tb = document.getElementById('image-toolbar')
        const nv = tb?._activeNodeView
        if (!nv) return
        const pos = nv.getPos()
        if (typeof pos !== 'number') return
        const { state, dispatch } = nv.editor.view
        dispatch(state.tr.setNodeMarkup(pos, null, { ...nv.node.attrs, alt: value || null }))
      }
      document.getElementById('img-tb-alt').addEventListener('input', e => {
        clearTimeout(_altDebounceTimer)
        _altDebounceTimer = setTimeout(() => _commitAlt(e.target.value), 500)
      })
      document.getElementById('img-tb-alt').addEventListener('blur', e => {
        clearTimeout(_altDebounceTimer)
        _commitAlt(e.target.value)
      })

      document.querySelectorAll('#image-toolbar [data-size]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tb = document.getElementById('image-toolbar')
          const nv = tb?._activeNodeView
          if (!nv || !btn._sizeData) return
          const { url, width, height } = btn._sizeData
          const pos = nv.getPos()
          if (typeof pos !== 'number') return
          const { state, dispatch } = nv.editor.view
          dispatch(state.tr.setNodeMarkup(pos, null, { ...nv.node.attrs, src: url, width, height }))
          document.getElementById('img-tb-w').value = width
          document.getElementById('img-tb-h').value = height
        })
      })

      document.getElementById('img-tb-link').addEventListener('click', () => {
        const tb = document.getElementById('image-toolbar')
        const nv = tb?._activeNodeView
        if (!nv) return
        const pos = nv.getPos()
        if (typeof pos !== 'number') return
        const turningOn = nv.node.attrs.linkTo !== 'media'
        const newAttrs = { ...nv.node.attrs, linkTo: turningOn ? 'media' : 'none' }
        if (turningOn) {
          // Prefer the known media-library full-resolution URL; fall back to the
          // image's current src when no media size data is available (e.g. no
          // mediaId), so the toggle still works for externally-sourced images.
          const fullBtn = document.querySelector('#image-toolbar [data-size="full"]')
          newAttrs.linkHref = fullBtn?._sizeData?.url || nv.node.attrs.src
        } else {
          newAttrs.linkHref = null
        }
        const { state, dispatch } = nv.editor.view
        dispatch(state.tr.setNodeMarkup(pos, null, newAttrs))
      })
    })()

    // ── AI writing bridge ─────────────────────────────
    let _aiOriginalDoc  = null
    let _aiFrom         = null
    let _aiTo           = null
    let _aiResultTo     = null
    let _aiInProgress   = false

    // Swaps the saved document back in; an HTML round-trip trims edge spaces and shifts every later position.
    function _restoreAIOriginal(emitUpdate) {
      const tr = editor.state.tr.replaceWith(0, editor.state.doc.content.size, _aiOriginalDoc.content)
      editor.view.dispatch(tr.setMeta('preventUpdate', !emitUpdate))
    }

    // Report selection changes to Swift so it can show/hide AI context menu items.
    // Uses ProseMirror's selection (direction-independent) instead of
    // window.getSelection() which can report collapsed for reversed selections.
    function _reportSelectionToSwift() {
      if (_aiInProgress) return
      const { from, to } = editor.state.selection
      if (to - from < 10) {
        window.webkit?.messageHandlers?.selectionChanged?.postMessage(null)
        return
      }
      const sel = window.getSelection()
      if (sel && sel.rangeCount > 0) {
        const rect = sel.getRangeAt(0).getBoundingClientRect()
        if (rect.width > 0 || rect.height > 0) {
          window.webkit?.messageHandlers?.selectionChanged?.postMessage({
            rect: { x: rect.left, y: rect.top, width: rect.width, height: rect.height },
          })
          return
        }
      }
      // Fallback: ProseMirror says there's a selection but native range has no rect.
      // Use coordsAtPos for a valid rect.
      try {
        const coords = editor.view.coordsAtPos(from)
        window.webkit?.messageHandlers?.selectionChanged?.postMessage({
          rect: { x: coords.left, y: coords.top, width: 1, height: coords.bottom - coords.top },
        })
      } catch (_) {
        window.webkit?.messageHandlers?.selectionChanged?.postMessage(null)
      }
    }

    let _selChangeTimer = null
    // Browser selectionchange — covers normal text selections
    document.addEventListener('selectionchange', () => {
      clearTimeout(_selChangeTimer)
      _selChangeTimer = setTimeout(_reportSelectionToSwift, 150)
    })
    // Tiptap selectionUpdate — covers ProseMirror-managed selections (table cells,
    // reversed selections) that don't fire the browser selectionchange event.
    editor.on('selectionUpdate', () => {
      clearTimeout(_selChangeTimer)
      _selChangeTimer = setTimeout(_reportSelectionToSwift, 150)
    })

    // Called by Swift when the user taps a pill button.
    // Captures original HTML + selection positions, replaces selection with a loading
    // placeholder, and returns the selected plain text for use as prompt input.
    // Returns null if there is no valid selection (≥10 chars).
    window.beginAIOperation = () => {
      const { from, to } = editor.state.selection

      // Detect parent structure (list or table) before checking selection size,
      // since reversed table selections can collapse to a single cell.
      const $from = editor.state.doc.resolve(from)
      let context = null
      let containerText = null
      let containerFrom = null
      let containerTo = null
      for (let d = $from.depth; d > 0; d--) {
        const name = $from.node(d).type.name
        if (name === 'bulletList' || name === 'orderedList') {
          context = name
          containerFrom = $from.before(d)
          containerTo = $from.after(d)
          containerText = editor.state.doc.textBetween(containerFrom, containerTo, '\n', '')
          break
        }
        if (name === 'table') {
          context = 'table'
          containerFrom = $from.before(d)
          containerTo = $from.after(d)
          const rows = []
          $from.node(d).forEach(row => {
            const cells = []
            row.forEach(cell => cells.push(cell.textContent.trim()))
            rows.push(cells.join(' | '))
          })
          containerText = rows.join('\n')
          break
        }
      }

      // For tables/lists, allow small selections (reversed drags collapse to
      // one cell) — the container content will be used. For plain text, require ≥10.
      if (!context && to - from < 10) return null

      const selectedText = context
        ? (containerText || editor.state.doc.textBetween(from, to, '\n', ''))
        : editor.state.doc.textBetween(from, to, '\n', '')

      _aiFrom         = from
      _aiTo           = to
      _aiOriginalDoc  = editor.state.doc
      _aiInProgress   = true

      // Replace selected range with an animated loading placeholder
      editor.chain().focus()
        .setTextSelection({ from, to })
        .insertContent('<em class="ai-loading">✶ Rewriting…</em>')
        .run()

      return { text: selectedText, context, containerText, containerFrom, containerTo }
    }

    // Called by Swift with Claude's HTML result.
    // Restores the original document (silently), inserts the result at the original
    // range, selects it for visual feedback, and returns the bounding rect so Swift
    // can position the accept/discard panel.
    window.showAIResult = (html, cFrom, cTo) => {
      // Clean Claude's response through the DOM so regex edge-cases can't slip through
      const _tmp = document.createElement('div')
      _tmp.innerHTML = html
      // Remove empty block elements (<p></p>, <p>&nbsp;</p>, etc.)
      _tmp.querySelectorAll('p, h1, h2, h3, h4, h5, h6').forEach(el => {
        if (!el.textContent.trim() && !el.querySelector('img, table')) el.remove()
      })
      // Remove whitespace-only text nodes between block elements — ProseMirror
      // treats the \n\n Claude emits between <p> tags as text and wraps the first
      // one in a blank paragraph even with preserveWhitespace: false.
      Array.from(_tmp.childNodes).forEach(n => {
        if (n.nodeType === Node.TEXT_NODE && !n.textContent.trim()) n.remove()
      })
      const cleanHtml = _tmp.innerHTML.trim()
      if (!cleanHtml) return null

      // Restore original without emitting a contentChanged event
      _restoreAIOriginal(false)

      // Determine insertion range.
      // Re-derive container boundaries from the restored doc rather than using
      // saved positions — the getHTML/setContent round-trip can shift positions
      // (especially for tables with complex internal structure).
      let nodeFrom, nodeTo
      if (typeof cFrom === 'number' && typeof cTo === 'number') {
        const docSize = editor.state.doc.content.size
        const safeFrom = Math.min(_aiFrom, docSize)
        const $from = editor.state.doc.resolve(safeFrom)
        let found = false
        for (let d = $from.depth; d > 0; d--) {
          const name = $from.node(d).type.name
          if (name === 'bulletList' || name === 'orderedList' || name === 'table') {
            nodeFrom = $from.before(d)
            nodeTo = $from.after(d)
            found = true
            break
          }
        }
        if (!found) {
          nodeFrom = $from.depth > 0 ? $from.before($from.depth) : 0
          nodeTo = $from.depth > 0 ? $from.after($from.depth) : $from.end()
        }
      } else {
        const docSize = editor.state.doc.content.size
        nodeFrom = Math.min(_aiFrom, docSize)
        nodeTo   = Math.min(_aiTo, docSize)
      }

      // A lone paragraph inside one paragraph goes in as inline text, or it splits the paragraph.
      let insertHtml = cleanHtml
      const $start = editor.state.doc.resolve(nodeFrom)
      const $end = editor.state.doc.resolve(nodeTo)
      const onlyChild = _tmp.childNodes.length === 1 ? _tmp.firstElementChild : null
      if (onlyChild?.tagName === 'P' && $start.parent.isTextblock && $start.sameParent($end)) {
        insertHtml = onlyChild.innerHTML
      } else {
        // Blocks inserted at a paragraph's edge leave an empty paragraph there, so take the edge too;
        // mid-paragraph, take the separating space so neither half keeps it.
        const doc = editor.state.doc
        if ($start.parent.isTextblock && $start.parentOffset === 0) nodeFrom = $start.before()
        else if ($start.parent.isTextblock && doc.textBetween(nodeFrom - 1, nodeFrom) === ' ') nodeFrom -= 1
        if ($end.parent.isTextblock && $end.parentOffset === $end.parent.content.size) nodeTo = $end.after()
        else if ($end.parent.isTextblock && doc.textBetween(nodeTo, nodeTo + 1) === ' ') nodeTo += 1
      }

      // Insert the result — this DOES emit contentChanged (marks post dirty).
      // preserveWhitespace: false prevents ProseMirror from wrapping the \n
      // characters Claude emits between <p> tags into blank paragraph nodes.
      editor.chain().focus()
        .insertContentAt({ from: nodeFrom, to: nodeTo }, insertHtml, {
          parseOptions: { preserveWhitespace: false }
        })
        .run()
      _aiResultTo = editor.state.selection.to

      // Select the inserted range — browser selection acts as the visual highlight
      editor.chain().setTextSelection({ from: nodeFrom, to: _aiResultTo }).run()
      const s = window.getSelection()
      if (s && s.rangeCount > 0 && !s.isCollapsed) {
        const r = s.getRangeAt(0).getBoundingClientRect()
        if (r.width > 0 || r.height > 0) {
          return { x: r.left, y: r.top, width: r.width, height: r.height }
        }
      }
      // Fallback: browser selection has no usable rect (e.g. after table replacement).
      // Use ProseMirror coordsAtPos so the panel still appears.
      try {
        const coords = editor.view.coordsAtPos(nodeFrom)
        return { x: coords.left, y: coords.top, width: 200, height: coords.bottom - coords.top }
      } catch (_) {
        return { x: 0, y: 0, width: 0, height: 0 }
      }
    }

    // Called by Swift when the user accepts the result.
    // Collapses the selection to the end of the inserted content and clears AI state.
    window.acceptAIResult = () => {
      if (_aiResultTo !== null) {
        editor.chain().focus().setTextSelection(_aiResultTo).run()
      }
      _aiOriginalDoc  = null
      _aiFrom         = null
      _aiTo           = null
      _aiResultTo     = null
      _aiInProgress   = false
    }

    // Called by Swift when the user discards the result (or on error).
    // Restores the original document and clears AI state. Emits contentChanged so Swift's
    // htmlContent is updated back to the pre-operation value.
    window.discardAIResult = () => {
      if (_aiOriginalDoc !== null) {
        _restoreAIOriginal(true)
        _aiOriginalDoc  = null
        _aiFrom         = null
        _aiTo           = null
        _aiResultTo     = null
      }
      _aiInProgress = false
    }

    window.findAndSelectText = function(query) {
      query = query.trim()
      if (!editor || !query) return
      const positions = []
      let text = ''
      editor.state.doc.descendants(function(node, pos) {
        if (node.isText) {
          if (positions.length > 0) {
            const prevEnd = positions[positions.length - 1] + 1
            if (pos - prevEnd > 2) {
              text += ' '
              positions.push(prevEnd)
            }
          }
          for (let i = 0; i < node.text.length; i++) {
            positions.push(pos + i)
          }
          text += node.text
        }
        return true
      })
      // Normalize smart quotes/NBSP -- 1:1 substitutions keep positions array valid
      function normTypo(s) {
        return s.replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/ /g, ' ')
      }
      const normText = normTypo(text)
      function tryFind(q) {
        let ms = findMatches(text, q, false)
        if (ms.length) return ms[0]
        ms = findMatches(normText, normTypo(q), false)
        if (ms.length) return ms[0]
        // Whitespace-tolerant fallback: anchors and editor text can disagree on
        // spacing around punctuation (e.g. "DSPM , Content" vs "DSPM, Content").
        ms = findMatchesLoose(normText, normTypo(q), false)
        return ms.length ? ms[0] : null
      }
      const m = tryFind(query)
      if (!m) return
      if (m.start >= positions.length || m.end - 1 >= positions.length) return
      // Expand to the full sentence containing the anchor.
      // Paragraph boundaries have a gap of 3; inline atoms (footnotes etc.) a gap of 2 —
      // use > 2 so inline atoms don't prematurely stop the walk.
      // Walk backward to sentence start (previous .!? or block boundary)
      let startIdx = m.start
      while (startIdx > 0) {
        if (positions[startIdx] - positions[startIdx - 1] > 2) break  // block boundary
        if ('.!?'.includes(text[startIdx - 1])) break                 // end of prev sentence
        startIdx--
      }
      while (startIdx < m.start && text[startIdx] === ' ') startIdx++ // skip leading space
      // Walk forward to sentence end (.!? or block boundary); 300-char cap for unpunctuated sentences
      let endIdx = m.end
      while (endIdx < positions.length && endIdx - m.end < 300) {
        if (positions[endIdx] - positions[endIdx - 1] > 2) break  // block boundary
        endIdx++
        if ('.!?'.includes(text[endIdx - 1])) break               // sentence end
      }
      const from = positions[startIdx]
      const to = positions[Math.min(endIdx, positions.length) - 1] + 1
      editor.chain().focus().setTextSelection({ from, to }).scrollIntoView().run()
    }

    // ── Toolbar overflow fade ─────────────────────────
    const tbEl = document.getElementById('toolbar')
    const tbWrap = document.createElement('div')
    tbWrap.id = 'toolbar-wrap'
    tbEl.parentNode.insertBefore(tbWrap, tbEl)
    tbWrap.appendChild(tbEl)

    function _updateToolbarFade() {
      const atEnd = tbEl.scrollLeft + tbEl.clientWidth >= tbEl.scrollWidth - 1
      tbWrap.classList.toggle('overflowing', tbEl.scrollWidth > tbEl.clientWidth && !atEnd)
    }
    tbEl.addEventListener('scroll', _updateToolbarFade)
    window.addEventListener('resize', _updateToolbarFade)
    _updateToolbarFade()
  </script>
</body>
</html>
