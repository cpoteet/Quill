  <script src="./editor-transforms.js"></script>
  <script src="./block-parser-bundle.js"></script>
  <script src="./block-serializer.js"></script>
  <script src="./block-descriptors.js"></script>
  <script src="./block-settings.js"></script>
  <script>
    const {
      Editor, Extension, TiptapNode, Mark,
      StarterKit, Underline,
      Table, TableRow, TableCell, TableHeader,
      TiptapImage, Blockquote, Link,

      Placeholder,
      Plugin, PluginKey,
      DecorationSet, Decoration,
      Paragraph, Heading, BulletList, OrderedList, ListItem, CodeBlock,
      HorizontalRule,
    } = TiptapBundle

    // Extend a Tiptap extension to preserve arbitrary class and id attributes
    // through the ProseMirror schema, so visual edits don't strip them.
    function withClassAttr(extension) {
      return extension.extend({
        addAttributes() {
          return {
            ...this.parent?.(),
            class: {
              default: null,
              keepOnSplit: false,
              parseHTML: element => element.getAttribute('class') || null,
              renderHTML: attributes => {
                if (!attributes.class) return {}
                return { class: attributes.class }
              },
            },
            id: {
              default: null,
              keepOnSplit: false,
              parseHTML: element => element.getAttribute('id') || null,
              renderHTML: attributes => {
                if (!attributes.id) return {}
                return { id: attributes.id }
              },
            },
          }
        },
      })
    }

    // core/table's markup is a <figure> wrapping the <table>, with the block's
    // classes and its <figcaption> on the figure. Without this rule the parser
    // walked straight past the figure to the inner table: the classes were
    // invisible and the caption was orphaned into a loose paragraph. caption is
    // source: "rich-text", so it rides the markup and never the delimiter.
    const TableWithFigure = Table.extend({
      parseHTML() {
        // A classic <caption> is read by the caption attribute below, never as a row.
        return [{ tag: 'figure.wp-block-table', contentElement: 'table' }, ...(this.parent?.() || []), { tag: 'caption', ignore: true }]
      },
      addAttributes() {
        return {
          ...this.parent?.(),
          caption: {
            default: null,
            keepOnSplit: false,
            parseHTML: el => {
              const cap = el.querySelector(el.tagName === 'FIGURE' ? ':scope > figcaption' : ':scope > caption')
              return cap ? cap.innerHTML : null
            },
            renderHTML: attrs => attrs.caption ? { 'data-quill-caption': attrs.caption } : {},
          },
          // Core omits the key when true and writes the class, so markup wins.
          hasFixedLayout: {
            default: true,
            keepOnSplit: false,
            parseHTML: el => {
              const inner = el.tagName === 'FIGURE' ? el.querySelector(':scope > table') : el
              if (inner && inner.classList.contains('has-fixed-layout')) return true
              const key = blockCommentAttr(el, 'hasFixedLayout')
              return key === undefined ? false : !!key
            },
            renderHTML: attrs => ({ 'data-quill-fixed-layout': attrs.hasFixedLayout ? 'true' : 'false' }),
          },
        }
      },
    })

    // Tiptap's schema has no sections, so a row remembers which one it came
    // from and the save transform regroups them in core's fixed order.
    const TableRowWithSection = TableRow.extend({
      addAttributes() {
        return {
          ...this.parent?.(),
          rowType: {
            default: 'body',
            keepOnSplit: false,
            parseHTML: el => {
              const section = el.parentElement && el.parentElement.tagName
              if (section === 'THEAD') return 'head'
              if (section === 'TFOOT') return 'foot'
              return 'body'
            },
            renderHTML: attrs => attrs.rowType && attrs.rowType !== 'body' ? { 'data-quill-row': attrs.rowType } : {},
          },
        }
      },
    })

    const ParagraphWithClass  = withBlockAttrs(withClassAttr(Paragraph))
    const HeadingWithClass    = withBlockAttrs(withClassAttr(Heading))
    const _fnPassthrough = new Set(['Backspace', 'Delete'])
    const BulletListWithClass = withBlockAttrs(withClassAttr(BulletList.extend({
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, (...args) => _isInFootnote() ? !_fnPassthrough.has(k) : fn(...args)]))
      },
    })))
    const OrderedListWithClass = withBlockAttrs(withClassAttr(OrderedList.extend({
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, (...args) => _isInFootnote() ? !_fnPassthrough.has(k) : fn(...args)]))
      },
    })))
    const ListItemWithClass   = withBlockAttrs(withClassAttr(ListItem))

    // ── ImageNodeView ─────────────────────────────────
    class ImageNodeView {
      constructor(node, editor, getPos) {
        this.node    = node
        this.editor  = editor
        this.getPos  = getPos

        this.wrapper = document.createElement('div')
        this.wrapper.className = 'image-wrapper'

        this.frame = document.createElement('div')
        this.frame.className = 'image-frame'
        this.frame.contentEditable = 'false'

        this.img = document.createElement('img')
        this._applyAttrs(node.attrs)
        this.frame.appendChild(this.img)

        for (const pos of ['nw','n','ne','e','se','s','sw','w']) {
          const h = document.createElement('div')
          h.className = `resize-handle ${pos}`
          h.addEventListener('mousedown', e => this._onHandleMousedown(e, pos))
          this.frame.appendChild(h)
        }

        this.wrapper.appendChild(this.frame)

        this.figcaption = document.createElement('figcaption')
        this.figcaption.className = 'caption-placeholder'
        this.wrapper.appendChild(this.figcaption)

        this.dom        = this.wrapper
        this.contentDOM = this.figcaption
      }

      _applyAttrs(attrs) {
        this.img.src = attrs.src || ''
        if (attrs.alt) { this.img.alt = attrs.alt } else { this.img.removeAttribute('alt') }
        if (attrs.title) this.img.title = attrs.title
        if (attrs.width != null) {
          this.img.style.width = ''
          this.img.width = attrs.width
          this.frame.style.width = attrs.width + 'px'
        } else {
          this.img.style.width = ''
          this.img.removeAttribute('width')
          this.frame.style.width = ''
        }
        if (attrs.height != null) {
          this.img.style.height = ''
          this.img.height = attrs.height
        } else {
          this.img.style.height = ''
          this.img.removeAttribute('height')
        }
        // Alignment
        this.wrapper.classList.remove('align-left', 'align-right', 'align-center')
        if (attrs.alignment) this.wrapper.classList.add(`align-${attrs.alignment}`)
        // The node view replaces renderHTML, so the figure's style token only
        // reaches the canvas if it is copied onto the wrapper here.
        const styleToken = _styleTokenIn(attrs.figureClass) || _styleTokenIn(carriedClassName(attrs.blockAttrs))
        for (const c of Array.from(this.wrapper.classList)) {
          if (c.startsWith('is-style-')) this.wrapper.classList.remove(c)
        }
        if (styleToken) this.wrapper.classList.add(styleToken)
      }

      update(node) {
        if (node.type.name !== 'image') return false
        this.node = node
        this._applyAttrs(node.attrs)
        // Toggle placeholder class: present when caption is empty
        const hasCaption = node.content.size > 0
        this.figcaption.classList.toggle('caption-placeholder', !hasCaption)
        // Sync toolbar inputs if this image is currently selected
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) {
          document.getElementById('img-tb-w').value   = node.attrs.width  ?? ''
          document.getElementById('img-tb-h').value   = node.attrs.height ?? ''
          document.getElementById('img-tb-alt').value = node.attrs.alt    ?? ''
          const linkBtn = document.getElementById('img-tb-link')
          if (linkBtn) linkBtn.classList.toggle('active', node.attrs.linkTo === 'media')
        }
        return true
      }

      selectNode() {
        this.wrapper.classList.add('selected')
        _showImageToolbar(this)
      }

      deselectNode() {
        this.wrapper.classList.remove('selected')
        // Delay so toolbar inputs can receive focus before we check
        setTimeout(() => {
          const tb = document.getElementById('image-toolbar')
          if (tb && tb.contains(document.activeElement)) return
          if (tb?._activeNodeView === this) _hideImageToolbar()
        }, 80)
      }

      destroy() {
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) _hideImageToolbar()
      }

      stopEvent(e) {
        if (e.type !== 'mousedown') return false
        if (e.target.classList.contains('resize-handle')) return true
        // Non-leaf nodes with contentDOM: ProseMirror maps any click inside the
        // wrapper to a text cursor inside figcaption rather than a NodeSelection.
        // Intercept clicks on the image area (not the caption) and dispatch a
        // NodeSelection manually so selectNode() fires and the toolbar appears.
        if (!this.figcaption.contains(e.target)) {
          e.preventDefault()
          const pos = this.getPos()
          if (typeof pos === 'number') {
            this.editor.commands.setNodeSelection(pos)
          }
          return true
        }
        return false
      }

      ignoreMutation(mutation) {
        // Allow ProseMirror to track text changes inside the figcaption (contentDOM)
        if (this.figcaption.contains(mutation.target)) return false
        return true
      }

      _onHandleMousedown(e, handlePos) {
        e.preventDefault()
        e.stopPropagation()

        const startX   = e.clientX
        const startY   = e.clientY
        const startW   = this.img.offsetWidth  || 300
        const startH   = this.img.offsetHeight || 200
        const ratio    = startW / startH
        const isCorner = ['nw','ne','sw','se'].includes(handlePos)
        const wSign    = handlePos.includes('e') ? 1 : handlePos.includes('w') ? -1 : 0
        const hSign    = handlePos.includes('s') ? 1 : handlePos.includes('n') ? -1 : 0

        const onMove = me => {
          const dx = (me.clientX - startX) * wSign
          const dy = (me.clientY - startY) * hSign
          let newW = startW
          let newH = startH

          if (isCorner && !me.shiftKey) {
            newW = Math.max(50, startW + dx)
            newH = newW / ratio
          } else {
            if (wSign !== 0) newW = Math.max(50, startW + dx)
            if (hSign !== 0) newH = Math.max(50, startH + dy)
          }

          newW = Math.round(newW)
          newH = Math.round(newH)

          this.img.style.width  = newW + 'px'
          this.img.style.height = newH + 'px'
          this.frame.style.width = newW + 'px'

          const wIn = document.getElementById('img-tb-w')
          const hIn = document.getElementById('img-tb-h')
          if (wIn) wIn.value = newW
          if (hIn) hIn.value = newH
        }

        const onUp = () => {
          document.removeEventListener('mousemove', onMove)
          document.removeEventListener('mouseup', onUp)

          const newW = Math.round(parseFloat(this.img.style.width)  || this.img.offsetWidth)
          const newH = Math.round(parseFloat(this.img.style.height) || this.img.offsetHeight)
          this.img.style.width  = ''
          this.img.style.height = ''

          const pos = this.getPos()
          if (typeof pos === 'number') {
            const { state, dispatch } = this.editor.view
            dispatch(state.tr.setNodeMarkup(pos, null, { ...this.node.attrs, width: newW, height: newH }))
          }
        }

        document.addEventListener('mousemove', onMove)
        document.addEventListener('mouseup', onUp)
      }
    }

    // ── Image toolbar helpers ──────────────────────────
    function _positionImageToolbar(tb, wrapper) {
      const wRect = wrapper.getBoundingClientRect()
      const tbWrap = document.getElementById('toolbar-wrap')
      const minTop = tbWrap ? tbWrap.getBoundingClientRect().bottom : 0
      tb.style.left = wRect.left + 'px'
      tb.style.top  = Math.max(wRect.bottom + 6, minTop) + 'px'
    }

    function _showImageToolbar(nv) {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      tb._activeNodeView = nv
      function fillDims() {
        let w = nv.node.attrs.width
        let h = nv.node.attrs.height
        if (w == null && nv.img.naturalWidth)  w = nv.img.naturalWidth
        if (h == null && nv.img.naturalHeight) h = nv.img.naturalHeight
        document.getElementById('img-tb-w').value = w ?? ''
        document.getElementById('img-tb-h').value = h ?? ''
      }
      fillDims()
      if (nv.node.attrs.width == null && !nv.img.naturalWidth) {
        nv.img.addEventListener('load', function onLoad() {
          nv.img.removeEventListener('load', onLoad)
          if (tb._activeNodeView === nv) fillDims()
        })
      }
      document.getElementById('img-tb-alt').value = nv.node.attrs.alt    ?? ''
      _updateNamedSizeButtons(null)

      _positionImageToolbar(tb, nv.wrapper)
      tb.style.display = 'flex'

      // Remove any stale scroll listener before attaching a new one
      if (tb._scrollHandler) {
        document.getElementById('editor-wrap').removeEventListener('scroll', tb._scrollHandler)
      }
      tb._scrollHandler = () => _positionImageToolbar(tb, nv.wrapper)
      document.getElementById('editor-wrap').addEventListener('scroll', tb._scrollHandler)

      if (nv.node.attrs.mediaId != null) {
        window.webkit?.messageHandlers?.requestMediaSizes
          ?.postMessage({ mediaId: nv.node.attrs.mediaId })
      }
    }

    function _hideImageToolbar() {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      if (tb._scrollHandler) {
        document.getElementById('editor-wrap').removeEventListener('scroll', tb._scrollHandler)
        tb._scrollHandler = null
      }
      tb.style.display = 'none'
      tb._activeNodeView = null
      const altIn = document.getElementById('img-tb-alt')
      if (altIn) altIn.value = ''
    }

    function _updateNamedSizeButtons(sizes) {
      document.querySelectorAll('#image-toolbar [data-size]').forEach(btn => {
        if (!sizes || !sizes[btn.dataset.size]) {
          btn.style.display = 'none'
          btn._sizeData = null
        } else {
          btn.style.display = ''
          btn.disabled = false
          btn._sizeData = sizes[btn.dataset.size]
        }
      })
      const linkBtn = document.getElementById('img-tb-link')
      if (linkBtn) {
        // Always available — falls back to the image's current src as the "full"
        // URL when no media-library size data is known (e.g. externally-sourced
        // images with no mediaId). Without this, an already-linked image with no
        // mediaId would show no way to see or remove that link.
        linkBtn.style.display = ''
        const tb = document.getElementById('image-toolbar')
        linkBtn.classList.toggle('active', tb?._activeNodeView?.node.attrs.linkTo === 'media')
      }
    }

    // ── ResizableImage extension ──────────────────────
    const ResizableImage = TiptapImage.extend({
      addAttributes() {
        return {
          ...this.parent?.(),
          width: {
            default: null,
            parseHTML: el => imgPixelDimension(el, 'width'),
            renderHTML: attrs => attrs.width != null ? { width: attrs.width } : {},
          },
          height: {
            default: null,
            parseHTML: el => imgPixelDimension(el, 'height'),
            renderHTML: attrs => attrs.height != null ? { height: attrs.height } : {},
          },
          mediaId: {
            default: null,
            parseHTML: el => {
              const dataId = el.getAttribute('data-media-id')
              if (dataId) return parseInt(dataId, 10)
              const m = (el.getAttribute('class') || '').match(/wp-image-(\d+)/)
              return m ? parseInt(m[1], 10) : null
            },
            renderHTML: attrs => attrs.mediaId != null ? { 'data-media-id': attrs.mediaId } : {},
          },
          alignment: {
            default: null,
            parseHTML: el => extractAlignment(el.getAttribute('class') || ''),
            renderHTML: attrs => attrs.alignment ? { class: `align${attrs.alignment}` } : {},
          },
          imgClass: {
            default: null,
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              const cls = img?.getAttribute('class') || ''
              const known = /^(alignleft|alignright|aligncenter|wp-image-\d+)$/
              const custom = cls.split(/\s+/).filter(c => c && !known.test(c)).join(' ')
              return custom || null
            },
            renderHTML: attrs => attrs.imgClass ? { class: attrs.imgClass } : {},
          },
          // WP 7.1's "Mark as decorative" image toggle saves role="none" on the
          // <img>. Preserved verbatim so the accessibility semantic survives a
          // Quill edit; works under the bare `img[src]` rule too, which has no
          // getAttrs of its own.
          imgRole: {
            default: null,
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              return img?.getAttribute('role') || null
            },
            renderHTML: attrs => attrs.imgRole ? { role: attrs.imgRole } : {},
          },
          figureClass: {
            default: null,
            rendered: false,
            parseHTML: () => null,
          },
          figureId: {
            default: null,
            rendered: false,
            parseHTML: () => null,
          },
          linkTo: {
            default: 'none',
            rendered: false,
            // Fallback for parse rules with no getAttrs of their own (e.g. the bare
            // `img[src]` rule matching classic/pre-Gutenberg content with no figure
            // wrapper) — el is whatever the rule matched (figure or img directly).
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              const linkEl = img?.parentElement
              return (linkEl && linkEl.tagName === 'A' && linkEl.getAttribute('href')) ? 'media' : null
            },
          },
          linkHref: {
            default: null,
            rendered: false,
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              const linkEl = img?.parentElement
              return (linkEl && linkEl.tagName === 'A' && linkEl.getAttribute('href')) || null
            },
          },
        }
      },
      content: 'inline*',

      renderHTML({ node, HTMLAttributes }) {
        const figureAttrs = {}
        if (node.attrs.figureClass) figureAttrs.class = node.attrs.figureClass
        if (node.attrs.figureId) figureAttrs.id = node.attrs.figureId
        const imgSpec = ['img', HTMLAttributes]
        const imageContent = (node.attrs.linkTo === 'media' && node.attrs.linkHref)
          ? ['a', { href: node.attrs.linkHref }, imgSpec]
          : imgSpec
        return ['figure', figureAttrs, imageContent, ['figcaption', 0]]
      },

      parseHTML() {
        const figureAttrs = el => {
          const img = el.querySelector('img')
          if (!img) return false
          const dataId = img.getAttribute('data-media-id')
          const imgCls = img.getAttribute('class') || ''
          const clsMatch = imgCls.match(/wp-image-(\d+)/)
          const _knownImgCls = /^(alignleft|alignright|aligncenter|wp-image-\d+)$/
          const customImgCls = imgCls.split(/\s+/).filter(c => c && !_knownImgCls.test(c)).join(' ')
          const figCls = el.getAttribute('class') || ''
          // is-resized is rebuilt from the dimensions on save, so carrying
          // it here would leave it on an image the user later un-resized.
          const _knownFigCls = /^(wp-block-image|alignleft|alignright|aligncenter|is-resized)$/
          const customFigCls = figCls.split(/\s+/).filter(c => c && !_knownFigCls.test(c)).join(' ')
          const linkEl = img.parentElement
          const linkedToMedia = linkEl && linkEl.tagName === 'A' && !!linkEl.getAttribute('href')
          return {
            src:       img.getAttribute('src'),
            alt:       img.getAttribute('alt') ?? null,
            title:     img.getAttribute('title') ?? null,
            width:     imgPixelDimension(img, 'width'),
            height:    imgPixelDimension(img, 'height'),
            mediaId:   dataId ? parseInt(dataId, 10)
                              : (clsMatch ? parseInt(clsMatch[1], 10) : null),
            alignment: extractAlignment(figCls),
            imgClass:    customImgCls || null,
            figureClass: customFigCls || null,
            figureId:  el.getAttribute('id') || null,
            linkTo:    linkedToMedia ? 'media' : 'none',
            linkHref:  linkedToMedia ? linkEl.getAttribute('href') : null,
          }
        }
        const captionElement = el => el.querySelector('figcaption') || el.appendChild(document.createElement('figcaption'))
        return [
          { tag: 'figure.wp-block-image', getAttrs: figureAttrs, contentElement: captionElement },
          // A classic figure holding just an image, as HTML from outside Gutenberg writes it.
          {
            tag: 'figure',
            getAttrs: el => (/\bwp-block-/.test(el.className) || !el.querySelector(':scope > img, :scope > a > img')) ? false : figureAttrs(el),
            contentElement: captionElement,
          },
          { tag: 'img[src]' },
        ]
      },
      addProseMirrorPlugins() {
        const ed = this.editor
        return [new Plugin({
          key: new PluginKey('imageCaptionExit'),
          props: {
            handleKeyDown(view, event) {
              if (event.key !== 'Enter' || event.shiftKey || event.metaKey || event.ctrlKey) return false
              const { $from } = view.state.selection
              const imgDepth = _ancestorDepth($from, 'image')
              if (imgDepth === -1) return false
              event.preventDefault()
              const after = $from.after(imgDepth)
              ed.chain()
                .insertContentAt(after, { type: 'paragraph' })
                .setTextSelection(after + 1)
                .focus()
                .scrollIntoView()
                .run()
              return true
            },
          },
        })]
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new ImageNodeView(node, editor, getPos)
      },
    })

    // ── Cite node ─────────────────────────────────────────
    // Optional last child of blockquote. Maps to <cite> in WordPress/Gutenberg.
    // No 'group' — cannot be inserted anywhere block is accepted; only blockquote
    // schema allows it via 'block+ cite?'.
    const Cite = withClassAttr(TiptapNode.create({
      name: 'cite',
      content: 'inline*',
      parseHTML() {
        return [{ tag: 'cite' }]
      },
      renderHTML({ HTMLAttributes }) {
        return ['cite', HTMLAttributes, 0]
      },
      addKeyboardShortcuts() {
        return {
          Enter: () => {
            const { state } = this.editor
            const { $from } = state.selection
            if ($from.node($from.depth).type.name !== 'cite') return false
            const bqDepth = _citeHostDepth($from)
            if (bqDepth === -1) return false
            // Insert a paragraph immediately after the blockquote
            const after = $from.after(bqDepth)
            const para = state.schema.nodes.paragraph.create()
            const tr = state.tr.insert(after, para)
            const resolved = tr.doc.resolve(after + 1)
            tr.setSelection(state.selection.constructor.near(resolved))
            this.editor.view.dispatch(tr)
            return true
          },
          Backspace: () => {
            const { state } = this.editor
            const { $from, empty } = state.selection
            if (!empty) return false
            const node = $from.node($from.depth)
            if (node.type.name !== 'cite' || node.content.size > 0) return false
            return this.editor.commands.deleteNode('cite')
          },
        }
      },
    }))

    // ── Embed block ───────────────────────────────────
    // Atomic block storing the embed URL. Saved HTML is the Gutenberg embed
    // figure; in the editor it renders as a static placeholder card (no
    // third-party network requests).
    class EmbedNodeView {
      constructor(node) {
        this.dom = document.createElement('div')
        this.dom.className = 'embed-card'
        const p = detectEmbedProvider(node.attrs.url)
        const provider = document.createElement('div')
        provider.className = 'embed-card-provider'
        provider.textContent = p
          ? p.slug.charAt(0).toUpperCase() + p.slug.slice(1) + ' embed'
          : 'Embed'
        const url = document.createElement('div')
        url.className = 'embed-card-url'
        url.textContent = node.attrs.url
        const hint = document.createElement('div')
        hint.className = 'embed-card-hint'
        hint.textContent = 'Renders on your published site'
        this.dom.append(provider, url, hint)
      }
      selectNode()   { this.dom.classList.add('selected') }
      deselectNode() { this.dom.classList.remove('selected') }
    }

    const EmbedBlock = TiptapNode.create({
      name: 'embedBlock',
      group: 'block',
      atom: true,
      draggable: true,
      priority: 110,

      addAttributes() {
        return {
          url:     { default: '' },
          caption: { default: null },
        }
      },

      parseHTML() {
        return [{
          tag: 'figure.wp-block-embed',
          getAttrs: el => {
            const wrapper = el.querySelector('.wp-block-embed__wrapper')
            const url = wrapper ? wrapper.textContent.trim() : ''
            if (!url) return false
            const fc = el.querySelector('figcaption')
            return { url, caption: fc ? fc.outerHTML : null }
          },
        }]
      },

      renderHTML({ node }) {
        const figure = document.createElement('figure')
        figure.className = embedClassFor(node.attrs.url)
        const wrapper = document.createElement('div')
        wrapper.className = 'wp-block-embed__wrapper'
        wrapper.appendChild(document.createTextNode('\n' + node.attrs.url + '\n'))
        figure.appendChild(wrapper)
        if (node.attrs.caption) figure.insertAdjacentHTML('beforeend', node.attrs.caption)
        return figure
      },

      addNodeView() {
        return ({ node }) => new EmbedNodeView(node)
      },
    })

    // ── Gallery block ─────────────────────────────────
    // Atomic block storing an ordered image list + gallery-wide settings.
    // Saved HTML is the Gutenberg gallery figure (nested wp-block-image
    // figures, wrapped with wp:gallery/wp:image comments by toWordPressHTML);
    // in the editor it renders as a static thumbnail-grid card — all editing
    // happens in the native GallerySheet, not in Tiptap. Read-only: galleries
    // loaded from existing posts render the same card but are not re-openable
    // for editing in v1.
    class GalleryNodeView {
      constructor(node) {
        this.dom = document.createElement('div')
        this.dom.className = 'gallery-card'
        const grid = document.createElement('div')
        grid.className = 'gallery-card-grid'
        node.attrs.images.forEach(image => {
          const img = document.createElement('img')
          img.src = image.url
          img.alt = image.alt || ''
          grid.appendChild(img)
        })
        const hint = document.createElement('div')
        hint.className = 'gallery-card-hint'
        const count = node.attrs.images.length
        hint.textContent = `${count} image${count === 1 ? '' : 's'} · Renders as a WordPress gallery`
        this.dom.append(grid, hint)
      }
      selectNode()   { this.dom.classList.add('selected') }
      deselectNode() { this.dom.classList.remove('selected') }
    }

    const GalleryBlock = TiptapNode.create({
      name: 'galleryBlock',
      group: 'block',
      atom: true,
      draggable: true,
      priority: 110,

      addAttributes() {
        return {
          images:     { default: [] },
          columns:    { default: 3 },
          cropped:    { default: true },
          linkTo:     { default: 'none' },
          sizeSlug:   { default: 'large' },
          // Verbatim copy of the original figure's outerHTML, captured on load.
          // When set, renderHTML re-emits this unchanged instead of reconstructing
          // from the structured attrs above — preserves captions, original
          // sizeSlug, and anything else Quill doesn't model. null for
          // sheet-inserted galleries, which always use the reconstruction path.
          sourceHTML: { default: null },
        }
      },

      parseHTML() {
        return [{
          tag: 'figure.wp-block-gallery',
          getAttrs: el => {
            const imageFigures = Array.from(el.querySelectorAll('figure.wp-block-image'))
            if (imageFigures.length === 0) return false
            const images = imageFigures.map(fig => {
              const img = fig.querySelector('img')
              const idMatch = img?.className.match(/wp-image-(\d+)/)
              return {
                id: idMatch ? parseInt(idMatch[1], 10) : null,
                url: img?.getAttribute('src') || '',
                alt: img?.getAttribute('alt') || '',
                caption: fig.querySelector('figcaption')?.textContent || '',
              }
            })
            const columnsMatch = el.className.match(/columns-(\d+)/)
            const firstImg = imageFigures[0].querySelector('img')
            const sizeMatch = imageFigures[0].className.match(/size-(\S+)/)
            return {
              images,
              columns: columnsMatch ? parseInt(columnsMatch[1], 10) : 3,
              cropped: el.classList.contains('is-cropped'),
              linkTo: firstImg?.parentElement.tagName === 'A' ? 'media' : 'none',
              sizeSlug: sizeMatch ? sizeMatch[1] : 'large',
              sourceHTML: el.outerHTML,
            }
          },
        }]
      },

      renderHTML({ node }) {
        if (node.attrs.sourceHTML) {
          const wrapper = document.createElement('div')
          wrapper.innerHTML = node.attrs.sourceHTML
          return wrapper.firstElementChild
        }
        const figure = document.createElement('figure')
        figure.className = `wp-block-gallery has-nested-images columns-${node.attrs.columns}` +
          (node.attrs.cropped ? ' is-cropped' : '')
        node.attrs.images.forEach(image => {
          const imgFigure = document.createElement('figure')
          imgFigure.className = `wp-block-image size-${node.attrs.sizeSlug || 'large'}`
          const img = document.createElement('img')
          img.setAttribute('src', image.url)
          img.setAttribute('alt', image.alt || '')
          if (image.id) img.classList.add(`wp-image-${image.id}`)
          if (node.attrs.linkTo === 'media') {
            const a = document.createElement('a')
            a.setAttribute('href', image.fullUrl || image.url)
            a.appendChild(img)
            imgFigure.appendChild(a)
          } else {
            imgFigure.appendChild(img)
          }
          // Plain text only — textContent, never innerHTML: caption text comes
          // straight from a TextField in GallerySheet and must not inject markup.
          if (image.caption) {
            const cap = document.createElement('figcaption')
            cap.className = 'wp-element-caption'
            cap.textContent = image.caption
            imgFigure.appendChild(cap)
          }
          figure.appendChild(imgFigure)
        })
        return figure
      },

      addNodeView() {
        return ({ node }) => new GalleryNodeView(node)
      },
    })

    // ── Generic Gutenberg block passthrough ────────────
    // Catches any wp-block-* classed element (other than a <figure>, which
    // Quill's own image/gallery/embed/table rules already own or
    // transparently pass through) that no other, higher-priority parse rule
    // claimed. Renders as a static, non-editable card labeled "Not editable
    // in the visual editor"; saves the original markup back byte-for-byte,
    // regenerating any original wp:name comments. See docs/superpowers/specs/
    // 2026-07-12-gutenberg-passthrough-block-design.md.
    function _peekText(source) {
      const inner = source.replace(/^<!--[\s\S]*?-->/, '').replace(/<!-- \/wp:[\s\S]*?-->$/, '').trim()
      const text = inner || source.trim()
      return text.length > 120 ? text.slice(0, 120) + '…' : text
    }

    class PassthroughNodeView {
      constructor(node) {
        this.dom = document.createElement('div')
        this.dom.className = 'passthrough-card'
        const label = document.createElement('div')
        label.className = 'passthrough-card-label'
        label.textContent = node.attrs.blockLabel
        this.dom.append(label)
        if (node.attrs.unsupportedSource) {
          const peek = document.createElement('div')
          peek.className = 'passthrough-card-peek'
          // textContent, never innerHTML: the peek shows markup, it must not become it.
          peek.textContent = _peekText(node.attrs.unsupportedSource)
          this.dom.append(peek)
        }
        const hint = document.createElement('div')
        hint.className = 'passthrough-card-hint'
        hint.textContent = 'Not editable in the visual editor; use Code View (</>)'
        this.dom.append(hint)
      }
      selectNode()   { this.dom.classList.add('selected') }
      deselectNode() { this.dom.classList.remove('selected') }
    }

    // Priority 210 out-ranks gutenbergPassthrough (200) so the catch-all stops
    // claiming these as frozen cards.
    const ColumnBlock = TiptapNode.create({
      name: 'columnBlock',
      group: 'column',
      content: 'block+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-column' }] },
      renderHTML() { return ['div', { class: 'wp-block-column' }, 0] },
    })

    const ColumnsBlock = TiptapNode.create({
      name: 'columnsBlock',
      group: 'block',
      content: 'column+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-columns' }] },
      renderHTML() { return ['div', { class: 'wp-block-columns' }, 0] },
    })

    const DetailsSummary = TiptapNode.create({
      name: 'detailsSummary',
      content: 'inline*',
      priority: 210,
      parseHTML() { return [{ tag: 'summary' }] },
      renderHTML() { return ['summary', 0] },
    })

    // A block attribute that lives only in the <!-- wp:name {...} --> delimiter
    // is invisible to ProseMirror's DOM parser, so editing the block used to
    // drop it. The comment node is still reachable from the element being
    // parsed, so the whole attribute object rides along on the node and
    // toWordPressHTML re-emits it. Each container node renders a fixed
    // attribute object and ignores HTMLAttributes, so the carrier is injected
    // into the parent's own output rather than via addGlobalAttributes.
    function toggleBlockAttrCommand(typeName, attr) {
      return () => ({ state, tr, dispatch }) => {
        const $from = state.selection.$from
        for (let d = $from.depth; d >= 1; d--) {
          const node = $from.node(d)
          if (node.type.name !== typeName) continue
          if (dispatch) {
            dispatch(tr.setNodeMarkup($from.before(d), undefined,
              { ...node.attrs, [attr]: !node.attrs[attr] }))
          }
          return true
        }
        return false
      }
    }

    function blockCommentAttrsJSON(element) {
      let n = element.previousSibling
      while (n && n.nodeType === 3 && n.textContent.trim() === '') n = n.previousSibling
      if (!n || n.nodeType !== 8) return null
      const m = n.nodeValue.match(/^\s*wp:\S+\s+(\{[\s\S]*\})\s*$/)
      return m ? m[1] : null
    }

    // Read one key from the delimiter comment only, never from the carrier
    // attribute: an element Quill itself rendered has no preceding comment, so
    // its own DOM attribute is the live value and a stale carrier cannot
    // resurrect an attribute the user just turned off.
    function hasBlockComment(element) {
      let n = element.previousSibling
      while (n && n.nodeType === 3 && n.textContent.trim() === '') n = n.previousSibling
      return !!(n && n.nodeType === 8 && /^\s*wp:/.test(n.nodeValue))
    }

    function blockCommentAttr(element, key) {
      const raw = blockCommentAttrsJSON(element)
      if (!raw) return undefined
      try {
        const parsed = JSON.parse(raw)
        return (parsed && typeof parsed === 'object') ? parsed[key] : undefined
      } catch (e) {
        return undefined
      }
    }

    function carriedClassName(raw) {
      try {
        const parsed = JSON.parse(raw)
        return (parsed && typeof parsed.className === 'string') ? parsed.className : ''
      } catch (e) {
        return ''
      }
    }

    // ── The generic attribute carrier ────────────────
    // A node's renderHTML writes a fixed list of attributes, so everything else
    // the original element carried was dropped the first time the user typed.
    // The snapshot replays the rest, in the source's own attribute order, with
    // no registry entry and no node modelling involved.

    // Attributes the node draws for itself. Replaying one would resurrect a
    // value the user has just turned off, so the node's own render is the only
    // writer; a node that computes any part of its class lists `class` here.
    const RAW_ATTRS_MODELED = {
      accordionHeading: ['class'],
      accordionItem: ['class'],
      detailsBlock: ['open'],
      orderedList: ['start', 'type'],
      tableCell: ['colspan', 'rowspan', 'colwidth'],
      tableHeader: ['colspan', 'rowspan', 'colwidth'],
    }

    // The four figure blocks rebuild their figure from modelled attributes and
    // toWordPressHTML rewrites it again; a replay would fight both.
    const RAW_ATTRS_EXEMPT = new Set(['image', 'galleryBlock', 'embedBlock', 'table'])

    // Children a node renders from a template, and the attributes it owns on each.
    const RAW_CHILD_ATTRS = {
      buttonBlock: { a: ['href'] },
      image: { a: ['href'], img: ['src', 'alt', 'title', 'width', 'height', 'class', 'role', 'data-media-id'] },
    }

    // Only the classes renderHTML hardcodes; rendered and registry ones are derived.
    const RAW_CLASS_OWNED = {
      accordionHeading: ['has-icon', 'has-icon-left', 'has-icon-right', 'wp-block-heading'],
      accordionItem: ['is-open'],
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    }

    function settingClassPatterns(nodeName, on) {
      const out = []
      for (const def of Object.values(settingsFor(nodeName))) {
        if ((def.on || null) !== (on || null)) continue
        if (def.kind === 'flagClass') out.push(new RegExp('^' + escapeRegExp(def.class) + '$'))
        else if (def.kind === 'valueClass') out.push(new RegExp('^' + def.pattern.split('{}').map(escapeRegExp).join('.+') + '$'))
      }
      return out
    }

    function settingAttrNames(nodeName, on) {
      return Object.values(settingsFor(nodeName))
        .filter(def => def.kind === 'attr' && (def.on || null) === (on || null))
        .map(def => def.attr)
    }

    // Source order first, then the node's own additions; see Resources/CLAUDE.md.
    function replayClassList(snapshotClassList, nodeName, renderedClass, on) {
      const ownedByNode = new Set(on ? [] : RAW_CLASS_OWNED[nodeName] || [])
      const patterns = settingClassPatterns(nodeName, on)
      const rendered = String(renderedClass || '').split(/\s+/).filter(Boolean)
      const isRendered = new Set(rendered)
      const out = String(snapshotClassList || '').split(/\s+/).filter(token =>
        token && (isRendered.has(token) || (!ownedByNode.has(token) && !patterns.some(re => re.test(token)))))
      const seen = new Set(out)
      for (const token of rendered) if (!seen.has(token)) { out.push(token); seen.add(token) }
      return out.join(' ')
    }

    // A carried attribute is replayed onto the live contenteditable and back
    // into post_content, so post content must not be able to smuggle script in.
    const CARRY_URL_ATTRS = new Set(['href', 'src', 'srcset', 'xlink:href', 'formaction', 'action', 'poster', 'background', 'cite', 'longdesc'])
    const CARRY_SCRIPT_URL = /^(?:javascript|vbscript):|^data:(?:text\/html|image\/svg)/

    function isCarryableAttr(name, value) {
      const lower = String(name).toLowerCase()
      if (lower.startsWith('on')) return false
      if (!CARRY_URL_ATTRS.has(lower)) return true
      // Whitespace and control characters are stripped first: a browser ignores
      // them inside a scheme, so "java\tscript:" would otherwise pass.
      return !CARRY_SCRIPT_URL.test(String(value).replace(/[\s\u0000-\u001f]/g, '').toLowerCase())
    }

    function elementAttrPairs(element) {
      const attrs = []
      for (const attr of Array.from(element.attributes)) {
        if (attr.name === 'data-quill-style') { attrs.push(['style', attr.value]); continue }
        if (attr.name.startsWith('data-quill-')) continue
        if (!isCarryableAttr(attr.name, attr.value)) continue
        attrs.push([attr.name, attr.value])
      }
      return attrs
    }

    function rawAttrsSnapshot(element, childTags) {
      const attrs = elementAttrPairs(element)
      const children = {}
      for (const tag of Object.keys(childTags || {})) {
        const child = element.querySelector(tag)
        if (child) children[tag] = elementAttrPairs(child)
      }
      const hasChildren = Object.keys(children).length > 0
      if (!attrs.length && !hasChildren) return null
      return JSON.stringify({ tag: element.tagName.toLowerCase(), attrs, children })
    }

    function snapshotClass(snap) {
      const hit = snap.attrs.find(([name]) => name === 'class')
      return hit ? hit[1] : ''
    }

    // The node's own values win, and an attribute it models but did not write
    // this time is gone rather than stale. Order comes from the snapshot, so a
    // block WordPress wrote comes back with its attributes where it left them.
    function replayRawAttrs(rendered, snap, modeled, klass) {
      const out = {}
      for (const [name, value] of snap.attrs) {
        if (name === 'class') { if (klass) out.class = klass; continue }
        if (name in rendered) out[name] = rendered[name]
        // ProseMirror re-serializes a rendered style; see Resources/CLAUDE.md.

        else if (!modeled.includes(name)) out[name] = value

      for (const name of Object.keys(rendered)) {
        if (name in out) continue

      if (klass && !('class' in out)) out.class = klass

    function replayChildAttrs(out, snap, nodeName) {
      for (const [tag, attrs] of Object.entries(snap.children || {})) {
        const target = settingTargetSpec(out, tag)
        if (!target) continue
        const rendered = specAttrs(target)
        const childSnap = { tag, attrs }
        const modeled = [...(RAW_CHILD_ATTRS[nodeName]?.[tag] || []), ...settingAttrNames(nodeName, tag)]
        target[1] = replayRawAttrs(rendered, childSnap, modeled,
          replayClassList(snapshotClass(childSnap), nodeName, rendered.class, tag))
      }
    }

    function withRawAttrs(extension) {
      return extension.extend({
        addAttributes() {
          const parent = this.parent?.() || {}
          const childTags = RAW_CHILD_ATTRS[this.name] || {}
          if (RAW_ATTRS_EXEMPT.has(this.name) && !Object.keys(childTags).length) return parent
          return {
            ...parent,
            rawAttrs: {
              default: null,
              keepOnSplit: false,
              parseHTML: element => rawAttrsSnapshot(element, childTags),
              renderHTML: () => ({}),

        renderHTML(props) {
          const out = this.parent?.(props)
          const raw = props.node.attrs.rawAttrs
          if (!raw || !Array.isArray(out) || typeof out[0] !== 'string') return out
          let snap = null
          try { snap = JSON.parse(raw) } catch (e) { return out }
          if (!snap || !Array.isArray(snap.attrs)) return out
          // An exempt node rebuilds its own root, so only its children carry.
          if (RAW_ATTRS_EXEMPT.has(this.name)) {
            replayChildAttrs(out, snap, this.name)
            return out
          }
          if (snap.tag !== out[0]) return out
          const rendered = specAttrs(out)
          const spec = props.node.type.spec.attrs || {}
          const modeled = RAW_ATTRS_MODELED[props.node.type.name] || []
          const ownsClass = 'class' in spec || modeled.includes('class')
          const name = props.node.type.name
          const klass = modeled.includes('class')
            ? replayClassList(snapshotClass(snap), name, rendered.class)
            : mergeClassNames(rendered.class, ownsClass ? props.node.attrs.class : snapshotClass(snap))
          out[1] = replayRawAttrs(rendered, snap, modeled, klass)
          replayChildAttrs(out, snap, name)
          return out
        },
      })

    // Composes withBlockSettings so a node cannot be added without its registry
    // settings, which is what keeps adding a setting to one line.
    function withBlockAttrs(extension) {
      return withRawAttrs(withBlockSettings(extension)).extend({
        addAttributes() {
          return {
            ...this.parent?.(),

              default: null,
              keepOnSplit: false,
              parseHTML: element => {
                const existing = element.getAttribute('data-quill-block-attrs')

                return blockCommentAttrsJSON(element)

              renderHTML: () => ({}),

          const carried = props.node && props.node.attrs && props.node.attrs.blockAttrs

          // Gallery and embed build their own element rather than a spec array.
          if (out && out.nodeType === 1) {

            const cls = mergeClassNames(out.getAttribute('class'), carriedClassName(carried))
            if (cls) out.setAttribute('class', cls)
            return out

          if (!Array.isArray(out)) return out
          const attrs = out[1]
          if (!attrs || typeof attrs !== 'object' || Array.isArray(attrs)) return out
          const merged = mergeClassNames(attrs.class, carriedClassName(carried))
          out[1] = { ...attrs, 'data-quill-block-attrs': carried }
          if (merged) out[1].class = merged
          return out
        },
      })

    // ── Registry-driven block settings ────────────────
    // block-settings.js says how each setting draws; these turn that into a
    // Tiptap attribute, so a node's parse and render come from data. Wrap as
    // withBlockAttrs(withBlockSettings(withClassAttr(X))): the class carrier
    // innermost, the delimiter carrier outermost, so the carried className
    // merges onto a class list the settings have already contributed to.

    function settingIsSet(def, value) {
      if (def.kind === 'flagClass') return value === def.when
      return value !== undefined && value !== null && value !== '' && value !== def.default
    }

    function settingClass(def, value) {
      if (def.kind === 'flagClass') return def.class
      return def.pattern.replace('{}', value)
    }

    // `on` is a tag name, not a selector: a render spec is an array tree with
    // no querySelector, and every setting Quill declares targets its element
    // or one descendant tag.
    function settingTargetSpec(spec, tag) {
      if (!tag) return spec
      if (!Array.isArray(spec)) return null
      if (spec[0] === tag) return spec
      for (const child of spec) {
        if (!Array.isArray(child)) continue
        const hit = settingTargetSpec(child, tag)
        if (hit) return hit
      }
      return null
    }

    function specAttrs(spec) {
      const second = spec[1]
      if (!second || typeof second !== 'object' || Array.isArray(second)) spec.splice(1, 0, {})
      return spec[1]
    }

    function applySettingToSpec(spec, def, value) {
      const target = settingTargetSpec(spec, def.on)
      if (!target) return
      const attrs = specAttrs(target)
      if (def.kind === 'attr') attrs[def.attr] = String(value)
      else if (def.kind === 'style') attrs.style = [attrs.style, `${def.property}:${value}`].filter(Boolean).join(';')
      else attrs.class = mergeClassNames(attrs.class, settingClass(def, value))
    }

    function applySettingToElement(el, def, value) {
      const target = def.on ? el.querySelector(def.on) : el
      if (!target) return
      if (def.kind === 'attr') target.setAttribute(def.attr, String(value))
      else if (def.kind === 'style') target.style.setProperty(def.property, value)
      else target.setAttribute('class', mergeClassNames(target.getAttribute('class'), settingClass(def, value)))
    }

    // The delimiter is Gutenberg's own source of truth; the markup is only its
    // output, so it is the fallback. A sourced setting has no comment to read.
    function parseBlockSetting(el, name, def) {
      if (!def.sourced) {
        const carried = blockCommentAttr(el, name)
        if (carried !== undefined) return carried
      }
      return readSettingFromElement(el, def)
    }

    function withBlockSettings(extension) {
      return extension.extend({
        addAttributes() {
          const generated = {}
          for (const [name, def] of Object.entries(settingsFor(this.name))) {
            if (def.kind === 'carried') continue
            generated[name] = {
              default: 'default' in def ? def.default : null,
              keepOnSplit: false,
              parseHTML: el => parseBlockSetting(el, name, def),
              renderHTML: () => ({}),
            }
