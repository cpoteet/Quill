  <div id="editor-wrap"><div id="editor"></div><textarea id="code-editor" spellcheck="false"></textarea></div>

  <script src="./tiptap-bundle.js"></script>
  <script src="./marked-bundle.js"></script>
  <script src="./editor-transforms.js"></script>
  <script src="./block-parser-bundle.js"></script>
  <script src="./block-serializer.js"></script>
  <script src="./block-descriptors.js"></script>
  <script>
    const {
      Editor, Extension, TiptapNode,
      StarterKit, Underline,
      Table, TableRow, TableCell, TableHeader,
      TiptapImage, Blockquote, Link,

      Placeholder,
      Plugin, PluginKey,
      DecorationSet, Decoration,
      Paragraph, Heading, BulletList, OrderedList, ListItem, CodeBlock,
      HorizontalRule,
    } = TiptapBundle

    // Extend a Tiptap extension to preserve arbitrary class and id attributes
    // through the ProseMirror schema, so visual edits don't strip them.
    function withClassAttr(extension) {
      return extension.extend({
        addAttributes() {
          return {
            ...this.parent?.(),
            class: {
              default: null,
              keepOnSplit: false,
              parseHTML: element => element.getAttribute('class') || null,
              renderHTML: attributes => {
                if (!attributes.class) return {}
                return { class: attributes.class }
              },
            },
            id: {
              default: null,
              keepOnSplit: false,
              parseHTML: element => element.getAttribute('id') || null,
              renderHTML: attributes => {
                if (!attributes.id) return {}
                return { id: attributes.id }
              },
            },
          }
        },
      })
    }

    const ParagraphWithClass  = withClassAttr(Paragraph)
    const HeadingWithClass    = withClassAttr(Heading)
    const _fnPassthrough = new Set(['Backspace', 'Delete'])
    const BulletListWithClass = withClassAttr(BulletList.extend({
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, (...args) => _isInFootnote() ? !_fnPassthrough.has(k) : fn(...args)]))
      },
    }))
    const OrderedListWithClass = withClassAttr(OrderedList.extend({
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, (...args) => _isInFootnote() ? !_fnPassthrough.has(k) : fn(...args)]))
      },
    }))
    const ListItemWithClass   = withClassAttr(ListItem)

    // ── ImageNodeView ─────────────────────────────────
    class ImageNodeView {
      constructor(node, editor, getPos) {
        this.node    = node
        this.editor  = editor
        this.getPos  = getPos

        this.wrapper = document.createElement('div')
        this.wrapper.className = 'image-wrapper'

        this.frame = document.createElement('div')
        this.frame.className = 'image-frame'
        this.frame.contentEditable = 'false'

        this.img = document.createElement('img')
        this._applyAttrs(node.attrs)
        this.frame.appendChild(this.img)

        for (const pos of ['nw','n','ne','e','se','s','sw','w']) {
          const h = document.createElement('div')
          h.className = `resize-handle ${pos}`
          h.addEventListener('mousedown', e => this._onHandleMousedown(e, pos))
          this.frame.appendChild(h)
        }

        this.wrapper.appendChild(this.frame)

        this.figcaption = document.createElement('figcaption')
        this.figcaption.className = 'caption-placeholder'
        this.wrapper.appendChild(this.figcaption)

        this.dom        = this.wrapper
        this.contentDOM = this.figcaption
      }

      _applyAttrs(attrs) {
        this.img.src = attrs.src || ''
        if (attrs.alt) { this.img.alt = attrs.alt } else { this.img.removeAttribute('alt') }
        if (attrs.title) this.img.title = attrs.title
        if (attrs.width != null) {
          this.img.style.width = ''
          this.img.width = attrs.width
          this.frame.style.width = attrs.width + 'px'
        } else {
          this.img.style.width = ''
          this.img.removeAttribute('width')
          this.frame.style.width = ''
        }
        if (attrs.height != null) {
          this.img.style.height = ''
          this.img.height = attrs.height
        } else {
          this.img.style.height = ''
          this.img.removeAttribute('height')
        }
        // Alignment
        this.wrapper.classList.remove('align-left', 'align-right', 'align-center')
        if (attrs.alignment) this.wrapper.classList.add(`align-${attrs.alignment}`)
      }

      update(node) {
        if (node.type.name !== 'image') return false
        this.node = node
        this._applyAttrs(node.attrs)
        // Toggle placeholder class: present when caption is empty
        const hasCaption = node.content.size > 0
        this.figcaption.classList.toggle('caption-placeholder', !hasCaption)
        // Sync toolbar inputs if this image is currently selected
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) {
          document.getElementById('img-tb-w').value   = node.attrs.width  ?? ''
          document.getElementById('img-tb-h').value   = node.attrs.height ?? ''
          document.getElementById('img-tb-alt').value = node.attrs.alt    ?? ''
          const linkBtn = document.getElementById('img-tb-link')
          if (linkBtn) linkBtn.classList.toggle('active', node.attrs.linkTo === 'media')
        }
        return true
      }

      selectNode() {
        this.wrapper.classList.add('selected')
        _showImageToolbar(this)
      }

      deselectNode() {
        this.wrapper.classList.remove('selected')
        // Delay so toolbar inputs can receive focus before we check
        setTimeout(() => {
          const tb = document.getElementById('image-toolbar')
          if (tb && tb.contains(document.activeElement)) return
          if (tb?._activeNodeView === this) _hideImageToolbar()
        }, 80)
      }

      destroy() {
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) _hideImageToolbar()
      }

      stopEvent(e) {
        if (e.type !== 'mousedown') return false
        if (e.target.classList.contains('resize-handle')) return true
        // Non-leaf nodes with contentDOM: ProseMirror maps any click inside the
        // wrapper to a text cursor inside figcaption rather than a NodeSelection.
        // Intercept clicks on the image area (not the caption) and dispatch a
        // NodeSelection manually so selectNode() fires and the toolbar appears.
        if (!this.figcaption.contains(e.target)) {
          e.preventDefault()
          const pos = this.getPos()
          if (typeof pos === 'number') {
            this.editor.commands.setNodeSelection(pos)
          }
          return true
        }
        return false
      }

      ignoreMutation(mutation) {
        // Allow ProseMirror to track text changes inside the figcaption (contentDOM)
        if (this.figcaption.contains(mutation.target)) return false
        return true
      }

      _onHandleMousedown(e, handlePos) {
        e.preventDefault()
        e.stopPropagation()

        const startX   = e.clientX
        const startY   = e.clientY
        const startW   = this.img.offsetWidth  || 300
        const startH   = this.img.offsetHeight || 200
        const ratio    = startW / startH
        const isCorner = ['nw','ne','sw','se'].includes(handlePos)
        const wSign    = handlePos.includes('e') ? 1 : handlePos.includes('w') ? -1 : 0
        const hSign    = handlePos.includes('s') ? 1 : handlePos.includes('n') ? -1 : 0

        const onMove = me => {
          const dx = (me.clientX - startX) * wSign
          const dy = (me.clientY - startY) * hSign
          let newW = startW
          let newH = startH

          if (isCorner && !me.shiftKey) {
            newW = Math.max(50, startW + dx)
            newH = newW / ratio
          } else {
            if (wSign !== 0) newW = Math.max(50, startW + dx)
            if (hSign !== 0) newH = Math.max(50, startH + dy)
          }

          newW = Math.round(newW)
          newH = Math.round(newH)

          this.img.style.width  = newW + 'px'
          this.img.style.height = newH + 'px'
          this.frame.style.width = newW + 'px'

          const wIn = document.getElementById('img-tb-w')
          const hIn = document.getElementById('img-tb-h')
          if (wIn) wIn.value = newW
          if (hIn) hIn.value = newH
        }

        const onUp = () => {
          document.removeEventListener('mousemove', onMove)
          document.removeEventListener('mouseup', onUp)

          const newW = Math.round(parseFloat(this.img.style.width)  || this.img.offsetWidth)
          const newH = Math.round(parseFloat(this.img.style.height) || this.img.offsetHeight)
          this.img.style.width  = ''
          this.img.style.height = ''

          const pos = this.getPos()
          if (typeof pos === 'number') {
            const { state, dispatch } = this.editor.view
            dispatch(state.tr.setNodeMarkup(pos, null, { ...this.node.attrs, width: newW, height: newH }))
          }
        }

        document.addEventListener('mousemove', onMove)
        document.addEventListener('mouseup', onUp)
      }
    }

    // ── Image toolbar helpers ──────────────────────────
    function _positionImageToolbar(tb, wrapper) {
      const wRect = wrapper.getBoundingClientRect()
      const tbWrap = document.getElementById('toolbar-wrap')
      const minTop = tbWrap ? tbWrap.getBoundingClientRect().bottom : 0
      tb.style.left = wRect.left + 'px'
      tb.style.top  = Math.max(wRect.bottom + 6, minTop) + 'px'
    }

    function _showImageToolbar(nv) {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      tb._activeNodeView = nv
      function fillDims() {
        let w = nv.node.attrs.width
        let h = nv.node.attrs.height
        if (w == null && nv.img.naturalWidth)  w = nv.img.naturalWidth
        if (h == null && nv.img.naturalHeight) h = nv.img.naturalHeight
        document.getElementById('img-tb-w').value = w ?? ''
        document.getElementById('img-tb-h').value = h ?? ''
      }
      fillDims()
      if (nv.node.attrs.width == null && !nv.img.naturalWidth) {
        nv.img.addEventListener('load', function onLoad() {
          nv.img.removeEventListener('load', onLoad)
          if (tb._activeNodeView === nv) fillDims()
        })
      }
      document.getElementById('img-tb-alt').value = nv.node.attrs.alt    ?? ''
      _updateNamedSizeButtons(null)

      _positionImageToolbar(tb, nv.wrapper)
      tb.style.display = 'flex'

      // Remove any stale scroll listener before attaching a new one
      if (tb._scrollHandler) {
        document.getElementById('editor-wrap').removeEventListener('scroll', tb._scrollHandler)
      }
      tb._scrollHandler = () => _positionImageToolbar(tb, nv.wrapper)
      document.getElementById('editor-wrap').addEventListener('scroll', tb._scrollHandler)

      if (nv.node.attrs.mediaId != null) {
        window.webkit?.messageHandlers?.requestMediaSizes
          ?.postMessage({ mediaId: nv.node.attrs.mediaId })
      }
    }

    function _hideImageToolbar() {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      if (tb._scrollHandler) {
        document.getElementById('editor-wrap').removeEventListener('scroll', tb._scrollHandler)
        tb._scrollHandler = null
      }
      tb.style.display = 'none'
      tb._activeNodeView = null
      const altIn = document.getElementById('img-tb-alt')
      if (altIn) altIn.value = ''
    }

    function _updateNamedSizeButtons(sizes) {
      document.querySelectorAll('#image-toolbar [data-size]').forEach(btn => {
        if (!sizes || !sizes[btn.dataset.size]) {
          btn.style.display = 'none'
          btn._sizeData = null
        } else {
          btn.style.display = ''
          btn.disabled = false
          btn._sizeData = sizes[btn.dataset.size]
        }
      })
      const linkBtn = document.getElementById('img-tb-link')
      if (linkBtn) {
        // Always available — falls back to the image's current src as the "full"
        // URL when no media-library size data is known (e.g. externally-sourced
        // images with no mediaId). Without this, an already-linked image with no
        // mediaId would show no way to see or remove that link.
        linkBtn.style.display = ''
        const tb = document.getElementById('image-toolbar')
        linkBtn.classList.toggle('active', tb?._activeNodeView?.node.attrs.linkTo === 'media')
      }
    }

    // ── ResizableImage extension ──────────────────────
    const ResizableImage = TiptapImage.extend({
      addAttributes() {
        return {
          ...this.parent?.(),
          width: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('width')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.width != null ? { width: attrs.width } : {},
          },
          height: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('height')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.height != null ? { height: attrs.height } : {},
          },
          mediaId: {
            default: null,
            parseHTML: el => {
              const dataId = el.getAttribute('data-media-id')
              if (dataId) return parseInt(dataId, 10)
              const m = (el.getAttribute('class') || '').match(/wp-image-(\d+)/)
              return m ? parseInt(m[1], 10) : null
            },
            renderHTML: attrs => attrs.mediaId != null ? { 'data-media-id': attrs.mediaId } : {},
          },
          alignment: {
            default: null,
            parseHTML: el => extractAlignment(el.getAttribute('class') || ''),
            renderHTML: attrs => attrs.alignment ? { class: `align${attrs.alignment}` } : {},
          },
          imgClass: {
            default: null,
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              const cls = img?.getAttribute('class') || ''
              const known = /^(alignleft|alignright|aligncenter|wp-image-\d+)$/
              const custom = cls.split(/\s+/).filter(c => c && !known.test(c)).join(' ')
              return custom || null
            },
            renderHTML: attrs => attrs.imgClass ? { class: attrs.imgClass } : {},
          },
          // WP 7.1's "Mark as decorative" image toggle saves role="none" on the
          // <img>. Preserved verbatim so the accessibility semantic survives a
          // Quill edit; works under the bare `img[src]` rule too, which has no
          // getAttrs of its own.
          imgRole: {
            default: null,
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              return img?.getAttribute('role') || null
            },
            renderHTML: attrs => attrs.imgRole ? { role: attrs.imgRole } : {},
          },
          figureClass: {
            default: null,
            rendered: false,
            parseHTML: () => null,
          },
          figureId: {
            default: null,
            rendered: false,
            parseHTML: () => null,
          },
          linkTo: {
            default: 'none',
            rendered: false,
            // Fallback for parse rules with no getAttrs of their own (e.g. the bare
            // `img[src]` rule matching classic/pre-Gutenberg content with no figure
            // wrapper) — el is whatever the rule matched (figure or img directly).
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              const linkEl = img?.parentElement
              return (linkEl && linkEl.tagName === 'A' && linkEl.getAttribute('href')) ? 'media' : null
            },
          },
          linkHref: {
            default: null,
            rendered: false,
            parseHTML: el => {
              const img = el.tagName === 'FIGURE' ? el.querySelector('img') : el
              const linkEl = img?.parentElement
              return (linkEl && linkEl.tagName === 'A' && linkEl.getAttribute('href')) || null
            },
          },
        }
      },
      content: 'inline*',

      renderHTML({ node, HTMLAttributes }) {
        const figureAttrs = {}
        if (node.attrs.figureClass) figureAttrs.class = node.attrs.figureClass
        if (node.attrs.figureId) figureAttrs.id = node.attrs.figureId
        const imgSpec = ['img', HTMLAttributes]
        const imageContent = (node.attrs.linkTo === 'media' && node.attrs.linkHref)
          ? ['a', { href: node.attrs.linkHref }, imgSpec]
          : imgSpec
        return ['figure', figureAttrs, imageContent, ['figcaption', 0]]
      },

      parseHTML() {
        return [
          {
            tag: 'figure.wp-block-image',
            getAttrs: el => {
              const img = el.querySelector('img')
              if (!img) return false
              const dataId = img.getAttribute('data-media-id')
              const imgCls = img.getAttribute('class') || ''
              const clsMatch = imgCls.match(/wp-image-(\d+)/)
              const _knownImgCls = /^(alignleft|alignright|aligncenter|wp-image-\d+)$/
              const customImgCls = imgCls.split(/\s+/).filter(c => c && !_knownImgCls.test(c)).join(' ')
              const figCls = el.getAttribute('class') || ''
              const _knownFigCls = /^(wp-block-image|alignleft|alignright|aligncenter)$/
              const customFigCls = figCls.split(/\s+/).filter(c => c && !_knownFigCls.test(c)).join(' ')
              const linkEl = img.parentElement
              const linkedToMedia = linkEl && linkEl.tagName === 'A' && !!linkEl.getAttribute('href')
              return {
                src:       img.getAttribute('src'),
                alt:       img.getAttribute('alt') ?? null,
                title:     img.getAttribute('title') ?? null,
                width:     parseInt(img.getAttribute('width'), 10) || null,
                height:    parseInt(img.getAttribute('height'), 10) || null,
                mediaId:   dataId ? parseInt(dataId, 10)
                                  : (clsMatch ? parseInt(clsMatch[1], 10) : null),
                alignment: extractAlignment(figCls),
                imgClass:    customImgCls || null,
                figureClass: customFigCls || null,
                figureId:  el.getAttribute('id') || null,
                linkTo:    linkedToMedia ? 'media' : 'none',
                linkHref:  linkedToMedia ? linkEl.getAttribute('href') : null,
              }
            },
            contentElement: el => el.querySelector('figcaption') || el.appendChild(document.createElement('figcaption')),
          },
          { tag: 'img[src]' },
        ]
      },
      addProseMirrorPlugins() {
        const ed = this.editor
        return [new Plugin({
          key: new PluginKey('imageCaptionExit'),
          props: {
            handleKeyDown(view, event) {
              if (event.key !== 'Enter' || event.shiftKey || event.metaKey || event.ctrlKey) return false
              const { $from } = view.state.selection
              const imgDepth = _ancestorDepth($from, 'image')
              if (imgDepth === -1) return false
              event.preventDefault()
              const after = $from.after(imgDepth)
              ed.chain()
                .insertContentAt(after, { type: 'paragraph' })
                .setTextSelection(after + 1)
                .focus()
                .scrollIntoView()
                .run()
              return true
            },
          },
        })]
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new ImageNodeView(node, editor, getPos)
      },
    })

    // ── Cite node ─────────────────────────────────────────
    // Optional last child of blockquote. Maps to <cite> in WordPress/Gutenberg.
    // No 'group' — cannot be inserted anywhere block is accepted; only blockquote
    // schema allows it via 'block+ cite?'.
    const Cite = withClassAttr(TiptapNode.create({
      name: 'cite',
      content: 'inline*',
      parseHTML() {
        return [{ tag: 'cite' }]
      },
      renderHTML({ HTMLAttributes }) {
        return ['cite', HTMLAttributes, 0]
      },
      addKeyboardShortcuts() {
        return {
          Enter: () => {
            const { state } = this.editor
            const { $from } = state.selection
            if ($from.node($from.depth).type.name !== 'cite') return false
            const bqDepth = _ancestorDepth($from, 'blockquote')
            if (bqDepth === -1) return false
            // Insert a paragraph immediately after the blockquote
            const after = $from.after(bqDepth)
            const para = state.schema.nodes.paragraph.create()
            const tr = state.tr.insert(after, para)
            const resolved = tr.doc.resolve(after + 1)
            tr.setSelection(state.selection.constructor.near(resolved))
            this.editor.view.dispatch(tr)
            return true
          },
          Backspace: () => {
            const { state } = this.editor
            const { $from, empty } = state.selection
            if (!empty) return false
            const node = $from.node($from.depth)
            if (node.type.name !== 'cite' || node.content.size > 0) return false
            return this.editor.commands.deleteNode('cite')
          },
        }
      },
    }))

    // ── Embed block ───────────────────────────────────
    // Atomic block storing the embed URL. Saved HTML is the Gutenberg embed
    // figure; in the editor it renders as a static placeholder card (no
    // third-party network requests).
    class EmbedNodeView {
      constructor(node) {
        this.dom = document.createElement('div')
        this.dom.className = 'embed-card'
        const p = detectEmbedProvider(node.attrs.url)
        const provider = document.createElement('div')
        provider.className = 'embed-card-provider'
        provider.textContent = p
          ? p.slug.charAt(0).toUpperCase() + p.slug.slice(1) + ' embed'
          : 'Embed'
        const url = document.createElement('div')
        url.className = 'embed-card-url'
        url.textContent = node.attrs.url
        const hint = document.createElement('div')
        hint.className = 'embed-card-hint'
        hint.textContent = 'Renders on your published site'
        this.dom.append(provider, url, hint)
      }
      selectNode()   { this.dom.classList.add('selected') }
      deselectNode() { this.dom.classList.remove('selected') }
    }

    const EmbedBlock = TiptapNode.create({
      name: 'embedBlock',
      group: 'block',
      atom: true,
      draggable: true,
      priority: 110,

      addAttributes() {
        return {
          url:     { default: '' },
          caption: { default: null },
        }
      },

      parseHTML() {
        return [{
          tag: 'figure.wp-block-embed',
          getAttrs: el => {
            const wrapper = el.querySelector('.wp-block-embed__wrapper')
            const url = wrapper ? wrapper.textContent.trim() : ''
            if (!url) return false
            const fc = el.querySelector('figcaption')
            return { url, caption: fc ? fc.outerHTML : null }
          },
        }]
      },

      renderHTML({ node }) {
        const figure = document.createElement('figure')
        figure.className = embedClassFor(node.attrs.url)
        const wrapper = document.createElement('div')
        wrapper.className = 'wp-block-embed__wrapper'
        wrapper.appendChild(document.createTextNode('\n' + node.attrs.url + '\n'))
        figure.appendChild(wrapper)
        if (node.attrs.caption) figure.insertAdjacentHTML('beforeend', node.attrs.caption)
        return figure
      },

      addNodeView() {
        return ({ node }) => new EmbedNodeView(node)
      },
    })

    // ── Gallery block ─────────────────────────────────
    // Atomic block storing an ordered image list + gallery-wide settings.
    // Saved HTML is the Gutenberg gallery figure (nested wp-block-image
    // figures, wrapped with wp:gallery/wp:image comments by toWordPressHTML);
    // in the editor it renders as a static thumbnail-grid card — all editing
    // happens in the native GallerySheet, not in Tiptap. Read-only: galleries
    // loaded from existing posts render the same card but are not re-openable
    // for editing in v1.
    class GalleryNodeView {
      constructor(node) {
        this.dom = document.createElement('div')
        this.dom.className = 'gallery-card'
        const grid = document.createElement('div')
        grid.className = 'gallery-card-grid'
        node.attrs.images.forEach(image => {
          const img = document.createElement('img')
          img.src = image.url
          img.alt = image.alt || ''
          grid.appendChild(img)
        })
        const hint = document.createElement('div')
        hint.className = 'gallery-card-hint'
        const count = node.attrs.images.length
        hint.textContent = `${count} image${count === 1 ? '' : 's'} · Renders as a WordPress gallery`
        this.dom.append(grid, hint)
      }
      selectNode()   { this.dom.classList.add('selected') }
      deselectNode() { this.dom.classList.remove('selected') }
    }

    const GalleryBlock = TiptapNode.create({
      name: 'galleryBlock',
      group: 'block',
      atom: true,
      draggable: true,
      priority: 110,

      addAttributes() {
        return {
          images:     { default: [] },
          columns:    { default: 3 },
          cropped:    { default: true },
          linkTo:     { default: 'none' },
          sizeSlug:   { default: 'large' },
          // Verbatim copy of the original figure's outerHTML, captured on load.
          // When set, renderHTML re-emits this unchanged instead of reconstructing
          // from the structured attrs above — preserves captions, original
          // sizeSlug, and anything else Quill doesn't model. null for
          // sheet-inserted galleries, which always use the reconstruction path.
          sourceHTML: { default: null },
        }
      },

      parseHTML() {
        return [{
          tag: 'figure.wp-block-gallery',
          getAttrs: el => {
            const imageFigures = Array.from(el.querySelectorAll('figure.wp-block-image'))
            if (imageFigures.length === 0) return false
            const images = imageFigures.map(fig => {
              const img = fig.querySelector('img')
              const idMatch = img?.className.match(/wp-image-(\d+)/)
              return {
                id: idMatch ? parseInt(idMatch[1], 10) : null,
                url: img?.getAttribute('src') || '',
                alt: img?.getAttribute('alt') || '',
                caption: fig.querySelector('figcaption')?.textContent || '',
              }
            })
            const columnsMatch = el.className.match(/columns-(\d+)/)
            const firstImg = imageFigures[0].querySelector('img')
            const sizeMatch = imageFigures[0].className.match(/size-(\S+)/)
            return {
              images,
              columns: columnsMatch ? parseInt(columnsMatch[1], 10) : 3,
              cropped: el.classList.contains('is-cropped'),
              linkTo: firstImg?.parentElement.tagName === 'A' ? 'media' : 'none',
              sizeSlug: sizeMatch ? sizeMatch[1] : 'large',
              sourceHTML: el.outerHTML,
            }
          },
        }]
      },

      renderHTML({ node }) {
        if (node.attrs.sourceHTML) {
          const wrapper = document.createElement('div')
          wrapper.innerHTML = node.attrs.sourceHTML
          return wrapper.firstElementChild
        }
        const figure = document.createElement('figure')
        figure.className = `wp-block-gallery has-nested-images columns-${node.attrs.columns}` +
          (node.attrs.cropped ? ' is-cropped' : '')
        node.attrs.images.forEach(image => {
          const imgFigure = document.createElement('figure')
          imgFigure.className = `wp-block-image size-${node.attrs.sizeSlug || 'large'}`
          const img = document.createElement('img')
          img.setAttribute('src', image.url)
          img.setAttribute('alt', image.alt || '')
          if (image.id) img.classList.add(`wp-image-${image.id}`)
          if (node.attrs.linkTo === 'media') {
            const a = document.createElement('a')
            a.setAttribute('href', image.fullUrl || image.url)
            a.appendChild(img)
            imgFigure.appendChild(a)
          } else {
            imgFigure.appendChild(img)
          }
          // Plain text only — textContent, never innerHTML: caption text comes
          // straight from a TextField in GallerySheet and must not inject markup.
          if (image.caption) {
            const cap = document.createElement('figcaption')
            cap.className = 'wp-element-caption'
            cap.textContent = image.caption
            imgFigure.appendChild(cap)
          }
          figure.appendChild(imgFigure)
        })
        return figure
      },

      addNodeView() {
        return ({ node }) => new GalleryNodeView(node)
      },
    })

    // ── Generic Gutenberg block passthrough ────────────
    // Catches any wp-block-* classed element (other than a <figure>, which
    // Quill's own image/gallery/embed/table rules already own or
    // transparently pass through) that no other, higher-priority parse rule
    // claimed. Renders as a static, non-editable card labeled "Not editable
    // in the visual editor"; saves the original markup back byte-for-byte,
    // regenerating any original wp:name comments. See docs/superpowers/specs/
    // 2026-07-12-gutenberg-passthrough-block-design.md.
    function _peekText(source) {
      const inner = source.replace(/^<!--[\s\S]*?-->/, '').replace(/<!-- \/wp:[\s\S]*?-->$/, '').trim()
      const text = inner || source.trim()
      return text.length > 120 ? text.slice(0, 120) + '…' : text
    }

    class PassthroughNodeView {
      constructor(node) {
        this.dom = document.createElement('div')
        this.dom.className = 'passthrough-card'
        const label = document.createElement('div')
        label.className = 'passthrough-card-label'
        label.textContent = node.attrs.blockLabel
        this.dom.append(label)
        if (node.attrs.unsupportedSource) {
          const peek = document.createElement('div')
          peek.className = 'passthrough-card-peek'
          // textContent, never innerHTML: the peek shows markup, it must not become it.
          peek.textContent = _peekText(node.attrs.unsupportedSource)
          this.dom.append(peek)
        }
        const hint = document.createElement('div')
        hint.className = 'passthrough-card-hint'
        hint.textContent = 'Not editable in the visual editor; use Code View (</>)'
        this.dom.append(hint)
      }
      selectNode()   { this.dom.classList.add('selected') }
      deselectNode() { this.dom.classList.remove('selected') }
    }

    // Priority 210 out-ranks gutenbergPassthrough (200) so the catch-all stops
    // claiming these as frozen cards.
    const ColumnBlock = TiptapNode.create({
      name: 'columnBlock',
      group: 'column',
      content: 'block+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-column' }] },
      renderHTML() { return ['div', { class: 'wp-block-column' }, 0] },
    })

    const ColumnsBlock = TiptapNode.create({
      name: 'columnsBlock',
      group: 'block',
      content: 'column+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-columns' }] },
      renderHTML() { return ['div', { class: 'wp-block-columns' }, 0] },
    })

    const DetailsSummary = TiptapNode.create({
      name: 'detailsSummary',
      content: 'inline*',
      priority: 210,
      parseHTML() { return [{ tag: 'summary' }] },
      renderHTML() { return ['summary', 0] },
    })

    const DetailsBlock = TiptapNode.create({
      name: 'detailsBlock',
      group: 'block',
      content: 'detailsSummary block+',
      priority: 210,
      addAttributes() {
        return {
          showContent: {
            default: false,
            parseHTML: el => el.hasAttribute('open') || blockCommentAttr(el, 'showContent') === true,
          },
        }
      },
      parseHTML() { return [{ tag: 'details.wp-block-details' }] },
      renderHTML({ node }) {
        const attrs = { class: 'wp-block-details' }
        if (node.attrs.showContent) attrs.open = ''
        return ['details', attrs, 0]
      },
      addCommands() {
        return { toggleDetailsOpen: toggleBlockAttrCommand('detailsBlock', 'showContent') }
      },
    })

    const ButtonBlock = TiptapNode.create({
      name: 'buttonBlock',
      group: 'button',
      content: 'inline*',
      priority: 210,
      addAttributes() {
        return { href: { default: null, parseHTML: el => el.querySelector('a')?.getAttribute('href') || null } }
      },
      // contentElement consumes the anchor so the Link mark never claims it and
      // renderHTML stays the only thing that emits one.
      parseHTML() { return [{ tag: 'div.wp-block-button', contentElement: 'a' }] },
      renderHTML({ node }) {
        const attrs = { class: 'wp-block-button__link wp-element-button' }
        if (node.attrs.href) attrs.href = node.attrs.href
        return ['div', { class: 'wp-block-button' }, ['a', attrs, 0]]
      },
    })

    const ButtonsBlock = TiptapNode.create({
      name: 'buttonsBlock',
      group: 'block',
      content: 'button+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-buttons' }] },
      renderHTML() { return ['div', { class: 'wp-block-buttons' }, 0] },
    })

    const AccordionHeading = TiptapNode.create({
      name: 'accordionHeading',
      content: 'inline*',
      priority: 210,
      parseHTML() {
        return [{
          tag: 'h1.wp-block-accordion-heading, h2.wp-block-accordion-heading, h3.wp-block-accordion-heading, h4.wp-block-accordion-heading, h5.wp-block-accordion-heading, h6.wp-block-accordion-heading',
          getAttrs: el => ({ level: parseInt(el.tagName.slice(1), 10) }),
          contentElement: el => el.querySelector('.wp-block-accordion-heading__toggle-title') || el,
        }]
      },
      addAttributes() {
        return {
          level: { default: 3 },
          showIcon: {
            default: true,
            parseHTML: el => {
              const carried = blockCommentAttr(el, 'showIcon')
              if (typeof carried === 'boolean') return carried
              return hasBlockComment(el) ? true : el.classList.contains('has-icon')
            },
          },
          iconPosition: {
            default: 'right',
            parseHTML: el => {
              const carried = blockCommentAttr(el, 'iconPosition')
              if (carried === 'left' || carried === 'right') return carried
              return el.classList.contains('has-icon-left') ? 'left' : 'right'
            },
          },
        }
      },
      renderHTML({ node }) {
        const { level, showIcon, iconPosition } = node.attrs
        const classes = ['wp-block-accordion-heading']
        if (showIcon) classes.push('has-icon', iconPosition === 'left' ? 'has-icon-left' : 'has-icon-right')
        const title = ['span', { class: 'wp-block-accordion-heading__toggle-title' }, 0]
        const icon = ['span', { class: 'wp-block-accordion-heading__toggle-icon', 'aria-hidden': 'true' }, '+']
        const children = !showIcon ? [title] : (iconPosition === 'left' ? [icon, title] : [title, icon])
        return [`h${level}`, { class: classes.join(' ') },
          ['button', { type: 'button', class: 'wp-block-accordion-heading__toggle' }, ...children]]
      },
    })

    const AccordionPanel = TiptapNode.create({
      name: 'accordionPanel',
      content: 'block+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-accordion-panel' }] },
      renderHTML() { return ['div', { role: 'region', class: 'wp-block-accordion-panel' }, 0] },
    })

    const AccordionItem = TiptapNode.create({
      name: 'accordionItem',
      group: 'accordionItemGroup',
      content: 'accordionHeading accordionPanel',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-accordion-item' }] },
      renderHTML() { return ['div', { class: 'wp-block-accordion-item' }, 0] },
    })

    const AccordionBlock = TiptapNode.create({
      name: 'accordionBlock',
      group: 'block',
      content: 'accordionItemGroup+',
      priority: 210,
      addAttributes() {
        return {
          autoclose: {
            default: false,
            parseHTML: el => el.hasAttribute('data-autoclose') || blockCommentAttr(el, 'autoclose') === true,
          },
        }
      },
      parseHTML() { return [{ tag: 'div.wp-block-accordion' }] },
      renderHTML({ node }) {
        const attrs = { role: 'group', class: 'wp-block-accordion' }
        if (node.attrs.autoclose) attrs['data-autoclose'] = ''
        return ['div', attrs, 0]
      },
      addCommands() {
        return { toggleAccordionAutoclose: toggleBlockAttrCommand('accordionBlock', 'autoclose') }
      },
    })

    const TabButton = TiptapNode.create({
      name: 'tabButton',
      content: 'inline*',
      priority: 210,
      parseHTML() { return [{ tag: 'button[role="tab"]' }] },
      renderHTML() { return ['button', { type: 'button', role: 'tab' }, 0] },
    })

    const TabList = TiptapNode.create({
      name: 'tabList',
      content: 'tabButton+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-tab-list' }] },
      renderHTML() { return ['div', { role: 'tablist', class: 'wp-block-tab-list' }, 0] },
    })

    const TabPanel = TiptapNode.create({
      name: 'tabPanel',
      content: 'block+',
      priority: 210,
      addAttributes() { return { label: { default: '' } } },
      parseHTML() { return [{ tag: 'section.wp-block-tab-panel' }] },
      renderHTML() { return ['section', { role: 'tabpanel', tabindex: '0', class: 'wp-block-tab-panel' }, 0] },
    })

    const TabPanels = TiptapNode.create({
      name: 'tabPanels',
      content: 'tabPanel+',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-tab-panels' }] },
      renderHTML() { return ['div', { class: 'wp-block-tab-panels' }, 0] },
    })

    const TabsBlock = TiptapNode.create({
      name: 'tabsBlock',
      group: 'block',
      content: 'tabList tabPanels',
      priority: 210,
      parseHTML() { return [{ tag: 'div.wp-block-tabs' }] },
      renderHTML() { return ['div', { class: 'wp-block-tabs' }, 0] },
    })

    const Pullquote = TiptapNode.create({
      name: 'pullquote',
      group: 'block',
      content: 'block+ cite?',
      priority: 210,
      parseHTML() { return [{ tag: 'figure.wp-block-pullquote', contentElement: 'blockquote' }] },
      renderHTML() { return ['figure', { class: 'wp-block-pullquote' }, ['blockquote', {}, 0]] },
      addCommands() {
        return { setPullquote: () => ({ commands }) => commands.wrapIn(this.name) }
      },
    })

    const Preformatted = TiptapNode.create({
      name: 'preformatted',
      group: 'block',
      content: 'text*',
      marks: '',
      code: true,
      priority: 210,
      parseHTML() { return [{ tag: 'pre.wp-block-preformatted', preserveWhitespace: 'full' }] },
      renderHTML() { return ['pre', { class: 'wp-block-preformatted' }, 0] },
      addCommands() {
        return { setPreformatted: () => ({ commands }) => commands.setNode(this.name) }
      },
    })

    // A block attribute that lives only in the <!-- wp:name {...} --> delimiter
    // is invisible to ProseMirror's DOM parser, so editing the block used to
    // drop it. The comment node is still reachable from the element being
    // parsed, so the whole attribute object rides along on the node and
    // toWordPressHTML re-emits it. Each container node renders a fixed
    // attribute object and ignores HTMLAttributes, so the carrier is injected
    // into the parent's own output rather than via addGlobalAttributes.
    function toggleBlockAttrCommand(typeName, attr) {
      return () => ({ state, tr, dispatch }) => {
        const $from = state.selection.$from
        for (let d = $from.depth; d >= 1; d--) {
          const node = $from.node(d)
          if (node.type.name !== typeName) continue
          if (dispatch) {
            dispatch(tr.setNodeMarkup($from.before(d), undefined,
              { ...node.attrs, [attr]: !node.attrs[attr] }))
          }
          return true
        }
        return false
      }
    }

    function blockCommentAttrsJSON(element) {
      let n = element.previousSibling
      while (n && n.nodeType === 3 && n.textContent.trim() === '') n = n.previousSibling
      if (!n || n.nodeType !== 8) return null
      const m = n.nodeValue.match(/^\s*wp:\S+\s+(\{[\s\S]*\})\s*$/)
      return m ? m[1] : null
    }

    // Read one key from the delimiter comment only, never from the carrier
    // attribute: an element Quill itself rendered has no preceding comment, so
    // its own DOM attribute is the live value and a stale carrier cannot
    // resurrect an attribute the user just turned off.
    function hasBlockComment(element) {
      let n = element.previousSibling
      while (n && n.nodeType === 3 && n.textContent.trim() === '') n = n.previousSibling
      return !!(n && n.nodeType === 8 && /^\s*wp:/.test(n.nodeValue))
    }

    function blockCommentAttr(element, key) {
      const raw = blockCommentAttrsJSON(element)
      if (!raw) return undefined
      try {
        const parsed = JSON.parse(raw)
        return (parsed && typeof parsed === 'object') ? parsed[key] : undefined
      } catch (e) {
        return undefined
      }
    }

    function withBlockAttrs(extension) {
      return extension.extend({
        addAttributes() {
          return {
            ...this.parent?.(),
            blockAttrs: {
              default: null,
              keepOnSplit: false,
              parseHTML: element => {
                const existing = element.getAttribute('data-quill-block-attrs')
                if (existing) return existing
                return blockCommentAttrsJSON(element)
              },
              renderHTML: () => ({}),
            },
          }
        },
        renderHTML(props) {
          const out = this.parent?.(props)
          const carried = props.node && props.node.attrs && props.node.attrs.blockAttrs
          if (!carried || !Array.isArray(out)) return out
          const attrs = out[1]
          if (!attrs || typeof attrs !== 'object' || Array.isArray(attrs)) return out
          out[1] = { ...attrs, 'data-quill-block-attrs': carried }
          return out
        },
      })
    }

    const GutenbergPassthrough = TiptapNode.create({
      name: 'gutenbergPassthrough',
      group: 'block',
      atom: true,
      draggable: true,
      // Must out-rank every core node (100) and the footnote nodes (110) so an
      // unmodeled block sitting on a shared tag (<ul>, <pre>, <blockquote>, …)
      // isn't claimed by the generic rule and shredded. Stays below Paragraph
      // (1000) so paragraph remains the schema's first block node, which is
      // what ProseMirror fills empty `block+` content with. Blocks Quill does
      // model opt out via QUILL_MODELED_BLOCK_CLASSES in editor-transforms.js.
      priority: 200,

      addAttributes() {
        return {
          blockLabel: { default: '' },
          blockName:  { default: null },
          attrsJSON:  { default: null },
          sourceHTML: { default: '' },
          unsupportedSource: { default: null },
        }
      },

      parseHTML() {
        return [
          {
            // First, so it out-ranks the class catch-all below. blockName stays
            // null: this block's own comments are already inside its source, so
            // regenerating them would double them.
            tag: 'div.wp-block-quill-unsupported',
            getAttrs: el => ({
              blockLabel: el.getAttribute('data-quill-unsupported-label') || 'Block',
              blockName: null,
              attrsJSON: null,
              sourceHTML: el.outerHTML,
              unsupportedSource: el.getAttribute('data-quill-unsupported-source'),
            }),
          },
          {
            tag: '[class*="wp-block-"]:not(figure)',
            getAttrs: el => parsePassthroughBlock(el) || false,
          },
          {
            // Figures too. Only image/gallery/embed/table have figure rules of
            // their own (QUILL_MODELED_FIGURE_CLASSES); every other wp-block-*
            // figure — audio, video, pullquote, playlist — has none, and the
            // generic parser destroys it rather than leaving it alone.
            tag: 'figure[class*="wp-block-"]',
            getAttrs: el => isModeledFigure(el) ? false : (parsePassthroughBlock(el) || false),
          },
        ]
      },

      renderHTML({ node }) {
        const wrapper = document.createElement('div')
        wrapper.innerHTML = node.attrs.sourceHTML
        const el = wrapper.firstElementChild
        if (!el) return ['div', {}]
        // Unconditional marker (independent of blockName) so toWordPressHTML can
        // find and shield this element's nested content from its comment-strip
        // pass, whether or not this element itself had its own wp:name comments.
        el.setAttribute('data-quill-passthrough', '')
        if (node.attrs.blockName) {
          el.setAttribute('data-quill-passthrough-name', node.attrs.blockName)
          if (node.attrs.attrsJSON) {
            el.setAttribute('data-quill-passthrough-attrs', node.attrs.attrsJSON)
          }
        }
        return el
      },

      addNodeView() {
        return ({ node }) => new PassthroughNodeView(node)
      },
    })

    // ── Footnotes ─────────────────────────────────────
    // Self-contained HTML footnotes: markers are inline atoms
    // <sup data-fn class="fn"><a href="#id"></a></sup>; the list is a literal
    // <ol class="wp-block-footnotes"> pinned at the document end. Marker
    // numbers are rendered by CSS counters in the editor and written as real
    // text by toWordPressHTML on save.
    const FootnoteMarker = TiptapNode.create({
      name: 'footnoteMarker',
      group: 'inline',
      inline: true,
      atom: true,
      priority: 110,
      addAttributes() {
        return { fnId: { default: null } }
      },
      parseHTML() {
        return [{
          tag: 'sup.fn[data-fn]',
          getAttrs: el => ({ fnId: el.getAttribute('data-fn') }),
        }]
      },
      renderHTML({ node }) {
        return ['sup', { 'data-fn': node.attrs.fnId, class: 'fn' },
          ['a', { href: '#' + node.attrs.fnId }]]
      },
    })

    const FootnotesList = TiptapNode.create({
      name: 'footnotesList',
      group: 'block',
      content: 'footnoteItem+',
      defining: true,
      isolating: true,
      priority: 110,  // must out-rank OrderedList's generic 'ol' parse rule
      parseHTML() {
        return [{ tag: 'ol.wp-block-footnotes' }]
      },
      renderHTML() {
        return ['ol', { class: 'wp-block-footnotes' }, 0]
      },
    })

    const FootnoteItem = TiptapNode.create({
      name: 'footnoteItem',
      content: 'inline*',
      defining: true,
      priority: 110,  // must out-rank ListItem's generic 'li' rule for these lis
      addAttributes() {
        return { fnId: { default: null } }
      },
      parseHTML() {
        return [{
          tag: 'ol.wp-block-footnotes > li',
          getAttrs: el => {
            el.querySelectorAll('.footnote-backref').forEach(a => a.remove())
            return { fnId: el.getAttribute('id') }
          },
        }]
      },
      renderHTML({ node }) {
        return ['li', { id: node.attrs.fnId }, 0]
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new FootnoteItemNodeView(node, editor, getPos)
      },
    })

    class FootnoteItemNodeView {
      constructor(node, editor, getPos) {
        this.node = node
        this.editor = editor

        this.dom = document.createElement('li')
        this.dom.id = node.attrs.fnId || ''

        this.contentDOM = document.createElement('span')
        this.contentDOM.className = 'fn-item-content'

        this.backArrow = document.createElement('a')
        this.backArrow.className = 'fn-backref'
        this.backArrow.textContent = '↩'
        this.backArrow.contentEditable = 'false'
        this.backArrow.tabIndex = -1
        this.backArrow.setAttribute('aria-label', 'Back to content')
        this.backArrow.addEventListener('mousedown', e => {
          e.preventDefault()
          const fnId = this.node.attrs.fnId
          let markerPos = null
          let markerSize = 0
          this.editor.state.doc.descendants((n, pos) => {
            if (n.type.name === 'footnoteMarker' && n.attrs.fnId === fnId) {
              markerPos = pos
              markerSize = n.nodeSize
              return false
            }
            return true
          })
          if (markerPos !== null) {
            this.editor.chain().focus().setTextSelection(markerPos + markerSize).scrollIntoView().run()
          }
        })

        this.dom.appendChild(this.contentDOM)
        this.dom.appendChild(this.backArrow)
      }

      update(node) {
        if (node.type.name !== 'footnoteItem') return false
        this.node = node
        this.dom.id = node.attrs.fnId || ''
        return true
      }

      stopEvent(event) {
        return event.target === this.backArrow
      }

      ignoreMutation(mutation) {
        return mutation.target === this.backArrow ||
          this.backArrow.contains(mutation.target)
      }
    }

    // Keeps the footnotes list consistent with the markers after every doc
    // change: entries follow marker order, orphaned entries are removed,
    // missing entries are created (paste/undo edge cases), and the list
    // itself is removed when the last marker goes. appendTransaction runs
    // again on its own output; the second pass finds everything consistent
    // and returns null, so there is no loop.
    const FootnoteSync = Extension.create({
      name: 'footnoteSync',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: new PluginKey('footnoteSync'),
            appendTransaction(transactions, oldState, newState) {
              if (!transactions.some(tr => tr.docChanged)) return null

              const markerIds = []
              let listPos = null
              let listNode = null
              newState.doc.descendants((node, pos) => {
                if (node.type.name === 'footnotesList') {
                  listPos = pos
                  listNode = node
                  return false  // don't collect markers inside the list
                }
                if (node.type.name === 'footnoteMarker' && node.attrs.fnId) {
                  markerIds.push(node.attrs.fnId)
                }
                return true
              })

              if (listPos === null) {
                if (markerIds.length === 0) return null
                const items = markerIds.map(id =>
                  newState.schema.nodes.footnoteItem.create({ fnId: id }))
                return newState.tr.insert(
                  newState.doc.content.size,
                  newState.schema.nodes.footnotesList.create(null, items)
                )
              }

              const currentIds = []
              const itemsById = new Map()
              listNode.forEach(child => {
                currentIds.push(child.attrs.fnId)
                if (child.attrs.fnId) itemsById.set(child.attrs.fnId, child)
              })

              if (currentIds.length === markerIds.length &&
                  currentIds.every((id, i) => id === markerIds[i])) return null

              const tr = newState.tr
              if (markerIds.length === 0) {
                tr.delete(listPos, listPos + listNode.nodeSize)
              } else {
                const desired = markerIds.map(id =>
                  itemsById.get(id) || newState.schema.nodes.footnoteItem.create({ fnId: id }))
                tr.replaceWith(listPos + 1, listPos + listNode.nodeSize - 1, desired)
              }
              return tr
            },
          })
        ]
      },
    })

    // ── Spell check ───────────────────────────────────────
    // ── Container chrome ─────────────────────────────
    // Every visual affordance the container blocks need — a <details> forced
    // open so its body stays editable, collapsed-for-preview, the active tab —
    // is a decoration. Decorations are not part of the document, so none of it
    // can reach getHTML() and therefore a save.
    const containerChromeKey = new PluginKey('containerChrome')

    const COLLAPSIBLE = new Set(['accordionItem', 'detailsBlock'])

    // The whole accordion row toggles, so its title is the one place a press
    // must fall through and land a caret instead.
    function _onOwnText(el, x, y) {
      const range = el.ownerDocument.createRange()
      range.selectNodeContents(el)
      // Absent wherever there is no layout engine, jsdom included.
      if (!range.getClientRects) return false
      const rects = range.getClientRects()
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i]
        if (!r.width || !r.height) continue
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true
      }
      return false
    }

    function _tabDecorations(node, pos, head, decos) {
      if (node.childCount < 2) return
      const list = node.child(0)
      const panels = node.child(1)
      const listContent = pos + 2
      const panelsContent = pos + 1 + list.nodeSize + 1
      const spans = []
      list.forEach((child, offset, i) => spans.push([listContent + offset, child.nodeSize, i]))
      panels.forEach((child, offset, i) => spans.push([panelsContent + offset, child.nodeSize, i]))
      let active = 0
      for (const [from, size, i] of spans) {
        if (head > from && head < from + size) { active = i; break }
      }
      for (const [from, size, i] of spans) {
        if (i === active) decos.push(Decoration.node(from, from + size, { class: 'is-active-tab' }))
      }
    }

    function _chromeDecorations(state) {
      const decos = []
      const head = state.selection.head
      state.doc.descendants((node, pos) => {
        const name = node.type.name
        if (name === 'detailsBlock') {
          decos.push(Decoration.node(pos, pos + node.nodeSize, { open: '' }))
          if (node.attrs.showContent) {
            decos.push(Decoration.node(pos, pos + node.nodeSize, { class: 'shows-content' }))
          }
        }
        if (name === 'tabsBlock') _tabDecorations(node, pos, head, decos)
        return true
      })
      return decos
    }

    function _collapsibleAt($pos) {
      for (let d = $pos.depth; d > 0; d--) {
        if (COLLAPSIBLE.has($pos.node(d).type.name)) return { pos: $pos.before(d), node: $pos.node(d) }
      }
      return null
    }

    function _toggleCollapseAt(view, $pos) {
      const target = _collapsibleAt($pos)
      if (!target) return false
      view.dispatch(view.state.tr.setMeta(containerChromeKey, {
        pos: target.pos, nodeSize: target.node.nodeSize,
      }))
      return true
    }

    const ContainerChrome = Extension.create({
      name: 'containerChrome',
      addCommands() {
        return {
          toggleContainerCollapse: () => ({ state, dispatch }) => {
            const target = _collapsibleAt(state.selection.$head)
            if (!target) return false
            if (dispatch) {
              dispatch(state.tr.setMeta(containerChromeKey, {
                pos: target.pos, nodeSize: target.node.nodeSize,
              }))
            }
            return true
          },
        }
      },
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: containerChromeKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                let next = set.map(tr.mapping, tr.doc)
                const toggle = tr.getMeta(containerChromeKey)
                if (toggle) {
                  const at = next.find(toggle.pos, toggle.pos + toggle.nodeSize)
                                 .filter(d => d.from === toggle.pos)
                  next = at.length
                    ? next.remove(at)
                    : next.add(tr.doc, [Decoration.node(
                        toggle.pos, toggle.pos + toggle.nodeSize, { class: 'is-collapsed' })])
                }
                return next
              },
            },
            props: {
              decorations(state) {
                return containerChromeKey.getState(state).add(state.doc, _chromeDecorations(state))
              },
              handleDOMEvents: {
                // <details> is forced open by decoration; let nothing flip it back.
                click(view, event) {
                  return !!(event.target.closest && event.target.closest('.wp-block-details > summary'))
                    && (event.preventDefault(), true)
                },
                mousedown(view, event) {
                  const el = event.target.closest && event.target.closest(
                    '.wp-block-accordion-heading, .wp-block-details > summary')
                  if (!el) return false
                  if (el.tagName === 'SUMMARY') {
                    if (event.clientX - el.getBoundingClientRect().left > 22) return false
                  } else {
                    const title = el.querySelector('.wp-block-accordion-heading__toggle-title')
                    if (!title || !title.textContent.trim()) return false
                    if (_onOwnText(title, event.clientX, event.clientY)) return false
                  }
                  const pos = view.posAtDOM(el, 0)
                  if (pos < 0) return false
                  event.preventDefault()
                  return _toggleCollapseAt(view, view.state.doc.resolve(pos))
                },
              },
            },
          }),
        ]
      },
    })

    const spellCheckKey = new PluginKey('spellCheck')

    const SpellCheck = Extension.create({
      name: 'spellCheck',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: spellCheckKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                const incoming = tr.getMeta(spellCheckKey)
                if (incoming !== undefined) return incoming
                if (!tr.docChanged) return set
                let next = set.map(tr.mapping, tr.doc)
                for (const step of tr.steps) {
                  step.getMap().forEach((oldStart, oldEnd, newStart, newEnd) => {
                    const overlapping = next.find(newStart, newEnd)
                    if (overlapping.length) next = next.remove(overlapping)
                  })
                }
                return next
              }
            },
            props: {
              decorations(state) { return spellCheckKey.getState(state) }
            }
          })
        ]
      }
    })

    // ── Find & replace highlight ─────────────────────
    const findKey = new PluginKey('findReplace')

    const FindHighlight = Extension.create({
      name: 'findHighlight',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: findKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                const incoming = tr.getMeta(findKey)
                if (incoming !== undefined) return incoming
                return tr.docChanged ? set.map(tr.mapping, tr.doc) : set
              }
            },
            props: {
              decorations(state) { return findKey.getState(state) }
            }
          })
        ]
      }
    })

    // Extended blockquote: allows an optional cite as its last child.
    const CustomBlockquote = withClassAttr(Blockquote.extend({
      content: 'block+ cite?',
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        const wrapped = Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, (...args) => _isInFootnote() ? !_fnPassthrough.has(k) : fn(...args)]))
        return {
          ...wrapped,
          Enter: () => {
            if (_isInFootnote()) return true
            const { state } = this.editor
            const { $from, empty } = state.selection
            const bqDepth = _ancestorDepth($from, 'blockquote')
            if (bqDepth === -1) return false
            if ($from.node($from.depth).type.name === 'cite') return false
            if ($from.depth > bqDepth + 2) return false
            if (empty && $from.parent.content.size === 0) {
              return this.editor.commands.liftEmptyBlock()
            }
            const { tr } = state
            const paraType = state.schema.nodes.paragraph
            if (!empty) tr.deleteSelection()
            const $cur = tr.selection.$from
            const curBqDepth = _ancestorDepth($cur, 'blockquote')
            if (curBqDepth === -1) return false
            tr.split($cur.pos, $cur.depth - curBqDepth, [{type: paraType, attrs: null}])
            tr.scrollIntoView()
            this.editor.view.dispatch(tr)
            return true
          },
        }
      },
    }))

    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: [
        StarterKit.configure({
          blockquote: false,
          paragraph: false,
          heading: false,
          bulletList: false,
          orderedList: false,
          listItem: false,
          codeBlock: false,
          horizontalRule: false,
        }),
        withClassAttr(CodeBlock.extend({
          addKeyboardShortcuts() {
            const orig = this.parent?.()
            return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
              [k, (...args) => _isInFootnote() ? !_fnPassthrough.has(k) : fn(...args)]))
          },
        })),
        ParagraphWithClass,
        HeadingWithClass.configure({ levels: [1, 2, 3, 4, 5, 6] }),
        BulletListWithClass,
        OrderedListWithClass,
        ListItemWithClass,
        CustomBlockquote,
        Cite,
        Underline,
        withClassAttr(Table).configure({ resizable: false }),
        withClassAttr(TableRow),
        withClassAttr(TableHeader),
        withClassAttr(TableCell),
        withClassAttr(HorizontalRule),
        ResizableImage.configure({ inline: false }),
        EmbedBlock,
        GalleryBlock,
        withBlockAttrs(ColumnsBlock),
        withBlockAttrs(ColumnBlock),
        withBlockAttrs(DetailsBlock),
        DetailsSummary,
        withBlockAttrs(ButtonsBlock),
        withBlockAttrs(ButtonBlock),
        withBlockAttrs(AccordionBlock),
        withBlockAttrs(AccordionItem),
        withBlockAttrs(AccordionHeading),
        withBlockAttrs(AccordionPanel),
        withBlockAttrs(TabsBlock),
        withBlockAttrs(TabList),
        TabButton,
        withBlockAttrs(TabPanels),
        withBlockAttrs(TabPanel),
        withBlockAttrs(Pullquote),
        withBlockAttrs(Preformatted),
        GutenbergPassthrough,
        FootnoteMarker,
        FootnotesList,
        FootnoteItem,
        FootnoteSync,
        withClassAttr(Link).configure({ openOnClick: false, HTMLAttributes: { target: null, rel: null } }),

        Placeholder.configure({ placeholder: 'Start writing…' }),
        ContainerChrome,
        SpellCheck,
        FindHighlight,
      ],
      content: '',
      editorProps: {
        handleKeyDown(view, event) {
          if (event.key === 'Enter' && !event.shiftKey && !event.metaKey && !event.ctrlKey && _isInFootnote()) {
            const { state, dispatch } = view
            const br = state.schema.nodes.hardBreak
            if (br) { dispatch(state.tr.replaceSelectionWith(br.create()).scrollIntoView()); return true }
          }
          return false
        },
        handleClick(view, pos, event) {
          if (!event.metaKey) return false
          let el = event.target
          while (el && el !== view.dom) {
            if (el.tagName === 'A' && el.href && !el.getAttribute('href').startsWith('#')) {
              event.preventDefault()
              window.webkit?.messageHandlers?.openLink?.postMessage(el.href)
              return true
            }
            el = el.parentElement
          }
          return false
        },
        transformPastedText(text) {
          // ProseMirror only routes through transformPastedHTML when the clipboard
          // carries a text/html flavor; a text/plain paste takes a separate branch
          // that splits on newlines into paragraphs. Without this, multi-line text
          // pasted into a footnote (inline content only) put its first line in the
          // entry and dropped the rest outside the footnotes list as siblings.
          if (!_isInFootnote()) return text
          return text.split(/\r\n?|\n/).map(s => s.trim()).filter(Boolean).join(' ')
        },
        transformPastedHTML(html) {
          if (!_isInFootnote()) return html
          const tmp = document.createElement('div')
          tmp.innerHTML = html
          const BLOCK_TAGS = new Set(['DIV','P','H1','H2','H3','H4','H5','H6',
            'BLOCKQUOTE','PRE','TABLE','THEAD','TBODY','TR','TD','TH',
            'UL','OL','LI','FIGURE','FIGCAPTION','HR','IMG'])
          function flatten(el) {
            let out = ''
            for (const ch of el.childNodes) {
              if (ch.nodeType === 3) { out += ch.textContent; continue }
              if (ch.nodeType !== 1) continue
              if (BLOCK_TAGS.has(ch.tagName)) {
                out += flatten(ch) + ' '
              } else {
                ch.innerHTML = flatten(ch)
                out += ch.outerHTML
              }
            }
            return out
          }
          return flatten(tmp).trim()
        },
      },
      onTransaction: () => updateToolbar(),
      onCreate: () => {
        document.execCommand('enableObjectResizing', false, 'false')
        updateToolbar()
        if (window.webkit?.messageHandlers?.editorReady) {
          window.webkit.messageHandlers.editorReady.postMessage('ready')
        }
      },
    })
    window._tiptapEditor = editor

    function setImageAlignment(value) {
      const { state } = editor
      const node = state.selection.node
      if (!node || node.type.name !== 'image') return
      const pos = state.selection.from
      const newAlignment = node.attrs.alignment === value ? null : value
      editor.view.dispatch(
        state.tr.setNodeMarkup(pos, null, { ...node.attrs, alignment: newAlignment })
      )
      editor.view.focus()
    }

    // ── Footnote context detection ────────────────────
    function _ancestorOfType(typeName) {
      const { $from } = editor.state.selection
      for (let d = $from.depth; d > 0; d--) {
        if ($from.node(d).type.name === typeName) return { node: $from.node(d), pos: $from.before(d) }
      }
      return null
    }

    function _isInFootnote() {
      const $from = editor.state.selection.$from
      for (let d = $from.depth; d > 0; d--) {
        const name = $from.node(d).type.name
        if (name === 'footnoteItem' || name === 'footnotesList') return true
      }
      return false
    }

    function _ancestorDepth($pos, typeName) {
      for (let d = $pos.depth; d >= 0; d--) {
        if ($pos.node(d).type.name === typeName) return d
      }
      return -1
    }

    function _buttonBlockTarget(state) {
      const $head = state.selection.$head
      for (let d = $head.depth; d > 0; d--) {
        if ($head.node(d).type.name === 'buttonBlock') {
          return { pos: $head.before(d), node: $head.node(d) }
        }
      }
      return null
    }

    function _setButtonHref(url) {
      const button = _buttonBlockTarget(editor.state)
      if (!button) return false
      editor.view.dispatch(editor.state.tr.setNodeMarkup(
        button.pos, null, { ...button.node.attrs, href: url || null }))
      editor.commands.focus()
      return true
    }

    const BLOCK_CMDS = ['blockquote','codeBlock','bulletList','orderedList',
                        'insertTable','image','gallery']

    // ── Toolbar commands ───────────────────────────────
    const COMMANDS = {
      bold:          () => editor.chain().focus().toggleBold().run(),
      italic:        () => editor.chain().focus().toggleItalic().run(),
      underline:     () => editor.chain().focus().toggleUnderline().run(),
      strike:        () => editor.chain().focus().toggleStrike().run(),
      code:          () => editor.chain().focus().toggleCode().run(),
      blockquote: () => {
        if (_isInFootnote()) return
        if (editor.isActive('blockquote')) {
          const { $from } = editor.state.selection
          const d = _ancestorDepth($from, 'blockquote')
          if (d === -1) return
          const bqNode = $from.node(d)
          const from = $from.before(d)
          const to = $from.after(d)
          if (bqNode.lastChild?.type.name === 'cite') {
            const bqStart = $from.start(d)
            let citeOff = 0
            bqNode.forEach((child, offset) => { if (child === bqNode.lastChild) citeOff = offset })
            editor.chain().focus()
              .command(({ tr }) => { tr.delete(bqStart + citeOff, bqStart + citeOff + bqNode.lastChild.nodeSize); return true })
              .toggleBlockquote()
              .run()
          } else {
            editor.chain().focus()
              .setTextSelection({ from: from + 1, to: to - 1 })
              .toggleBlockquote()
              .run()
          }
          return
        }
        editor.chain().focus().toggleBlockquote().run()
      },
      codeBlock:     () => { if (!_isInFootnote()) editor.chain().focus().toggleCodeBlock().run() },
      bulletList:    () => { if (!_isInFootnote()) editor.chain().focus().toggleBulletList().run() },
      orderedList:   () => { if (!_isInFootnote()) editor.chain().focus().toggleOrderedList().run() },
      insertTable:   () => { if (!_isInFootnote()) editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run() },
      addRowAfter:   () => editor.chain().focus().addRowAfter().run(),
      addColumnAfter:() => editor.chain().focus().addColumnAfter().run(),
      deleteRow:     () => editor.chain().focus().deleteRow().run(),
      deleteColumn:  () => editor.chain().focus().deleteColumn().run(),
      addTab: () => {
        const tabs = _ancestorOfType('tabsBlock')
        if (!tabs) return
        const list = tabs.pos + 1
        const panels = list + tabs.node.child(0).nodeSize
        const label = `Tab ${tabs.node.child(0).childCount + 1}`
        const tr = editor.state.tr
        tr.insert(panels + tabs.node.child(1).nodeSize - 1,
          editor.schema.nodes.tabPanel.createAndFill({ label }))
        tr.insert(list + tabs.node.child(0).nodeSize - 1,
          editor.schema.nodes.tabButton.create(null, editor.schema.text(label)))
        editor.view.dispatch(tr)
        editor.commands.focus()
      },
      deleteTab: () => {
        const tabs = _ancestorOfType('tabsBlock')
        if (!tabs || tabs.node.child(0).childCount <= 1) return
        const here = _ancestorOfType('tabPanel') || _ancestorOfType('tabButton')
        if (!here) return
        const parent = here.node.type.name === 'tabPanel' ? tabs.node.child(1) : tabs.node.child(0)
        let index = -1
        parent.forEach((child, _offset, i) => { if (child === here.node) index = i })
        if (index < 0) return
        const listStart = tabs.pos + 1
        const panelsStart = listStart + tabs.node.child(0).nodeSize
        let buttonPos = listStart + 1
        tabs.node.child(0).forEach((child, offset, i) => { if (i < index) buttonPos += child.nodeSize })
        let panelPos = panelsStart + 1
        tabs.node.child(1).forEach((child, offset, i) => { if (i < index) panelPos += child.nodeSize })
        const tr = editor.state.tr
        tr.delete(panelPos, panelPos + tabs.node.child(1).child(index).nodeSize)
        tr.delete(buttonPos, buttonPos + tabs.node.child(0).child(index).nodeSize)
        editor.view.dispatch(tr)
        editor.commands.focus()
      },
      toggleAccordionAutoclose: () => editor.chain().focus().toggleAccordionAutoclose().run(),
      toggleDetailsOpen:        () => editor.chain().focus().toggleDetailsOpen().run(),
      addAccordionItem: () => {
        const info = _ancestorOfType('accordionBlock')
        if (!info) return
        const item = editor.schema.nodes.accordionItem.createAndFill()
        editor.view.dispatch(editor.state.tr.insert(info.pos + info.node.nodeSize - 1, item))
        editor.commands.focus()
      },
      deleteAccordionItem: () => {
        const group = _ancestorOfType('accordionBlock')
        const item = _ancestorOfType('accordionItem')
        if (!group || !item || group.node.childCount <= 1) return
        editor.view.dispatch(editor.state.tr.delete(item.pos, item.pos + item.node.nodeSize))
        editor.commands.focus()
      },
      addButton: () => {
        const info = _ancestorOfType('buttonsBlock')
        if (!info) return
        const btn = editor.schema.nodes.buttonBlock.createAndFill()
        editor.view.dispatch(editor.state.tr.insert(info.pos + info.node.nodeSize - 1, btn))
        editor.commands.focus()
      },
      deleteButton: () => {
        const group = _ancestorOfType('buttonsBlock')
        const btn = _ancestorOfType('buttonBlock')
        if (!group || !btn || group.node.childCount <= 1) return
        editor.view.dispatch(editor.state.tr.delete(btn.pos, btn.pos + btn.node.nodeSize))
        editor.commands.focus()
      },
      addColumnBlock: () => {
        const info = _ancestorOfType('columnsBlock')
        if (!info) return
        const col = editor.schema.nodes.columnBlock.createAndFill()
        editor.view.dispatch(editor.state.tr.insert(info.pos + info.node.nodeSize - 1, col))
        editor.commands.focus()
      },
      deleteColumnBlock: () => {
        const cols = _ancestorOfType('columnsBlock')
        const col = _ancestorOfType('columnBlock')
        if (!cols || !col || cols.node.childCount <= 1) return
        editor.view.dispatch(editor.state.tr.delete(col.pos, col.pos + col.node.nodeSize))
        editor.commands.focus()
      },
      deleteTable:   () => editor.chain().focus().deleteTable().run(),
      undo:          () => editor.chain().focus().undo().run(),
      redo:          () => editor.chain().focus().redo().run(),
      link: () => {
        // A button carries its link as a node attribute; the Link mark would
        // emit a second anchor beside the button's own and leave it unlinked.
        const button = _buttonBlockTarget(editor.state)
        if (button) {
          const dom = editor.view.nodeDOM(button.pos)
          const r = (dom && dom.getBoundingClientRect)
            ? dom.getBoundingClientRect()
            : document.querySelector('[data-cmd="link"]').getBoundingClientRect()
          if (window.webkit?.messageHandlers?.showLinkPicker) {
            window.webkit.messageHandlers.showLinkPicker.postMessage({
              href: button.node.attrs.href || '',
              rect: { x: r.x, y: r.y, width: r.width, height: r.height },
            })
          }
          return
        }
        const href = editor.getAttributes('link').href || ''
        const sel  = window.getSelection()
        let rect

        if (sel && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0)
          if (!range.collapsed) {
            // Text is selected — anchor to the selection rect
            const r = range.getBoundingClientRect()
            rect = { x: r.x, y: r.y, width: r.width, height: r.height }
          } else if (href) {
            // Collapsed cursor on a link — sel.anchorNode is unreliable at node
            // boundaries in ProseMirror; use domAtPos() and try adjacent offsets
            // to find the <a> regardless of where in the link the cursor sits.
            const from = editor.state.selection.from
            let linkEl = null
            for (const delta of [0, 1, -1, 2, -2]) {
              try {
                const dn = editor.view.domAtPos(from + delta).node
                const el = dn.nodeType === Node.TEXT_NODE ? dn.parentElement : dn
                const a  = el && el.closest('a')
                if (a) { linkEl = a; break }
              } catch (_) {}
            }
            if (linkEl) {
              const lr = linkEl.getBoundingClientRect()
              rect = { x: lr.x, y: lr.y, width: lr.width, height: lr.height }
            }
          }
        }

        // Fallback: toolbar button
        if (!rect) {
          const btn = document.querySelector('[data-cmd="link"]').getBoundingClientRect()
          rect = { x: btn.x, y: btn.y, width: btn.width, height: btn.height }
        }

        if (window.webkit?.messageHandlers?.showLinkPicker) {
          window.webkit.messageHandlers.showLinkPicker.postMessage({ href, rect })
        }
      },
      buttonLink: () => COMMANDS.link(),
      image: () => {
        if (_isInFootnote()) return
        if (window.webkit?.messageHandlers?.insertImage) {
          window.webkit.messageHandlers.insertImage.postMessage({})
        }
      },
      gallery: () => {

        }

      alignRight:  () => setImageAlignment('right'),
    }
