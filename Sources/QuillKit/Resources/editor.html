<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f3f1;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body.dark { background: #1c1c1e; color: #f0f0f0; }

    /* ── Toolbar ─────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      padding: 5px 16px;
      border-bottom: 1px solid #e0e0e0;
      background: inherit;
      flex-shrink: 0;
    }
    body.dark #toolbar { border-color: #3a3a3a; }

    #toolbar button, #toolbar select {
      font-family: inherit;
      font-size: 13px;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 3px 7px;
      cursor: pointer;
      background: transparent;
      color: inherit;
      transition: background 0.1s;
    }
    #toolbar button:hover { background: rgba(0,0,0,0.07); }
    body.dark #toolbar button:hover { background: rgba(255,255,255,0.1); }
    #toolbar button.active {
      background: rgba(0,122,255,0.12);
      color: #007aff;
      border-color: rgba(0,122,255,0.3);
    }
    #toolbar button:disabled { opacity: 0.35; cursor: default; }

    #heading-select {
      padding: 3px 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: transparent;
      color: inherit;
      font-size: 13px;
    }
    body.dark #heading-select { border-color: #555; }

    .tb-sep {
      width: 1px;
      height: 18px;
      background: #d0d0d0;
      margin: 0 4px;
      flex-shrink: 0;
    }
    body.dark .tb-sep { background: #444; }

    /* ── Editor area ─────────────────────────────────── */
    #editor-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      background: #ffffff;
    }
    body.dark #editor-wrap { background: #1c1c1e; }

    /* ── Code view textarea ──────────────────────────── */
    #code-editor {
      display: none;
      width: 100%;
      min-height: 100%;
      padding: 32px 24px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.7;
      color: inherit;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      tab-size: 2;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ProseMirror {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100%;
      outline: none;
      font-size: 16px;
      line-height: 1.75;
      caret-color: #007aff;
    }
    .spell-error {
      text-decoration: red wavy underline;
      text-decoration-skip-ink: none;
    }
    .ProseMirror p { margin: 0 0 0.8em; }
    .ProseMirror h1 { font-size: 2em;   font-weight: 700; margin: 1em 0 0.4em; }
    .ProseMirror h2 { font-size: 1.5em; font-weight: 600; margin: 0.9em 0 0.35em; }
    .ProseMirror h3 { font-size: 1.25em;font-weight: 600; margin: 0.8em 0 0.3em; }
    .ProseMirror h4 { font-size: 1.1em; font-weight: 600; margin: 0.75em 0 0.25em; }
    .ProseMirror h5 { font-size: 1em;   font-weight: 600; margin: 0.7em 0 0.2em; }
    .ProseMirror h6 { font-size: 0.9em; font-weight: 600; margin: 0.65em 0 0.2em; color: #666; }
    .ProseMirror blockquote {
      border-left: 3px solid #ccc;
      margin: 0.8em 0;
      padding-left: 1em;
      color: #666;
      font-style: italic;
    }
    body.dark .ProseMirror blockquote { border-color: #555; color: #aaa; }
    .ProseMirror blockquote cite {
      display: block;
      font-style: normal;
      font-size: 0.85em;
      color: #999;
      text-align: right;
      margin-top: 0.5em;
    }
    body.dark .ProseMirror blockquote cite { color: #666; }
    .ProseMirror code {
      background: rgba(0,0,0,0.07);
      border-radius: 3px;
      padding: 1px 4px;
      font-family: "SF Mono", monospace;
      font-size: 0.88em;
    }
    body.dark .ProseMirror code { background: rgba(255,255,255,0.1); }
    .ProseMirror pre {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 0.8em 0;
    }
    body.dark .ProseMirror pre { background: #2a2a2a; }
    .ProseMirror pre code { background: none; padding: 0; }
    .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; margin: 0.5em 0; }
    .ProseMirror li { margin: 0.2em 0; }
    .ProseMirror img { max-width: 100%; border-radius: 4px; }

    /* ── Image NodeView ─────────────────────────────── */
    .image-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
    }
    .image-wrapper img { display: block; max-width: 100%; border-radius: 4px; }
    .image-wrapper.selected img {
      outline: 2px solid #007aff;
      border-radius: 4px;
    }
    body.dark .image-wrapper.selected img { outline-color: #0a84ff; }

    .resize-handle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #007aff;
      border: 1.5px solid #fff;
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
    body.dark .resize-handle { background: #0a84ff; }
    .image-wrapper.selected .resize-handle { opacity: 1; pointer-events: auto; }
    .image-wrapper.align-left   { float: left;  display: block; margin: 0 1em 0.5em 0; }
    .image-wrapper.align-right  { float: right; display: block; margin: 0 0 0.5em 1em; }
    .image-wrapper.align-center { display: block; margin: 0 auto; width: fit-content; }

    .resize-handle.nw { top: -4px; left: -4px; cursor: nwse-resize; }
    .resize-handle.n  { top: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .resize-handle.ne { top: -4px; right: -4px; cursor: nesw-resize; }
    .resize-handle.e  { top: calc(50% - 4px); right: -4px; cursor: ew-resize; }
    .resize-handle.se { bottom: -4px; right: -4px; cursor: nwse-resize; }
    .resize-handle.s  { bottom: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .resize-handle.sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
    .resize-handle.w  { top: calc(50% - 4px); left: -4px; cursor: ew-resize; }

    /* ── Image toolbar ──────────────────────────────── */
    #image-toolbar {
      display: none;
      position: fixed;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      font-size: 12px;
      white-space: nowrap;
      z-index: 200;
      user-select: none;
    }
    body.dark #image-toolbar { background: #2c2c2e; border-color: #444; color: #f0f0f0; }
    #image-toolbar input[type="number"] {
      width: 52px;
      padding: 2px 4px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 12px;
      text-align: center;
      background: transparent;
      color: inherit;
    }
    body.dark #image-toolbar input[type="number"] { border-color: #555; }
    #image-toolbar input[type="number"]::-webkit-inner-spin-button,
    #image-toolbar input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    #image-toolbar button {
      font-size: 12px;
      padding: 2px 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      color: inherit;
    }
    #image-toolbar button:hover { background: rgba(0,0,0,0.07); }
    body.dark #image-toolbar button:hover { background: rgba(255,255,255,0.1); }
    #image-toolbar button:disabled { opacity: 0.4; cursor: default; }
    #image-toolbar .img-tb-sep { width: 1px; height: 14px; background: #ddd; margin: 0 2px; }
    body.dark #image-toolbar .img-tb-sep { background: #444; }
    #image-toolbar .img-tb-label { color: #999; }

    /* Task list */
    .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 0.5em; }
    .ProseMirror ul[data-type="taskList"] li {
      display: flex; align-items: flex-start; gap: 8px;
    }
    .ProseMirror ul[data-type="taskList"] li > label { margin-top: 2px; }
    .ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div {
      text-decoration: line-through; color: #888;
    }

    /* Tables */
    .ProseMirror table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .ProseMirror th, .ProseMirror td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
      min-width: 60px;
    }
    body.dark .ProseMirror th,
    body.dark .ProseMirror td { border-color: #555; }
    .ProseMirror th { background: #f5f5f5; font-weight: 600; }
    body.dark .ProseMirror th { background: #2a2a2a; }
    .ProseMirror .selectedCell { background: rgba(0,122,255,0.08); }

    /* Placeholder */
    .ProseMirror p.is-editor-empty:first-child::before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
      float: left;
      height: 0;
    }

    /* ── Drop overlay ────────────────────────────────── */
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 4px;
      background: rgba(0, 122, 255, 0.06);
      border: 2px dashed rgba(0, 122, 255, 0.45);
      border-radius: 8px;
      z-index: 100;
      pointer-events: none;
      align-items: center;
      justify-content: center;
    }
    #drop-overlay.active { display: flex; }
    #drop-overlay span {
      font-size: 14px;
      font-weight: 500;
      color: #007aff;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    body.dark #drop-overlay { background: rgba(10, 132, 255, 0.08); border-color: rgba(10,132,255,0.45); }
    body.dark #drop-overlay span { background: rgba(30,30,30,0.92); color: #0a84ff; }

    /* ── AI writing ─────────────────────────────────── */
    .ai-loading {
      font-style: italic;
      color: #888;
      animation: ai-pulse 1.1s ease-in-out infinite;
    }
    body.dark .ai-loading { color: #aaa; }
    @keyframes ai-pulse {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <!-- Block type -->
    <select id="heading-select" title="Heading">
      <option value="0">Paragraph</option>
      <option value="1">Heading 1</option>
      <option value="2">Heading 2</option>
      <option value="3">Heading 3</option>
      <option value="4">Heading 4</option>
      <option value="5">Heading 5</option>
      <option value="6">Heading 6</option>
    </select>
    <span class="tb-sep"></span>
    <!-- Inline + block marks -->
    <button data-cmd="bold"      title="Bold (⌘B)"><b>B</b></button>
    <button data-cmd="italic"    title="Italic (⌘I)"><i>I</i></button>

    <button data-cmd="strike"    title="Strikethrough"><s>S</s></button>
    <button data-cmd="code"      title="Inline code" style="font-family:monospace">`</button>
    <button data-cmd="blockquote" title="Blockquote">&ldquo;</button>
    <button data-cmd="codeBlock"  title="Code block" style="font-family:monospace">{}</button>
    <span class="tb-sep"></span>
    <!-- Lists -->
    <button data-cmd="bulletList"  title="Bullet list">&#8226;</button>
    <button data-cmd="orderedList" title="Ordered list">1.</button>
    <span class="tb-sep"></span>
    <!-- Insert -->
    <button data-cmd="insertTable" title="Insert 3×3 table">&#8862;</button>
    <span id="table-controls" style="display:none">
      <button data-cmd="addRowAfter"    title="Add row below">+Row</button>
      <button data-cmd="addColumnAfter" title="Add column right">+Col</button>
      <button data-cmd="deleteRow"      title="Delete row">&minus;Row</button>
      <button data-cmd="deleteColumn"   title="Delete column">&minus;Col</button>
      <button data-cmd="deleteTable"    title="Delete table">&#10005;</button>
    </span>
    <button data-cmd="link"  title="Insert / remove link">&#128279;</button>
    <button data-cmd="image" title="Insert image from media library">&#128444;</button>
    <span id="image-align-controls" style="display:none">
      <button data-cmd="alignLeft"   title="Float image left (text wraps right)">&#8592;</button>
      <button data-cmd="alignCenter" title="Center image">&#8596;</button>
      <button data-cmd="alignRight"  title="Float image right (text wraps left)">&#8594;</button>
    </span>
    <span class="tb-sep"></span>
    <!-- Utilities -->
    <button id="btn-spell" title="Check Spelling"><span style="text-decoration: red wavy underline; text-underline-offset: 3px; text-decoration-skip-ink: none;">ABC</span></button>
    <button data-cmd="undo" title="Undo (⌘Z)">&#8617;</button>
    <button data-cmd="redo" title="Redo (⌘⇧Z)">&#8618;</button>
    <span class="tb-sep"></span>
    <button id="btn-code-view" title="Toggle code view" style="font-family:monospace">&lt;/&gt;</button>
  </div>
  <div id="drop-overlay"><span>Drop to upload</span></div>
  <div id="image-toolbar">
    <span class="img-tb-label">W</span>
    <input type="number" id="img-tb-w" min="50" placeholder="—">
    <span class="img-tb-label">H</span>
    <input type="number" id="img-tb-h" min="50" placeholder="—">
    <span class="img-tb-sep"></span>
    <button data-size="thumbnail" style="display:none">Thumb</button>
    <button data-size="medium"    style="display:none">Medium</button>
    <button data-size="large"     style="display:none">Large</button>
    <button data-size="full"      style="display:none">Full</button>
    <span class="img-tb-sep"></span>
    <button id="img-tb-reset">Reset</button>
  </div>
  <div id="editor-wrap"><div id="editor"></div><textarea id="code-editor" spellcheck="false"></textarea></div>

  <script src="./tiptap-bundle.js"></script>
  <script src="./editor-transforms.js"></script>
  <script>
    const {
      Editor, Extension, TiptapNode,
      StarterKit, Underline,
      Table, TableRow, TableCell, TableHeader,
      TiptapImage, Blockquote, Link,
      TaskList, TaskItem,
      Placeholder,
      Plugin, PluginKey,
      DecorationSet, Decoration,
    } = TiptapBundle

    // ── ImageNodeView ─────────────────────────────────
    class ImageNodeView {
      constructor(node, editor, getPos) {
        this.node    = node
        this.editor  = editor
        this.getPos  = getPos

        this.wrapper = document.createElement('div')
        this.wrapper.className = 'image-wrapper'

        this.img = document.createElement('img')
        this._applyAttrs(node.attrs)
        this.wrapper.appendChild(this.img)

        for (const pos of ['nw','n','ne','e','se','s','sw','w']) {
          const h = document.createElement('div')
          h.className = `resize-handle ${pos}`
          h.addEventListener('mousedown', e => this._onHandleMousedown(e, pos))
          this.wrapper.appendChild(h)
        }

        this.dom = this.wrapper
      }

      _applyAttrs(attrs) {
        this.img.src = attrs.src || ''
        if (attrs.alt)   this.img.alt   = attrs.alt
        if (attrs.title) this.img.title = attrs.title
        if (attrs.width != null) {
          this.img.width = attrs.width
          this.wrapper.style.width = attrs.width + 'px'
        } else {
          this.img.removeAttribute('width')
          this.wrapper.style.width = ''
        }
        if (attrs.height != null) {
          this.img.height = attrs.height
        } else {
          this.img.removeAttribute('height')
        }
        // Alignment
        this.wrapper.classList.remove('align-left', 'align-right', 'align-center')
        if (attrs.alignment) this.wrapper.classList.add(`align-${attrs.alignment}`)
      }

      update(node) {
        if (node.type.name !== 'image') return false
        this.node = node
        this._applyAttrs(node.attrs)
        // Sync toolbar inputs if this image is currently selected
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) {
          document.getElementById('img-tb-w').value = node.attrs.width  ?? ''
          document.getElementById('img-tb-h').value = node.attrs.height ?? ''
        }
        return true
      }

      selectNode() {
        this.wrapper.classList.add('selected')
        _showImageToolbar(this)
      }

      deselectNode() {
        this.wrapper.classList.remove('selected')
        // Delay so toolbar inputs can receive focus before we check
        setTimeout(() => {
          const tb = document.getElementById('image-toolbar')
          if (tb && tb.contains(document.activeElement)) return
          if (tb?._activeNodeView === this) _hideImageToolbar()
        }, 80)
      }

      destroy() {
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) _hideImageToolbar()
      }

      stopEvent(e) {
        // Prevent ProseMirror from stealing handle mousedown events
        return e.type === 'mousedown' && e.target.classList.contains('resize-handle')
      }

      ignoreMutation() { return true }

      _onHandleMousedown(e, handlePos) {
        e.preventDefault()
        e.stopPropagation()

        const startX   = e.clientX
        const startY   = e.clientY
        const startW   = this.img.offsetWidth  || 300
        const startH   = this.img.offsetHeight || 200
        const ratio    = startW / startH
        const isCorner = ['nw','ne','sw','se'].includes(handlePos)
        const wSign    = handlePos.includes('e') ? 1 : handlePos.includes('w') ? -1 : 0
        const hSign    = handlePos.includes('s') ? 1 : handlePos.includes('n') ? -1 : 0

        const onMove = me => {
          const dx = (me.clientX - startX) * wSign
          const dy = (me.clientY - startY) * hSign
          let newW = startW
          let newH = startH

          if (isCorner && !me.shiftKey) {
            newW = Math.max(50, startW + dx)
            newH = newW / ratio
          } else {
            if (wSign !== 0) newW = Math.max(50, startW + dx)
            if (hSign !== 0) newH = Math.max(50, startH + dy)
          }

          newW = Math.round(newW)
          newH = Math.round(newH)

          this.img.style.width  = newW + 'px'
          this.img.style.height = newH + 'px'
          this.wrapper.style.width = newW + 'px'

          const wIn = document.getElementById('img-tb-w')
          const hIn = document.getElementById('img-tb-h')
          if (wIn) wIn.value = newW
          if (hIn) hIn.value = newH
        }

        const onUp = () => {
          document.removeEventListener('mousemove', onMove)
          document.removeEventListener('mouseup', onUp)

          const newW = Math.round(parseFloat(this.img.style.width)  || this.img.offsetWidth)
          const newH = Math.round(parseFloat(this.img.style.height) || this.img.offsetHeight)
          this.img.style.width  = ''
          this.img.style.height = ''

          const pos = this.getPos()
          if (typeof pos === 'number') {
            const { state, dispatch } = this.editor.view
            dispatch(state.tr.setNodeMarkup(pos, null, { ...this.node.attrs, width: newW, height: newH }))
          }
        }

        document.addEventListener('mousemove', onMove)
        document.addEventListener('mouseup', onUp)
      }
    }

    // ── Image toolbar helpers ──────────────────────────
    function _positionImageToolbar(tb, wrapper) {
      const wRect = wrapper.getBoundingClientRect()
      tb.style.left = wRect.left + 'px'
      tb.style.top  = (wRect.bottom + 6) + 'px'
    }

    function _showImageToolbar(nv) {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      tb._activeNodeView = nv
      document.getElementById('img-tb-w').value = nv.node.attrs.width  ?? ''
      document.getElementById('img-tb-h').value = nv.node.attrs.height ?? ''
      _updateNamedSizeButtons(null)

      _positionImageToolbar(tb, nv.wrapper)
      tb.style.display = 'flex'

      // Reposition on scroll so the toolbar tracks the image
      tb._scrollHandler = () => _positionImageToolbar(tb, nv.wrapper)
      document.getElementById('editor-wrap').addEventListener('scroll', tb._scrollHandler)

      if (nv.node.attrs.mediaId != null) {
        window.webkit?.messageHandlers?.requestMediaSizes
          ?.postMessage({ mediaId: nv.node.attrs.mediaId })
      }
    }

    function _hideImageToolbar() {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      if (tb._scrollHandler) {
        document.getElementById('editor-wrap').removeEventListener('scroll', tb._scrollHandler)
        tb._scrollHandler = null
      }
      tb.style.display = 'none'
      tb._activeNodeView = null
    }

    function _updateNamedSizeButtons(sizes) {
      document.querySelectorAll('#image-toolbar [data-size]').forEach(btn => {
        if (!sizes || !sizes[btn.dataset.size]) {
          btn.style.display = 'none'
          btn._sizeData = null
        } else {
          btn.style.display = ''
          btn.disabled = false
          btn._sizeData = sizes[btn.dataset.size]
        }
      })
    }

    // ── ResizableImage extension ──────────────────────
    const ResizableImage = TiptapImage.extend({
      addAttributes() {
        return {
          ...this.parent?.(),
          width: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('width')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.width != null ? { width: attrs.width } : {},
          },
          height: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('height')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.height != null ? { height: attrs.height } : {},
          },
          mediaId: {
            default: null,
            parseHTML: el => {
              const dataId = el.getAttribute('data-media-id')
              if (dataId) return parseInt(dataId, 10)
              const m = (el.getAttribute('class') || '').match(/wp-image-(\d+)/)
              return m ? parseInt(m[1], 10) : null
            },
            renderHTML: attrs => attrs.mediaId != null ? { 'data-media-id': attrs.mediaId } : {},
          },
          alignment: {
            default: null,
            parseHTML: el => extractAlignment(el.getAttribute('class') || ''),
            renderHTML: attrs => attrs.alignment ? { class: `align${attrs.alignment}` } : {},
          },
        }
      },
      parseHTML() {
        return [
          {
            tag: 'figure.wp-block-image',
            getAttrs: el => {
              const img = el.querySelector('img')
              if (!img) return false
              const dataId = img.getAttribute('data-media-id')
              const clsMatch = (img.getAttribute('class') || '').match(/wp-image-(\d+)/)
              return {
                src:       img.getAttribute('src'),
                alt:       img.getAttribute('alt') ?? null,
                title:     img.getAttribute('title') ?? null,
                width:     parseInt(img.getAttribute('width'), 10) || null,
                height:    parseInt(img.getAttribute('height'), 10) || null,
                mediaId:   dataId ? parseInt(dataId, 10)
                                  : (clsMatch ? parseInt(clsMatch[1], 10) : null),
                alignment: extractAlignment(el.getAttribute('class') || ''),
              }
            },
          },
          { tag: 'img[src]' },
        ]
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new ImageNodeView(node, editor, getPos)
      },
    })

    // ── Cite node ─────────────────────────────────────────
    // Optional last child of blockquote. Maps to <cite> in WordPress/Gutenberg.
    // No 'group' — cannot be inserted anywhere block is accepted; only blockquote
    // schema allows it via 'block+ cite?'.
    const Cite = TiptapNode.create({
      name: 'cite',
      content: 'inline*',
      parseHTML() {
        return [{ tag: 'cite' }]
      },
      renderHTML({ HTMLAttributes }) {
        return ['cite', HTMLAttributes, 0]
      },
      addKeyboardShortcuts() {
        return {
          Enter: () => {
            const { state } = this.editor
            const { $from } = state.selection
            if ($from.node($from.depth).type.name !== 'cite') return false
            // Find blockquote ancestor depth
            let bqDepth = -1
            for (let d = $from.depth; d >= 0; d--) {
              if ($from.node(d).type.name === 'blockquote') { bqDepth = d; break }
            }
            if (bqDepth === -1) return false
            // Insert a paragraph immediately after the blockquote
            const after = $from.after(bqDepth)
            const para = state.schema.nodes.paragraph.create()
            const tr = state.tr.insert(after, para)
            const resolved = tr.doc.resolve(after + 1)
            tr.setSelection(state.selection.constructor.near(resolved))
            this.editor.view.dispatch(tr)
            return true
          },
          Backspace: () => {
            const { state } = this.editor
            const { $from, empty } = state.selection
            if (!empty) return false
            const node = $from.node($from.depth)
            if (node.type.name !== 'cite' || node.content.size > 0) return false
            return this.editor.commands.deleteNode('cite')
          },
        }
      },
    })

    // ── Spell check ───────────────────────────────────────
    const spellCheckKey = new PluginKey('spellCheck')

    const SpellCheck = Extension.create({
      name: 'spellCheck',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: spellCheckKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                const incoming = tr.getMeta(spellCheckKey)
                if (incoming !== undefined) return incoming
                if (!tr.docChanged) return set
                let next = set.map(tr.mapping, tr.doc)
                for (const step of tr.steps) {
                  step.getMap().forEach((oldStart, oldEnd, newStart, newEnd) => {
                    const overlapping = next.find(newStart, newEnd)
                    if (overlapping.length) next = next.remove(overlapping)
                  })
                }
                return next
              }
            },
            props: {
              decorations(state) { return spellCheckKey.getState(state) }
            }
          })
        ]
      }
    })

    // Extended blockquote: allows an optional cite as its last child.
    const CustomBlockquote = Blockquote.extend({
      content: 'block+ cite?',
    })

    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: [
        StarterKit.configure({ blockquote: false }),
        CustomBlockquote,
        Cite,
        Underline,
        Table.configure({ resizable: false }),
        TableRow,
        TableHeader,
        TableCell,
        ResizableImage.configure({ inline: false }),
        Link.configure({ openOnClick: false, HTMLAttributes: { target: null, rel: null } }),
        TaskList,
        TaskItem.configure({ nested: true }),
        Placeholder.configure({ placeholder: 'Start writing…' }),
        SpellCheck,
      ],
      content: '',
      onTransaction: () => updateToolbar(),
      onCreate: () => {
        updateToolbar()
        if (window.webkit?.messageHandlers?.editorReady) {
          window.webkit.messageHandlers.editorReady.postMessage('ready')
        }
      },
    })

    function setImageAlignment(value) {
      const { state } = editor
      const node = state.selection.node
      if (!node || node.type.name !== 'image') return
      const pos = state.selection.from
      const newAlignment = node.attrs.alignment === value ? null : value
      editor.view.dispatch(
        state.tr.setNodeMarkup(pos, null, { ...node.attrs, alignment: newAlignment })
      )
      editor.view.focus()
    }

    // ── Toolbar commands ───────────────────────────────
    const COMMANDS = {
      bold:          () => editor.chain().focus().toggleBold().run(),
      italic:        () => editor.chain().focus().toggleItalic().run(),
      underline:     () => editor.chain().focus().toggleUnderline().run(),
      strike:        () => editor.chain().focus().toggleStrike().run(),
      code:          () => editor.chain().focus().toggleCode().run(),
      blockquote: () => {
        if (editor.isActive('blockquote')) {
          editor.chain().focus().toggleBlockquote().run()
          return
        }
        // Toggle on: wrap in blockquote then append an empty cite
        editor.chain()
          .focus()
          .toggleBlockquote()
          .command(({ tr, state }) => {
            const { $head } = state.selection
            for (let d = $head.depth; d >= 0; d--) {
              const node = $head.node(d)
              if (node.type.name === 'blockquote') {
                const end = $head.after(d) - 1
                tr.insert(end, state.schema.nodes.cite.create())
                return true
              }
            }
            return false
          })
          .run()
      },
      codeBlock:     () => editor.chain().focus().toggleCodeBlock().run(),
      bulletList:    () => editor.chain().focus().toggleBulletList().run(),
      orderedList:   () => editor.chain().focus().toggleOrderedList().run(),
      insertTable:   () => editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(),
      addRowAfter:   () => editor.chain().focus().addRowAfter().run(),
      addColumnAfter:() => editor.chain().focus().addColumnAfter().run(),
      deleteRow:     () => editor.chain().focus().deleteRow().run(),
      deleteColumn:  () => editor.chain().focus().deleteColumn().run(),
      deleteTable:   () => editor.chain().focus().deleteTable().run(),
      undo:          () => editor.chain().focus().undo().run(),
      redo:          () => editor.chain().focus().redo().run(),
      link: () => {
        const href = editor.getAttributes('link').href || ''
        const sel  = window.getSelection()
        let rect

        if (sel && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0)
          if (!range.collapsed) {
            // Text is selected — anchor to the selection rect
            const r = range.getBoundingClientRect()
            rect = { x: r.x, y: r.y, width: r.width, height: r.height }
          } else if (href) {
            // Collapsed cursor on a link — sel.anchorNode is unreliable at node
            // boundaries in ProseMirror; use domAtPos() and try adjacent offsets
            // to find the <a> regardless of where in the link the cursor sits.
            const from = editor.state.selection.from
            let linkEl = null
            for (const delta of [0, 1, -1, 2, -2]) {
              try {
                const dn = editor.view.domAtPos(from + delta).node
                const el = dn.nodeType === Node.TEXT_NODE ? dn.parentElement : dn
                const a  = el && el.closest('a')
                if (a) { linkEl = a; break }
              } catch (_) {}
            }
            if (linkEl) {
              const lr = linkEl.getBoundingClientRect()
              rect = { x: lr.x, y: lr.y, width: lr.width, height: lr.height }
            }
          }
        }

        // Fallback: toolbar button
        if (!rect) {
          const btn = document.querySelector('[data-cmd="link"]').getBoundingClientRect()
          rect = { x: btn.x, y: btn.y, width: btn.width, height: btn.height }
        }

        if (window.webkit?.messageHandlers?.showLinkPicker) {
          window.webkit.messageHandlers.showLinkPicker.postMessage({ href, rect })
        }
      },
      image: () => {
        if (window.webkit?.messageHandlers?.insertImageAtIndex) {
          window.webkit.messageHandlers.insertImageAtIndex.postMessage(0)
        }
      },
      alignLeft:   () => setImageAlignment('left'),
      alignCenter: () => setImageAlignment('center'),
      alignRight:  () => setImageAlignment('right'),
    }

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', e => {
        e.preventDefault()  // prevent focus loss before command runs
        COMMANDS[btn.dataset.cmd]?.()
      })
    })

    document.getElementById('btn-spell').addEventListener('mousedown', e => {
      e.preventDefault()
      window.webkit.messageHandlers.checkSpelling.postMessage(editor.getText())
    })

    document.getElementById('heading-select').addEventListener('change', e => {
      const level = parseInt(e.target.value)
      if (level === 0) editor.chain().focus().setParagraph().run()
      else editor.chain().focus().toggleHeading({ level }).run()
    })

    // ── Active-state updates ───────────────────────────
    const TOGGLE_CMDS = ['bold','italic','underline','strike','code',
                         'blockquote','codeBlock','bulletList','orderedList','link']

    function updateToolbar() {
      TOGGLE_CMDS.forEach(cmd => {
        const btn = document.querySelector(`[data-cmd="${cmd}"]`)
        if (btn) btn.classList.toggle('active', editor.isActive(cmd))
      })
      // Heading select
      const sel = document.getElementById('heading-select')
      sel.value = '0'
      for (let i = 1; i <= 6; i++) {
        if (editor.isActive('heading', { level: i })) { sel.value = String(i); break }
      }
      // Table controls
      const inTable = editor.isActive('table')
      document.getElementById('table-controls').style.display = inTable ? 'contents' : 'none'
      // Undo / Redo
      document.querySelector('[data-cmd="undo"]').disabled = !editor.can().undo()
      document.querySelector('[data-cmd="redo"]').disabled = !editor.can().redo()
      // Image alignment controls
      const selNode = editor.state.selection.node
      const selectedImage = selNode?.type.name === 'image' ? selNode : null
      const alignControls = document.getElementById('image-align-controls')
      if (selectedImage) {
        alignControls.style.display = 'contents'
        const alignCmdMap = { left: 'alignLeft', center: 'alignCenter', right: 'alignRight' }
        document.querySelectorAll('#image-align-controls button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.cmd === alignCmdMap[selectedImage.attrs.alignment])
        })
      } else {
        alignControls.style.display = 'none'
        document.querySelectorAll('#image-align-controls button').forEach(btn => {
          btn.classList.remove('active')
        })
      }
    }

    // ── Content change → Swift ─────────────────────────
    let debounce
    editor.on('update', () => {
      clearTimeout(debounce)
      debounce = setTimeout(() => {
        if (window.webkit?.messageHandlers?.contentChanged) {
          window.webkit.messageHandlers.contentChanged.postMessage(toWordPressHTML(editor.getHTML()))
        }
      }, 500)
    })

    // ── Swift → JS bridge (globals) ───────────────────
    window.applySpellErrors = function(words) {
      function escapeRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      }
      const { state, dispatch } = editor.view
      const decos = []
      if (Array.isArray(words) && words.length > 0) {
        state.doc.descendants((node, pos) => {
          if (!node.isText) return
          const text = node.text
          words.forEach(word => {
            const re = new RegExp('\\b' + escapeRegex(word) + '\\b', 'gi')
            let match
            while ((match = re.exec(text)) !== null) {
              decos.push(
                Decoration.inline(
                  pos + match.index,
                  pos + match.index + match[0].length,
                  { class: 'spell-error' }
                )
              )
            }
          })
        })
      }
      const decoSet = DecorationSet.create(state.doc, decos)
      dispatch(state.tr.setMeta(spellCheckKey, decoSet))
    }

    // ── Code view ─────────────────────────────────────
    let codeViewActive = false

    function _enterCodeView() {
      if (codeViewActive) return
      codeViewActive = true
      document.getElementById('code-editor').value = formatHTML(toWordPressHTML(editor.getHTML()))
      document.getElementById('editor').style.display = 'none'
      document.getElementById('code-editor').style.display = 'block'
      document.getElementById('btn-code-view').classList.add('active')
      document.getElementById('toolbar').querySelectorAll('button:not(#btn-code-view), select').forEach(el => { el.disabled = true })
      const ta = document.getElementById('code-editor')
      ta.selectionStart = ta.selectionEnd = 0
      ta.scrollTop = 0
      ta.focus()
    }

    function _exitCodeView() {
      if (!codeViewActive) return
      codeViewActive = false
      const html = document.getElementById('code-editor').value
      editor.commands.setContent(html, false)
      document.getElementById('editor').style.display = ''
      document.getElementById('code-editor').style.display = 'none'
      document.getElementById('btn-code-view').classList.remove('active')
      document.getElementById('toolbar').querySelectorAll('button, select').forEach(el => { el.disabled = false })
      editor.commands.focus()
      // setContent(html, false) suppresses the update event, so Swift never sees
      // the edited HTML. Fire contentChanged manually so htmlContent stays current.
      if (window.webkit?.messageHandlers?.contentChanged) {
        window.webkit.messageHandlers.contentChanged.postMessage(html)
      }
    }

    document.getElementById('btn-code-view').addEventListener('click', () => {
      codeViewActive ? _exitCodeView() : _enterCodeView()
    })

    window.setContent = html => {
      if (codeViewActive) {
        codeViewActive = false
        document.getElementById('editor').style.display = ''
        document.getElementById('code-editor').style.display = 'none'
        document.getElementById('btn-code-view').classList.remove('active')
        document.getElementById('toolbar').querySelectorAll('button, select').forEach(el => { el.disabled = false })
      }
      editor.commands.setContent(html || '', false)
      clearTimeout(debounce)  // cancel any contentChanged the setContent may have triggered
    }
    window.getContent = () => codeViewActive
      ? document.getElementById('code-editor').value
      : toWordPressHTML(editor.getHTML())
    window.setDarkMode = dark => document.body.classList.toggle('dark', dark)
    window.focusEditor = () => editor.commands.focus()
    window.insertImageAt = (_index, url, width, height, mediaId) => {
      const attrs = { src: url }
      if (width  != null) attrs.width   = width
      if (height != null) attrs.height  = height
      if (mediaId != null) attrs.mediaId = mediaId
      editor.chain().focus().setImage(attrs).run()
    }
    window.showDropOverlay = () => document.getElementById('drop-overlay').classList.add('active')
    window.hideDropOverlay = () => document.getElementById('drop-overlay').classList.remove('active')
    window.applyLink = url => {
      editor.chain().focus().setLink({ href: url }).run()
    }
    window.removeLink = () => {
      editor.chain().focus().unsetLink().run()
    }
    window.setMediaSizes = (mediaId, sizes) => {
      const tb = document.getElementById('image-toolbar')
      if (!tb || tb.style.display === 'none') return
      const nv = tb._activeNodeView
      if (!nv || nv.node.attrs.mediaId !== mediaId) return
      _updateNamedSizeButtons(sizes)
    }

    // ── Image toolbar event handlers ──────────────────
    ;(function () {
      function commitDims(newW, newH) {
        const tb = document.getElementById('image-toolbar')
        const nv = tb?._activeNodeView
        if (!nv) return
        const pos = nv.getPos()
        if (typeof pos !== 'number') return
        const { state, dispatch } = nv.editor.view
        dispatch(state.tr.setNodeMarkup(pos, null, { ...nv.node.attrs, width: newW, height: newH }))
      }

      document.getElementById('img-tb-w').addEventListener('change', e => {
        const tb  = document.getElementById('image-toolbar')
        const nv  = tb?._activeNodeView
        const newW = Math.max(50, parseInt(e.target.value) || 50)
        let newH = nv?.node.attrs.height ?? null
        const attrs = nv?.node.attrs
        if (attrs?.width && attrs?.height) {
          newH = Math.round(newW * (attrs.height / attrs.width))
          document.getElementById('img-tb-h').value = newH
        }
        commitDims(newW, newH)
      })

      document.getElementById('img-tb-h').addEventListener('change', e => {
        const tb  = document.getElementById('image-toolbar')
        const nv  = tb?._activeNodeView
        const newH = Math.max(50, parseInt(e.target.value) || 50)
        let newW = nv?.node.attrs.width ?? null
        const attrs = nv?.node.attrs
        if (attrs?.width && attrs?.height) {
          newW = Math.round(newH * (attrs.width / attrs.height))
          document.getElementById('img-tb-w').value = newW
        }
        commitDims(newW, newH)
      })

      document.getElementById('img-tb-reset').addEventListener('click', () => {
        const tb = document.getElementById('image-toolbar')
        const nv = tb?._activeNodeView
        if (!nv) return
        const pos = nv.getPos()
        if (typeof pos !== 'number') return
        const { state, dispatch } = nv.editor.view
        dispatch(state.tr.setNodeMarkup(pos, null, { ...nv.node.attrs, width: null, height: null }))
        document.getElementById('img-tb-w').value = ''
        document.getElementById('img-tb-h').value = ''
      })

      document.querySelectorAll('#image-toolbar [data-size]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tb = document.getElementById('image-toolbar')
          const nv = tb?._activeNodeView
          if (!nv || !btn._sizeData) return
          const { url, width, height } = btn._sizeData
          const pos = nv.getPos()
          if (typeof pos !== 'number') return
          const { state, dispatch } = nv.editor.view
          dispatch(state.tr.setNodeMarkup(pos, null, { ...nv.node.attrs, src: url, width, height }))
          document.getElementById('img-tb-w').value = width
          document.getElementById('img-tb-h').value = height
        })
      })
    })()

    // ── AI writing bridge ─────────────────────────────
    let _aiOriginalHTML = null
    let _aiFrom         = null
    let _aiTo           = null
    let _aiResultTo     = null
    let _aiInProgress   = false

    // Report selection changes to Swift so it can show/hide the operation pill.
    // Debounced to avoid flooding during drag-selection.
    let _selChangeTimer = null
    document.addEventListener('selectionchange', () => {
      clearTimeout(_selChangeTimer)
      _selChangeTimer = setTimeout(() => {
        if (_aiInProgress) return
        const sel = window.getSelection()
        if (!sel || sel.isCollapsed || sel.toString().length < 10) {
          window.webkit?.messageHandlers?.selectionChanged?.postMessage(null)
          return
        }
        const range = sel.getRangeAt(0)
        const rect  = range.getBoundingClientRect()
        window.webkit?.messageHandlers?.selectionChanged?.postMessage({
          text: sel.toString(),
          rect: { x: rect.left, y: rect.top, width: rect.width, height: rect.height },
        })
      }, 150)
    })

    // Called by Swift when the user taps a pill button.
    // Captures original HTML + selection positions, replaces selection with a loading
    // placeholder, and returns the selected plain text for use as prompt input.
    // Returns null if there is no valid selection (≥10 chars).
    window.beginAIOperation = () => {
      const sel = window.getSelection()
      if (!sel || sel.isCollapsed) return null
      const selectedText = sel.toString()
      if (selectedText.length < 10) return null

      const { from, to } = editor.state.selection
      _aiFrom         = from
      _aiTo           = to
      _aiOriginalHTML = editor.getHTML()
      _aiInProgress   = true

      // Replace selected range with an animated loading placeholder
      editor.chain().focus()
        .setTextSelection({ from, to })
        .insertContent('<em class="ai-loading">✶ Rewriting…</em>')
        .run()

      return selectedText
    }

    // Called by Swift with Claude's HTML result.
    // Restores the original document (silently), inserts the result at the original
    // range, selects it for visual feedback, and returns the bounding rect so Swift
    // can position the accept/discard panel.
    window.showAIResult = (html) => {
      // Clean Claude's response through the DOM so regex edge-cases can't slip through
      const _tmp = document.createElement('div')
      _tmp.innerHTML = html
      // Remove empty block elements (<p></p>, <p>&nbsp;</p>, etc.)
      _tmp.querySelectorAll('p, h1, h2, h3, h4, h5, h6').forEach(el => {
        if (!el.textContent.trim() && !el.querySelector('img, table')) el.remove()
      })
      // Remove whitespace-only text nodes between block elements — ProseMirror
      // treats the \n\n Claude emits between <p> tags as text and wraps the first
      // one in a blank paragraph even with preserveWhitespace: false.
      Array.from(_tmp.childNodes).forEach(n => {
        if (n.nodeType === Node.TEXT_NODE && !n.textContent.trim()) n.remove()
      })
      const cleanHtml = _tmp.innerHTML.trim()
      if (!cleanHtml) return null

      // Restore original without emitting a contentChanged event
      editor.commands.setContent(_aiOriginalHTML, false)

      // Expand to full block-node boundaries so we replace whole paragraphs rather
      // than splitting them mid-text (which leaves empty <p> fragments at the top).
      const { state } = editor
      const $from   = state.doc.resolve(_aiFrom)
      const $to     = state.doc.resolve(_aiTo)
      const nodeFrom = $from.depth > 0 ? $from.before($from.depth) : 0
      const nodeTo   = $to.depth > 0   ? $to.after($to.depth)      : $to.end()

      // Insert the result — this DOES emit contentChanged (marks post dirty).
      // preserveWhitespace: false prevents ProseMirror from wrapping the \n
      // characters Claude emits between <p> tags into blank paragraph nodes.
      editor.chain().focus()
        .insertContentAt({ from: nodeFrom, to: nodeTo }, cleanHtml, {
          parseOptions: { preserveWhitespace: false }
        })
        .run()
      _aiResultTo = editor.state.selection.to

      // Select the inserted range — browser selection acts as the visual highlight
      editor.chain().setTextSelection({ from: nodeFrom, to: _aiResultTo }).run()
      const s = window.getSelection()
      if (s && !s.isCollapsed) {
        const r = s.getRangeAt(0).getBoundingClientRect()
        return { x: r.left, y: r.top, width: r.width, height: r.height }
      }
      return null
    }

    // Called by Swift when the user accepts the result.
    // Collapses the selection to the end of the inserted content and clears AI state.
    window.acceptAIResult = () => {
      if (_aiResultTo !== null) {
        editor.chain().focus().setTextSelection(_aiResultTo).run()
      }
      _aiOriginalHTML = null
      _aiFrom         = null
      _aiTo           = null
      _aiResultTo     = null
      _aiInProgress   = false
    }

    // Called by Swift when the user discards the result (or on error).
    // Restores original HTML and clears AI state. Emits contentChanged so Swift's
    // htmlContent is updated back to the pre-operation value.
    window.discardAIResult = () => {
      if (_aiOriginalHTML !== null) {
        editor.commands.setContent(_aiOriginalHTML)
        _aiOriginalHTML = null
        _aiFrom         = null
        _aiTo           = null
        _aiResultTo     = null
      }
      _aiInProgress = false
    }
  </script>
</body>
</html>
