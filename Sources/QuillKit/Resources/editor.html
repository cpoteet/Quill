<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f3f1;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f0f0f0; }
    }
    body.dark { background: #1c1c1e; color: #f0f0f0; }

    /* ── Toolbar ─────────────────────────────────────── */
    #toolbar-wrap {
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }
    #toolbar-wrap::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 28px;
      background: linear-gradient(to right, transparent, rgba(247,247,248,0.96));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
    }
    body.dark #toolbar-wrap::after {
      background: linear-gradient(to right, transparent, rgba(36,36,38,0.96));
    }
    @media (prefers-color-scheme: dark) {
      #toolbar-wrap::after {
        background: linear-gradient(to right, transparent, rgba(36,36,38,0.96));
      }
    }
    #toolbar-wrap.overflowing::after { opacity: 1; }

    #toolbar {
      --toolbar-bg: #f7f7f8;
      display: flex;
      align-items: center;
      align-content: center;
      flex-wrap: nowrap;
      gap: 5px;
      min-height: 42px;
      padding: 6px 16px;
      background: rgba(247, 247, 248, 0.96);
      flex-shrink: 0;
      box-shadow: none;
      overflow-x: auto;
      overflow-y: hidden;
    }
    @media (prefers-color-scheme: dark) {
      #toolbar {
        --toolbar-bg: #242426;
        background: rgba(36, 36, 38, 0.96);
        border-color: rgba(255, 255, 255, 0.13);
      }
    }
    body.dark #toolbar {
      --toolbar-bg: #242426;
      background: rgba(36, 36, 38, 0.96);
      border-color: rgba(255, 255, 255, 0.13);
    }

    #toolbar button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      border-radius: 6px;
      min-width: 26px;
      height: 26px;
      padding: 0 4px;
      cursor: pointer;
      background: transparent;
      color: #5f6470;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.12s ease, color 0.12s ease;
    }
    #toolbar button:hover {
      background: rgba(0,0,0,0.045);
      color: #3f434d;
    }
    body.dark #toolbar button:hover {
      background: rgba(255,255,255,0.08);
      color: #d3d4d8;
    }
    #toolbar button.active {
      background: #ececef;
      color: #3f434d;
      border-color: transparent;
      box-shadow: none;
    }
    body.dark #toolbar button.active {
      background: rgba(255,255,255,0.12);
      color: #f4f4f5;
    }
    #toolbar button:disabled {
      opacity: 0.28;
      cursor: default;
      box-shadow: none;
    }
    #toolbar button:disabled:hover {
      background: transparent;
      border-color: transparent;
    }
    #toolbar button:focus-visible {
      outline: 2px solid rgba(123,92,255,0.35);
      outline-offset: 1px;
    }
    #toolbar svg {
      width: 16px;
      height: 16px;
      display: block;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    #toolbar .tb-text-icon {
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0;
    }
    #btn-footnote .tb-text-icon {
      font-size: 26px;
      position: relative;
      top: 4px;
    }
    #toolbar .tb-code-text {
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 21px;
      height: 16px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
    }
    #toolbar .tb-inline-code {
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
      padding: 0 3px;
      height: 16px;
    }
    body.dark #toolbar .tb-inline-code {
      background: rgba(255,255,255,0.15);
    }
    #toolbar .tb-spell-icon {
      color: inherit;
      display: inline-grid;
      place-items: center;
      min-width: 23px;
      height: 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
    }
    #toolbar .tb-add {
      gap: 5px;
      min-width: auto;
      padding: 0 5px;
      font-size: 14px;
      font-weight: 400;
    }
    #toolbar .tb-add svg {
      width: 18px;
      height: 18px;
    }
    #toolbar .tb-image-plus-cutout {
      stroke: var(--toolbar-bg);
      stroke-width: 5;
    }
    #toolbar .tb-image-plus {
      stroke: currentColor;
      stroke-width: 1.9;
    }

    #heading-button {
      min-width: 48px;
      padding: 0 8px 0 10px;
      border-radius: 14px;
      gap: 4px;
      color: #5f6470;
      background: #eeeef1;
    }
    #heading-button.heading-active {
      color: #3f434d;
      background: #ececef;
    }
    #heading-button svg {
      width: 11px;
      height: 11px;
      stroke-width: 2;
    }
    .heading-current {
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }
    #heading-menu {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 950;
      min-width: 172px;
      padding: 8px;
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 18px;
      background: rgba(255,255,255,0.98);
      color: #555965;
      box-shadow: 0 18px 45px rgba(28,28,35,0.16);
    }
    #heading-menu.visible { display: block; }
    body.dark #heading-menu {
      background: rgba(42,42,45,0.98);
      border-color: rgba(255,255,255,0.08);
      color: #e8e8ea;
      box-shadow: 0 18px 45px rgba(0,0,0,0.36);
    }
    .heading-menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }
    .heading-menu-item:hover,
    .heading-menu-item.active {
      background: #ececef;
      color: #3f434d;
    }
    body.dark .heading-menu-item:hover,
    body.dark .heading-menu-item.active {
      background: rgba(255,255,255,0.12);
      color: #f4f4f5;
    }
    .heading-menu-key {
      width: 25px;
      flex: 0 0 25px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      color: currentColor;
      opacity: 0.9;
    }
    .heading-menu-label {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
    }
    .tb-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 5px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      flex-shrink: 0;
      max-width: 100%;
    }
    body.dark .tb-group {
      background: transparent;
      border-color: transparent;
    }
    .tb-sep {
      width: 1px;
      height: 26px;
      background: #dedfe3;
      flex-shrink: 0;
    }
    body.dark .tb-sep { background: #3a3a3d; }
    body.dark #toolbar button {
      color: #b9bbc2;
    }
    #table-controls, #image-align-controls {
      align-items: center;
      gap: 5px;
    }
    #table-controls button {
      min-width: auto;
      padding: 0 9px;
    }
    #toolbar-tooltip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      pointer-events: none;
      padding: 5px 8px;
      border-radius: 5px;
      background: rgba(24,24,27,0.96);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 2px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.24);
    }
    #toolbar-tooltip.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    #toolbar-tooltip::before {
      content: "";
      position: absolute;
      left: var(--arrow-offset, 50%);
      width: 7px;
      height: 7px;
      background: rgba(24,24,27,0.96);
      transform: translateX(-50%) rotate(45deg);
    }
    #toolbar-tooltip.below::before { top: -3px; }
    #toolbar-tooltip.above::before { bottom: -3px; }

    /* ── Editor area ─────────────────────────────────── */
    #editor-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      #editor-wrap { background: #1c1c1e; }
    }
    body.dark #editor-wrap { background: #1c1c1e; }

    /* ── Code view textarea ──────────────────────────── */
    #code-editor {
      display: none;
      width: 100%;
      min-height: 100%;
      padding: 32px 24px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.7;
      color: inherit;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      tab-size: 2;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ProseMirror {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100%;
      outline: none;
      font-size: 16px;
      line-height: 1.75;
      caret-color: #007aff;
    }
    .spell-error {
      text-decoration: red wavy underline;
      text-decoration-skip-ink: none;
    }
    .ProseMirror p { margin: 0 0 0.8em; }
    .ProseMirror h1 { font-size: 2em;   font-weight: 700; margin: 1em 0 0.4em; }
    .ProseMirror h2 { font-size: 1.5em; font-weight: 600; margin: 0.9em 0 0.35em; }
    .ProseMirror h3 { font-size: 1.25em;font-weight: 600; margin: 0.8em 0 0.3em; }
    .ProseMirror h4 { font-size: 1.1em; font-weight: 600; margin: 0.75em 0 0.25em; }
    .ProseMirror h5 { font-size: 1em;   font-weight: 600; margin: 0.7em 0 0.2em; }
    .ProseMirror h6 { font-size: 0.9em; font-weight: 600; margin: 0.65em 0 0.2em; color: #666; }
    .ProseMirror blockquote {
      border-left: 3px solid #ccc;
      margin: 0.8em 0;
      padding-left: 1em;
      color: #666;
      font-style: italic;
    }
    body.dark .ProseMirror blockquote { border-color: #555; color: #aaa; }
    .ProseMirror blockquote cite {
      display: block;
      font-style: normal;
      font-size: 0.85em;
      color: #999;
      text-align: right;
      margin-top: 0.5em;
    }
    body.dark .ProseMirror blockquote cite { color: #666; }
    .ProseMirror code {
      background: rgba(0,0,0,0.07);
      border-radius: 3px;
      padding: 1px 4px;
      font-family: "SF Mono", monospace;
      font-size: 0.88em;
    }
    body.dark .ProseMirror code { background: rgba(255,255,255,0.1); }
    .ProseMirror pre {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 0.8em 0;
    }
    body.dark .ProseMirror pre { background: #2a2a2a; }
    body.dark .ProseMirror a { color: #5ab4f5; }
    .ProseMirror pre code { background: none; padding: 0; }
    .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; margin: 0.5em 0; }
    .ProseMirror li { margin: 0.2em 0; }
    .ProseMirror img { max-width: 100%; border-radius: 4px; }

    /* ── Image NodeView ─────────────────────────────── */
    .image-wrapper {
      display: inline-block;
      max-width: 100%;
      line-height: 0;
      -webkit-user-modify: read-only;
    }
    .image-wrapper figcaption {
      -webkit-user-modify: read-write;
    }
    .image-frame {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .image-wrapper img { display: block; max-width: 100%; border-radius: 4px; pointer-events: none; -webkit-user-select: none; user-select: none; }
    .image-wrapper.ProseMirror-selectednode { outline: none; }
    .image-wrapper.selected img {
      outline: 2px solid #007aff;
      border-radius: 4px;
    }
    body.dark .image-wrapper.selected img { outline-color: #0a84ff; }

    .resize-handle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #007aff;
      border: 1.5px solid #fff;
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
    body.dark .resize-handle { background: #0a84ff; }
    .image-wrapper.selected .resize-handle { opacity: 1; pointer-events: auto; }
    .image-wrapper.align-left   { float: left;  display: block; margin: 0 1em 0.5em 0; }
    .image-wrapper.align-right  { float: right; display: block; margin: 0 0 0.5em 1em; }
    .image-wrapper.align-center { display: block; margin: 0 auto; width: fit-content; }

    .resize-handle.nw { top: -4px; left: -4px; cursor: nwse-resize; }
    .resize-handle.n  { top: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .resize-handle.ne { top: -4px; right: -4px; cursor: nesw-resize; }
    .resize-handle.e  { top: calc(50% - 4px); right: -4px; cursor: ew-resize; }
    .resize-handle.se { bottom: -4px; right: -4px; cursor: nwse-resize; }
    .resize-handle.s  { bottom: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .resize-handle.sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
    .resize-handle.w  { top: calc(50% - 4px); left: -4px; cursor: ew-resize; }

    /* ── Image caption ──────────────────────────────── */
    .image-wrapper figcaption {
      display: block;
      text-align: left;
      font-style: italic;
      font-size: 0.85em;
      line-height: 1.4;
      color: #555;
      padding: 6px 10px 8px;
      margin-top: 6px;
      margin-bottom: 4px;
      border-top: 1px solid #e0e0e0;
      outline: none;
    }
    body.dark .image-wrapper figcaption {
      color: #aaa;
      border-top-color: #444;
    }
    .image-wrapper figcaption.caption-placeholder:empty::before {
      content: "Add a caption\2026";
      color: #bbb;
      pointer-events: none;
    }
    body.dark .image-wrapper figcaption.caption-placeholder:empty::before { color: #666; }

    /* ── Image toolbar ──────────────────────────────── */
    #image-toolbar {
      display: none;
      position: fixed;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 3px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.16);
      font-size: 12px;
      white-space: nowrap;
      z-index: 200;
      user-select: none;
      backdrop-filter: blur(18px);
    }
    body.dark #image-toolbar {
      background: rgba(44,44,46,0.96);
      border-color: rgba(255,255,255,0.12);
      color: #f0f0f0;
    }
    .img-tb-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 7px;
    }
    .img-tb-row + .img-tb-row { border-top: 1px solid rgba(0,0,0,0.08); }
    body.dark .img-tb-row + .img-tb-row { border-top-color: rgba(255,255,255,0.1); }
    #image-toolbar input[type="text"] {
      flex: 1;
      min-width: 140px;
      height: 26px;
      padding: 0 7px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 6px;
      font-size: 12px;
      background: rgba(255,255,255,0.58);
      color: inherit;
    }
    body.dark #image-toolbar input[type="text"] {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
    }
    #image-toolbar input[type="number"] {
      width: 52px;
      height: 26px;
      padding: 0 5px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      background: rgba(255,255,255,0.58);
      color: inherit;
    }
    body.dark #image-toolbar input[type="number"] {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
    }
    #image-toolbar input[type="number"]::-webkit-inner-spin-button,
    #image-toolbar input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    #image-toolbar button {
      font-size: 12px;
      font-weight: 600;
      height: 26px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      color: inherit;
    }
    #image-toolbar button:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.08);
    }
    body.dark #image-toolbar button:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.1);
    }
    #image-toolbar button:disabled { opacity: 0.4; cursor: default; }
    #image-toolbar .img-tb-sep { width: 1px; height: 14px; background: #ddd; margin: 0 2px; }
    body.dark #image-toolbar .img-tb-sep { background: #444; }
    #image-toolbar .img-tb-label { color: #999; }


    /* Tables */
    .ProseMirror table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .ProseMirror th, .ProseMirror td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
      min-width: 60px;
    }
    body.dark .ProseMirror th,
    body.dark .ProseMirror td { border-color: #555; }
    .ProseMirror th { background: #f5f5f5; font-weight: 600; }
    body.dark .ProseMirror th { background: #2a2a2a; }
    .ProseMirror .selectedCell { background: rgba(0,122,255,0.08); }

    /* Placeholder */
    .ProseMirror p.is-editor-empty:first-child::before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
      float: left;
      height: 0;
    }

    /* ── Drop overlay ────────────────────────────────── */
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 4px;
      background: rgba(0, 122, 255, 0.06);
      border: 2px dashed rgba(0, 122, 255, 0.45);
      border-radius: 8px;
      z-index: 100;
      pointer-events: none;
      align-items: center;
      justify-content: center;
    }
    #drop-overlay.active { display: flex; }
    #drop-overlay span {
      font-size: 14px;
      font-weight: 500;
      color: #007aff;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    body.dark #drop-overlay { background: rgba(10, 132, 255, 0.08); border-color: rgba(10,132,255,0.45); }
    body.dark #drop-overlay span { background: rgba(30,30,30,0.92); color: #0a84ff; }

    /* ── AI writing ─────────────────────────────────── */
    .ai-loading {
      font-style: italic;
      color: #888;
      animation: ai-pulse 1.1s ease-in-out infinite;
    }
    body.dark .ai-loading { color: #aaa; }
    @keyframes ai-pulse {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.85; }
    }

    /* ── Find & replace ─────────────────────────────── */
    #find-bar {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #f4f3f1;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      font-size: 12px;
      overflow: hidden;
    }
    #find-bar.visible { display: flex; }
    #find-bar input {
      flex: 1 1 80px;
      min-width: 0;
      padding: 3px 7px;
      font-size: 12px;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 5px;
      background: #fff;
      color: inherit;
      outline: none;
    }
    #find-bar input:focus { border-color: #b45309; }
    #find-bar button {
      padding: 3px 8px;
      font-size: 12px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }
    #find-bar button.active { background: #b45309; color: #fff; border-color: #b45309; }
    #find-count { color: #888; min-width: 52px; text-align: center; }
    .find-sep { width: 1px; height: 16px; background: rgba(0,0,0,0.12); margin: 0 4px; }
    .find-match { background: rgba(255, 200, 0, 0.35); border-radius: 2px; }
    .find-match-active { background: rgba(255, 145, 0, 0.6); }
    body.dark #find-bar { background: #2a2a2a; border-bottom-color: rgba(255,255,255,0.1); }
    body.dark #find-bar input,
    body.dark #find-bar button { background: #3a3a3a; border-color: rgba(255,255,255,0.15); color: #eee; }
    body.dark #find-bar button.active { background: #d97706; border-color: #d97706; }
    body.dark .find-match { background: rgba(255, 200, 0, 0.30); }
    body.dark .find-match-active { background: rgba(255, 145, 0, 0.55); }

    /* ── Embed card ─────────────────────────────────── */
    .embed-card {
      margin: 1em 0;
      padding: 14px 16px;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 8px;
      background: rgba(0,0,0,0.025);
      cursor: default;
      user-select: none;
    }
    .embed-card.selected { outline: 2px solid #b45309; outline-offset: 1px; }
    .embed-card-provider { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
    .embed-card-url { font-size: 12px; color: #777; word-break: break-all; }
    .embed-card-hint { font-size: 11px; color: #999; margin-top: 6px; font-style: italic; }
    body.dark .embed-card { border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.04); }
    body.dark .embed-card-url { color: #999; }
    body.dark .embed-card-hint { color: #777; }
    #embed-menu {
      display: none;
      position: fixed;
      z-index: 60;
      padding: 8px;
      gap: 6px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.14);
    }
    #embed-menu.visible { display: flex; }
    #embed-menu input {
      width: 260px;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 5px;
      outline: none;
    }
    #embed-menu input:focus { border-color: #b45309; }
    #embed-menu button {
      padding: 4px 10px;
      font-size: 12px;
      border: none;
      border-radius: 5px;
      background: #b45309;
      color: #fff;
      cursor: pointer;
    }
    body.dark #embed-menu { background: #2e2e2e; border-color: rgba(255,255,255,0.15); }
    body.dark #embed-menu input { background: #3a3a3a; border-color: rgba(255,255,255,0.15); color: #eee; }

    /* ── Footnotes ──────────────────────────────────── */
    #editor { counter-reset: quill-footnote; }
    sup.fn { counter-increment: quill-footnote; }
    sup.fn a::before { content: counter(quill-footnote); }
    sup.fn a {
      color: #b45309;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    ol.wp-block-footnotes {
      margin-top: 2.2em;
      padding-top: 0.9em;
      border-top: 1px solid rgba(0,0,0,0.15);
      font-size: 0.85em;
      color: #555;
    }
    body.dark ol.wp-block-footnotes { border-top-color: rgba(255,255,255,0.2); color: #aaa; }
    .fn-backref {
      color: #b45309;
      text-decoration: none;
      margin-left: 0.35em;
      font-size: 0.85em;
      cursor: pointer;
      opacity: 0.65;
      user-select: none;
    }
    .fn-backref:hover { opacity: 1; }
    body.dark .fn-backref { color: #d97706; }
  </style>

  <script src="./tiptap-bundle.js"></script>
  <script src="./editor-transforms.js"></script>
  <script>
    const {
      Editor, Extension, TiptapNode,
      StarterKit, Underline,
      Table, TableRow, TableCell, TableHeader,
      TiptapImage, Blockquote, Link,

      Placeholder,
      Plugin, PluginKey,
      DecorationSet, Decoration,
      Paragraph, Heading, BulletList, OrderedList, ListItem, CodeBlock,
    } = TiptapBundle

    // Extend a Tiptap extension to preserve arbitrary class and id attributes
    // through the ProseMirror schema, so visual edits don't strip them.
    function withClassAttr(extension) {
      return extension.extend({
        addAttributes() {
          return {
            ...this.parent?.(),
            class: {
              default: null,
              parseHTML: element => element.getAttribute('class') || null,
              renderHTML: attributes => {
                if (!attributes.class) return {}
                return { class: attributes.class }
              },
            },
            id: {
              default: null,
              parseHTML: element => element.getAttribute('id') || null,
              renderHTML: attributes => {
                if (!attributes.id) return {}
                return { id: attributes.id }
              },
            },
          }
        },
      })
    }

    const ParagraphWithClass  = withClassAttr(Paragraph)
    const HeadingWithClass    = withClassAttr(Heading)
    const BulletListWithClass = withClassAttr(BulletList.extend({
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, () => _isInFootnote() ? true : fn()]))
      },
    }))
    const OrderedListWithClass = withClassAttr(OrderedList.extend({
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, () => _isInFootnote() ? true : fn()]))
      },
    }))
    const ListItemWithClass   = withClassAttr(ListItem)

    // ── ImageNodeView ─────────────────────────────────
    class ImageNodeView {
      constructor(node, editor, getPos) {
        this.node    = node
        this.editor  = editor
        this.getPos  = getPos

        this.wrapper = document.createElement('div')
        this.wrapper.className = 'image-wrapper'

        this.frame = document.createElement('div')
        this.frame.className = 'image-frame'
        this.frame.contentEditable = 'false'

        this.img = document.createElement('img')
        this._applyAttrs(node.attrs)
        this.frame.appendChild(this.img)

        for (const pos of ['nw','n','ne','e','se','s','sw','w']) {
          const h = document.createElement('div')
          h.className = `resize-handle ${pos}`
          h.addEventListener('mousedown', e => this._onHandleMousedown(e, pos))
          this.frame.appendChild(h)
        }

        this.wrapper.appendChild(this.frame)

        this.figcaption = document.createElement('figcaption')
        this.figcaption.className = 'caption-placeholder'
        this.wrapper.appendChild(this.figcaption)

        this.dom        = this.wrapper
        this.contentDOM = this.figcaption
      }

      _applyAttrs(attrs) {
        this.img.src = attrs.src || ''
        if (attrs.alt) { this.img.alt = attrs.alt } else { this.img.removeAttribute('alt') }
        if (attrs.title) this.img.title = attrs.title
        if (attrs.width != null) {
          this.img.style.width = ''
          this.img.width = attrs.width
          this.frame.style.width = attrs.width + 'px'
        } else {
          this.img.style.width = ''
          this.img.removeAttribute('width')
          this.frame.style.width = ''
        }
        if (attrs.height != null) {
          this.img.style.height = ''
          this.img.height = attrs.height
        } else {
          this.img.style.height = ''
          this.img.removeAttribute('height')
        }
        // Alignment
        this.wrapper.classList.remove('align-left', 'align-right', 'align-center')
        if (attrs.alignment) this.wrapper.classList.add(`align-${attrs.alignment}`)
      }

      update(node) {
        if (node.type.name !== 'image') return false
        this.node = node
        this._applyAttrs(node.attrs)
        // Toggle placeholder class: present when caption is empty
        const hasCaption = node.content.size > 0
        this.figcaption.classList.toggle('caption-placeholder', !hasCaption)
        // Sync toolbar inputs if this image is currently selected
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) {
          document.getElementById('img-tb-w').value   = node.attrs.width  ?? ''
          document.getElementById('img-tb-h').value   = node.attrs.height ?? ''
          document.getElementById('img-tb-alt').value = node.attrs.alt    ?? ''
        }
        return true
      }

      selectNode() {
        this.wrapper.classList.add('selected')
        _showImageToolbar(this)
      }

      deselectNode() {
        this.wrapper.classList.remove('selected')
        // Delay so toolbar inputs can receive focus before we check
        setTimeout(() => {
          const tb = document.getElementById('image-toolbar')
          if (tb && tb.contains(document.activeElement)) return
          if (tb?._activeNodeView === this) _hideImageToolbar()
        }, 80)
      }

      destroy() {
        const tb = document.getElementById('image-toolbar')
        if (tb?._activeNodeView === this) _hideImageToolbar()
      }

      stopEvent(e) {
        if (e.type !== 'mousedown') return false
        if (e.target.classList.contains('resize-handle')) return true
        // Non-leaf nodes with contentDOM: ProseMirror maps any click inside the
        // wrapper to a text cursor inside figcaption rather than a NodeSelection.
        // Intercept clicks on the image area (not the caption) and dispatch a
        // NodeSelection manually so selectNode() fires and the toolbar appears.
        if (!this.figcaption.contains(e.target)) {
          e.preventDefault()
          const pos = this.getPos()
          if (typeof pos === 'number') {
            this.editor.commands.setNodeSelection(pos)
          }
          return true
        }
        return false
      }

      ignoreMutation(mutation) {
        // Allow ProseMirror to track text changes inside the figcaption (contentDOM)
        if (this.figcaption.contains(mutation.target)) return false
        return true
      }

      _onHandleMousedown(e, handlePos) {
        e.preventDefault()
        e.stopPropagation()

        const startX   = e.clientX
        const startY   = e.clientY
        const startW   = this.img.offsetWidth  || 300
        const startH   = this.img.offsetHeight || 200
        const ratio    = startW / startH
        const isCorner = ['nw','ne','sw','se'].includes(handlePos)
        const wSign    = handlePos.includes('e') ? 1 : handlePos.includes('w') ? -1 : 0
        const hSign    = handlePos.includes('s') ? 1 : handlePos.includes('n') ? -1 : 0

        const onMove = me => {
          const dx = (me.clientX - startX) * wSign
          const dy = (me.clientY - startY) * hSign
          let newW = startW
          let newH = startH

          if (isCorner && !me.shiftKey) {
            newW = Math.max(50, startW + dx)
            newH = newW / ratio
          } else {
            if (wSign !== 0) newW = Math.max(50, startW + dx)
            if (hSign !== 0) newH = Math.max(50, startH + dy)
          }

          newW = Math.round(newW)
          newH = Math.round(newH)

          this.img.style.width  = newW + 'px'
          this.img.style.height = newH + 'px'
          this.frame.style.width = newW + 'px'

          const wIn = document.getElementById('img-tb-w')
          const hIn = document.getElementById('img-tb-h')
          if (wIn) wIn.value = newW
          if (hIn) hIn.value = newH
        }

        const onUp = () => {
          document.removeEventListener('mousemove', onMove)
          document.removeEventListener('mouseup', onUp)

          const newW = Math.round(parseFloat(this.img.style.width)  || this.img.offsetWidth)
          const newH = Math.round(parseFloat(this.img.style.height) || this.img.offsetHeight)
          this.img.style.width  = ''
          this.img.style.height = ''

          const pos = this.getPos()
          if (typeof pos === 'number') {
            const { state, dispatch } = this.editor.view
            dispatch(state.tr.setNodeMarkup(pos, null, { ...this.node.attrs, width: newW, height: newH }))
          }
        }

        document.addEventListener('mousemove', onMove)
        document.addEventListener('mouseup', onUp)
      }
    }

    // ── Image toolbar helpers ──────────────────────────
    function _positionImageToolbar(tb, wrapper) {
      const wRect = wrapper.getBoundingClientRect()
      tb.style.left = wRect.left + 'px'
      tb.style.top  = (wRect.bottom + 6) + 'px'
    }

    function _showImageToolbar(nv) {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      tb._activeNodeView = nv
      function fillDims() {
        let w = nv.node.attrs.width
        let h = nv.node.attrs.height
        if (w == null && nv.img.naturalWidth)  w = nv.img.naturalWidth
        if (h == null && nv.img.naturalHeight) h = nv.img.naturalHeight
        document.getElementById('img-tb-w').value = w ?? ''
        document.getElementById('img-tb-h').value = h ?? ''
      }
      fillDims()
      if (nv.node.attrs.width == null && !nv.img.naturalWidth) {
        nv.img.addEventListener('load', function onLoad() {
          nv.img.removeEventListener('load', onLoad)
          if (tb._activeNodeView === nv) fillDims()
        })
      }
      document.getElementById('img-tb-alt').value = nv.node.attrs.alt    ?? ''
      _updateNamedSizeButtons(null)

      _positionImageToolbar(tb, nv.wrapper)
      tb.style.display = 'flex'

      // Reposition on scroll so the toolbar tracks the image
      tb._scrollHandler = () => _positionImageToolbar(tb, nv.wrapper)
      document.getElementById('editor-wrap').addEventListener('scroll', tb._scrollHandler)

      if (nv.node.attrs.mediaId != null) {
        window.webkit?.messageHandlers?.requestMediaSizes
          ?.postMessage({ mediaId: nv.node.attrs.mediaId })
      }
    }

    function _hideImageToolbar() {
      const tb = document.getElementById('image-toolbar')
      if (!tb) return
      if (tb._scrollHandler) {
        document.getElementById('editor-wrap').removeEventListener('scroll', tb._scrollHandler)
        tb._scrollHandler = null
      }
      tb.style.display = 'none'
      tb._activeNodeView = null
      const altIn = document.getElementById('img-tb-alt')
      if (altIn) altIn.value = ''
    }

    function _updateNamedSizeButtons(sizes) {
      document.querySelectorAll('#image-toolbar [data-size]').forEach(btn => {
        if (!sizes || !sizes[btn.dataset.size]) {
          btn.style.display = 'none'
          btn._sizeData = null
        } else {
          btn.style.display = ''
          btn.disabled = false
          btn._sizeData = sizes[btn.dataset.size]
        }
      })
    }

    // ── ResizableImage extension ──────────────────────
    const ResizableImage = TiptapImage.extend({
      addAttributes() {
        return {
          ...this.parent?.(),
          width: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('width')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.width != null ? { width: attrs.width } : {},
          },
          height: {
            default: null,
            parseHTML: el => {
              const v = el.getAttribute('height')
              return v ? parseInt(v, 10) : null
            },
            renderHTML: attrs => attrs.height != null ? { height: attrs.height } : {},
          },
          mediaId: {
            default: null,
            parseHTML: el => {
              const dataId = el.getAttribute('data-media-id')
              if (dataId) return parseInt(dataId, 10)
              const m = (el.getAttribute('class') || '').match(/wp-image-(\d+)/)
              return m ? parseInt(m[1], 10) : null
            },
            renderHTML: attrs => attrs.mediaId != null ? { 'data-media-id': attrs.mediaId } : {},
          },
          alignment: {
            default: null,
            parseHTML: el => extractAlignment(el.getAttribute('class') || ''),
            renderHTML: attrs => attrs.alignment ? { class: `align${attrs.alignment}` } : {},
          },
        }
      },
      content: 'inline*',

      renderHTML({ HTMLAttributes }) {
        return ['figure', {}, ['img', HTMLAttributes], ['figcaption', 0]]
      },

      parseHTML() {
        return [
          {
            tag: 'figure.wp-block-image',
            getAttrs: el => {
              const img = el.querySelector('img')
              if (!img) return false
              const dataId = img.getAttribute('data-media-id')
              const clsMatch = (img.getAttribute('class') || '').match(/wp-image-(\d+)/)
              return {
                src:       img.getAttribute('src'),
                alt:       img.getAttribute('alt') ?? null,
                title:     img.getAttribute('title') ?? null,
                width:     parseInt(img.getAttribute('width'), 10) || null,
                height:    parseInt(img.getAttribute('height'), 10) || null,
                mediaId:   dataId ? parseInt(dataId, 10)
                                  : (clsMatch ? parseInt(clsMatch[1], 10) : null),
                alignment: extractAlignment(el.getAttribute('class') || ''),
              }
            },
            contentElement: el => el.querySelector('figcaption') || el.appendChild(document.createElement('figcaption')),
          },
          { tag: 'img[src]' },
        ]
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new ImageNodeView(node, editor, getPos)
      },
    })

    // ── Cite node ─────────────────────────────────────────
    // Optional last child of blockquote. Maps to <cite> in WordPress/Gutenberg.
    // No 'group' — cannot be inserted anywhere block is accepted; only blockquote
    // schema allows it via 'block+ cite?'.
    const Cite = TiptapNode.create({
      name: 'cite',
      content: 'inline*',
      parseHTML() {
        return [{ tag: 'cite' }]
      },
      renderHTML({ HTMLAttributes }) {
        return ['cite', HTMLAttributes, 0]
      },
      addKeyboardShortcuts() {
        return {
          Enter: () => {
            const { state } = this.editor
            const { $from } = state.selection
            if ($from.node($from.depth).type.name !== 'cite') return false
            // Find blockquote ancestor depth
            let bqDepth = -1
            for (let d = $from.depth; d >= 0; d--) {
              if ($from.node(d).type.name === 'blockquote') { bqDepth = d; break }
            }
            if (bqDepth === -1) return false
            // Insert a paragraph immediately after the blockquote
            const after = $from.after(bqDepth)
            const para = state.schema.nodes.paragraph.create()
            const tr = state.tr.insert(after, para)
            const resolved = tr.doc.resolve(after + 1)
            tr.setSelection(state.selection.constructor.near(resolved))
            this.editor.view.dispatch(tr)
            return true
          },
          Backspace: () => {
            const { state } = this.editor
            const { $from, empty } = state.selection
            if (!empty) return false
            const node = $from.node($from.depth)
            if (node.type.name !== 'cite' || node.content.size > 0) return false
            return this.editor.commands.deleteNode('cite')
          },
        }
      },
    })

    // ── Embed block ───────────────────────────────────
    // Atomic block storing the embed URL. Saved HTML is the Gutenberg embed
    // figure; in the editor it renders as a static placeholder card (no
    // third-party network requests).
    class EmbedNodeView {
      constructor(node) {
        this.dom = document.createElement('div')
        this.dom.className = 'embed-card'
        const p = detectEmbedProvider(node.attrs.url)
        const provider = document.createElement('div')
        provider.className = 'embed-card-provider'
        provider.textContent = p
          ? p.slug.charAt(0).toUpperCase() + p.slug.slice(1) + ' embed'
          : 'Embed'
        const url = document.createElement('div')
        url.className = 'embed-card-url'
        url.textContent = node.attrs.url
        const hint = document.createElement('div')
        hint.className = 'embed-card-hint'
        hint.textContent = 'Renders on your published site'
        this.dom.append(provider, url, hint)
      }
      selectNode()   { this.dom.classList.add('selected') }
      deselectNode() { this.dom.classList.remove('selected') }
    }

    const EmbedBlock = TiptapNode.create({
      name: 'embedBlock',
      group: 'block',
      atom: true,
      draggable: true,
      priority: 110,

      addAttributes() {
        return {
          url:     { default: '' },
          caption: { default: null },
        }
      },

      parseHTML() {
        return [{
          tag: 'figure.wp-block-embed',
          getAttrs: el => {
            const wrapper = el.querySelector('.wp-block-embed__wrapper')
            const url = wrapper ? wrapper.textContent.trim() : ''
            if (!url) return false
            const fc = el.querySelector('figcaption')
            return { url, caption: fc ? fc.outerHTML : null }
          },
        }]
      },

      renderHTML({ node }) {
        const figure = document.createElement('figure')
        figure.className = embedClassFor(node.attrs.url)
        const wrapper = document.createElement('div')
        wrapper.className = 'wp-block-embed__wrapper'
        wrapper.appendChild(document.createTextNode('\n' + node.attrs.url + '\n'))
        figure.appendChild(wrapper)
        if (node.attrs.caption) figure.insertAdjacentHTML('beforeend', node.attrs.caption)
        return figure
      },

      addNodeView() {
        return ({ node }) => new EmbedNodeView(node)
      },
    })

    // ── Footnotes ─────────────────────────────────────
    // Self-contained HTML footnotes: markers are inline atoms
    // <sup data-fn class="fn"><a href="#id"></a></sup>; the list is a literal
    // <ol class="wp-block-footnotes"> pinned at the document end. Marker
    // numbers are rendered by CSS counters in the editor and written as real
    // text by toWordPressHTML on save.
    const FootnoteMarker = TiptapNode.create({
      name: 'footnoteMarker',
      group: 'inline',
      inline: true,
      atom: true,
      priority: 110,
      addAttributes() {
        return { fnId: { default: null } }
      },
      parseHTML() {
        return [{
          tag: 'sup.fn[data-fn]',
          getAttrs: el => ({ fnId: el.getAttribute('data-fn') }),
        }]
      },
      renderHTML({ node }) {
        return ['sup', { 'data-fn': node.attrs.fnId, class: 'fn' },
          ['a', { href: '#' + node.attrs.fnId }]]
      },
    })

    const FootnotesList = TiptapNode.create({
      name: 'footnotesList',
      group: 'block',
      content: 'footnoteItem+',
      defining: true,
      isolating: true,
      priority: 110,  // must out-rank OrderedList's generic 'ol' parse rule
      parseHTML() {
        return [{ tag: 'ol.wp-block-footnotes' }]
      },
      renderHTML() {
        return ['ol', { class: 'wp-block-footnotes' }, 0]
      },
    })

    const FootnoteItem = TiptapNode.create({
      name: 'footnoteItem',
      content: 'inline*',
      defining: true,
      priority: 110,  // must out-rank ListItem's generic 'li' rule for these lis
      addAttributes() {
        return { fnId: { default: null } }
      },
      parseHTML() {
        return [{
          tag: 'ol.wp-block-footnotes > li',
          getAttrs: el => {
            el.querySelectorAll('.footnote-backref').forEach(a => a.remove())
            return { fnId: el.getAttribute('id') }
          },
        }]
      },
      renderHTML({ node }) {
        return ['li', { id: node.attrs.fnId }, 0]
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new FootnoteItemNodeView(node, editor, getPos)
      },
    })

    class FootnoteItemNodeView {
      constructor(node, editor, getPos) {
        this.node = node
        this.editor = editor

        this.dom = document.createElement('li')
        this.dom.id = node.attrs.fnId || ''

        this.contentDOM = document.createElement('span')
        this.contentDOM.className = 'fn-item-content'

        this.backArrow = document.createElement('a')
        this.backArrow.className = 'fn-backref'
        this.backArrow.textContent = '↩'
        this.backArrow.setAttribute('aria-label', 'Back to content')
        this.backArrow.addEventListener('mousedown', e => {
          e.preventDefault()
          const fnId = this.node.attrs.fnId
          let markerPos = null
          let markerSize = 0
          this.editor.state.doc.descendants((n, pos) => {
            if (n.type.name === 'footnoteMarker' && n.attrs.fnId === fnId) {
              markerPos = pos
              markerSize = n.nodeSize
              return false
            }
            return true
          })
          if (markerPos !== null) {
            this.editor.chain().focus().setTextSelection(markerPos + markerSize).scrollIntoView().run()
          }
        })

        this.dom.appendChild(this.contentDOM)
        this.dom.appendChild(this.backArrow)
      }

      update(node) {
        if (node.type.name !== 'footnoteItem') return false
        this.node = node
        this.dom.id = node.attrs.fnId || ''
        return true
      }

      stopEvent(event) {
        return event.target === this.backArrow
      }

      ignoreMutation(mutation) {
        return mutation.target === this.backArrow ||
          this.backArrow.contains(mutation.target)
      }
    }

    // Keeps the footnotes list consistent with the markers after every doc
    // change: entries follow marker order, orphaned entries are removed,
    // missing entries are created (paste/undo edge cases), and the list
    // itself is removed when the last marker goes. appendTransaction runs
    // again on its own output; the second pass finds everything consistent
    // and returns null, so there is no loop.
    const FootnoteSync = Extension.create({
      name: 'footnoteSync',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: new PluginKey('footnoteSync'),
            appendTransaction(transactions, oldState, newState) {
              if (!transactions.some(tr => tr.docChanged)) return null

              const markerIds = []
              let listPos = null
              let listNode = null
              newState.doc.descendants((node, pos) => {
                if (node.type.name === 'footnotesList') {
                  listPos = pos
                  listNode = node
                  return false  // don't collect markers inside the list
                }
                if (node.type.name === 'footnoteMarker' && node.attrs.fnId) {
                  markerIds.push(node.attrs.fnId)
                }
                return true
              })

              if (listPos === null) {
                if (markerIds.length === 0) return null
                const items = markerIds.map(id =>
                  newState.schema.nodes.footnoteItem.create({ fnId: id }))
                return newState.tr.insert(
                  newState.doc.content.size,
                  newState.schema.nodes.footnotesList.create(null, items)
                )
              }

              const currentIds = []
              const itemsById = new Map()
              listNode.forEach(child => {
                currentIds.push(child.attrs.fnId)
                if (child.attrs.fnId) itemsById.set(child.attrs.fnId, child)
              })

              if (currentIds.length === markerIds.length &&
                  currentIds.every((id, i) => id === markerIds[i])) return null

              const tr = newState.tr
              if (markerIds.length === 0) {
                tr.delete(listPos, listPos + listNode.nodeSize)
              } else {
                const desired = markerIds.map(id =>
                  itemsById.get(id) || newState.schema.nodes.footnoteItem.create({ fnId: id }))
                tr.replaceWith(listPos + 1, listPos + listNode.nodeSize - 1, desired)
              }
              return tr
            },
          })
        ]
      },
    })

    // ── Spell check ───────────────────────────────────────
    const spellCheckKey = new PluginKey('spellCheck')

    const SpellCheck = Extension.create({
      name: 'spellCheck',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: spellCheckKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                const incoming = tr.getMeta(spellCheckKey)
                if (incoming !== undefined) return incoming
                if (!tr.docChanged) return set
                let next = set.map(tr.mapping, tr.doc)
                for (const step of tr.steps) {
                  step.getMap().forEach((oldStart, oldEnd, newStart, newEnd) => {
                    const overlapping = next.find(newStart, newEnd)
                    if (overlapping.length) next = next.remove(overlapping)
                  })
                }
                return next
              }
            },
            props: {
              decorations(state) { return spellCheckKey.getState(state) }
            }
          })
        ]
      }
    })

    // ── Find & replace highlight ─────────────────────
    const findKey = new PluginKey('findReplace')

    const FindHighlight = Extension.create({
      name: 'findHighlight',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: findKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                const incoming = tr.getMeta(findKey)
                if (incoming !== undefined) return incoming
                return tr.docChanged ? set.map(tr.mapping, tr.doc) : set
              }
            },
            props: {
              decorations(state) { return findKey.getState(state) }
            }
          })
        ]
      }
    })

    // Extended blockquote: allows an optional cite as its last child.
    const CustomBlockquote = withClassAttr(Blockquote.extend({
      content: 'block+ cite?',
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, () => _isInFootnote() ? true : fn()]))
      },
    }))

    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: [
        StarterKit.configure({
          blockquote: false,
          paragraph: false,
          heading: false,
          bulletList: false,
          orderedList: false,
          listItem: false,
          codeBlock: false,
        }),
        CodeBlock.extend({
          addKeyboardShortcuts() {
            const orig = this.parent?.()
            return Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
              [k, () => _isInFootnote() ? true : fn()]))
          },
        }),
        ParagraphWithClass,
        HeadingWithClass.configure({ levels: [1, 2, 3, 4, 5, 6] }),
        BulletListWithClass,
        OrderedListWithClass,
        ListItemWithClass,
        CustomBlockquote,
        Cite,
        Underline,
        Table.configure({ resizable: false }),
        TableRow,
        TableHeader,
        TableCell,
        ResizableImage.configure({ inline: false }),
        EmbedBlock,
        FootnoteMarker,
        FootnotesList,
        FootnoteItem,
        FootnoteSync,
        Link.configure({ openOnClick: false, HTMLAttributes: { target: null, rel: null } }),

        Placeholder.configure({ placeholder: 'Start writing…' }),
        SpellCheck,
        FindHighlight,
      ],
      content: '',
      editorProps: {
        transformPastedHTML(html) {
          if (!_isInFootnote()) return html
          const tmp = document.createElement('div')
          tmp.innerHTML = html
          const BLOCK_TAGS = new Set(['DIV','P','H1','H2','H3','H4','H5','H6',
            'BLOCKQUOTE','PRE','TABLE','THEAD','TBODY','TR','TD','TH',
            'UL','OL','LI','FIGURE','FIGCAPTION','HR','IMG'])
          function flatten(el) {
            let out = ''
            for (const ch of el.childNodes) {
              if (ch.nodeType === 3) { out += ch.textContent; continue }
              if (ch.nodeType !== 1) continue
              if (BLOCK_TAGS.has(ch.tagName)) {
                out += flatten(ch) + ' '
              } else {
                ch.innerHTML = flatten(ch)
                out += ch.outerHTML
              }
            }
            return out
          }
          return flatten(tmp).trim()
        },
      },
      onTransaction: () => updateToolbar(),
      onCreate: () => {
        document.execCommand('enableObjectResizing', false, 'false')
        updateToolbar()
        if (window.webkit?.messageHandlers?.editorReady) {
          window.webkit.messageHandlers.editorReady.postMessage('ready')
        }
      },
    })
    window._tiptapEditor = editor

    function setImageAlignment(value) {
      const { state } = editor
      const node = state.selection.node
      if (!node || node.type.name !== 'image') return
      const pos = state.selection.from
      const newAlignment = node.attrs.alignment === value ? null : value
      editor.view.dispatch(
        state.tr.setNodeMarkup(pos, null, { ...node.attrs, alignment: newAlignment })
      )
      editor.view.focus()
    }

    // ── Footnote context detection ────────────────────
    function _isInFootnote() {
      const $from = editor.state.selection.$from
      for (let d = $from.depth; d > 0; d--) {
        const name = $from.node(d).type.name
        if (name === 'footnoteItem' || name === 'footnotesList') return true
      }
      return false
    }

    const BLOCK_CMDS = ['blockquote','codeBlock','bulletList','orderedList',
                        'insertTable','image']

    // ── Toolbar commands ───────────────────────────────
    const COMMANDS = {
      bold:          () => editor.chain().focus().toggleBold().run(),
      italic:        () => editor.chain().focus().toggleItalic().run(),
      underline:     () => editor.chain().focus().toggleUnderline().run(),
      strike:        () => editor.chain().focus().toggleStrike().run(),
      code:          () => editor.chain().focus().toggleCode().run(),
      blockquote: () => {
        if (_isInFootnote()) return
        if (editor.isActive('blockquote')) {
          editor.chain().focus().toggleBlockquote().run()
          return
        }
        // Toggle on: wrap in blockquote then append an empty cite
        editor.chain()
          .focus()
          .toggleBlockquote()
          .command(({ tr, state }) => {
            const { $head } = state.selection
            for (let d = $head.depth; d >= 0; d--) {
              const node = $head.node(d)
              if (node.type.name === 'blockquote') {
                const end = $head.after(d) - 1
                tr.insert(end, state.schema.nodes.cite.create())
                return true
              }
            }
            return false
          })
          .run()
      },
      codeBlock:     () => { if (!_isInFootnote()) editor.chain().focus().toggleCodeBlock().run() },
      bulletList:    () => { if (!_isInFootnote()) editor.chain().focus().toggleBulletList().run() },
      orderedList:   () => { if (!_isInFootnote()) editor.chain().focus().toggleOrderedList().run() },
      insertTable:   () => { if (!_isInFootnote()) editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run() },
      addRowAfter:   () => editor.chain().focus().addRowAfter().run(),
      addColumnAfter:() => editor.chain().focus().addColumnAfter().run(),
      deleteRow:     () => editor.chain().focus().deleteRow().run(),
      deleteColumn:  () => editor.chain().focus().deleteColumn().run(),
      deleteTable:   () => editor.chain().focus().deleteTable().run(),
      undo:          () => editor.chain().focus().undo().run(),
      redo:          () => editor.chain().focus().redo().run(),
      link: () => {
        const href = editor.getAttributes('link').href || ''
        const sel  = window.getSelection()
        let rect

        if (sel && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0)
          if (!range.collapsed) {
            // Text is selected — anchor to the selection rect
            const r = range.getBoundingClientRect()
            rect = { x: r.x, y: r.y, width: r.width, height: r.height }
          } else if (href) {
            // Collapsed cursor on a link — sel.anchorNode is unreliable at node
            // boundaries in ProseMirror; use domAtPos() and try adjacent offsets
            // to find the <a> regardless of where in the link the cursor sits.
            const from = editor.state.selection.from
            let linkEl = null
            for (const delta of [0, 1, -1, 2, -2]) {
              try {
                const dn = editor.view.domAtPos(from + delta).node
                const el = dn.nodeType === Node.TEXT_NODE ? dn.parentElement : dn
                const a  = el && el.closest('a')
                if (a) { linkEl = a; break }
              } catch (_) {}
            }
            if (linkEl) {
              const lr = linkEl.getBoundingClientRect()
              rect = { x: lr.x, y: lr.y, width: lr.width, height: lr.height }
            }
          }
        }

        // Fallback: toolbar button
        if (!rect) {
          const btn = document.querySelector('[data-cmd="link"]').getBoundingClientRect()
          rect = { x: btn.x, y: btn.y, width: btn.width, height: btn.height }
        }

        if (window.webkit?.messageHandlers?.showLinkPicker) {
          window.webkit.messageHandlers.showLinkPicker.postMessage({ href, rect })
        }
      },
      image: () => {
        if (_isInFootnote()) return
        if (window.webkit?.messageHandlers?.insertImage) {
          window.webkit.messageHandlers.insertImage.postMessage({})
        }
      },
      alignLeft:   () => setImageAlignment('left'),
      alignCenter: () => setImageAlignment('center'),
      alignRight:  () => setImageAlignment('right'),
    }

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', e => {
        e.preventDefault()  // prevent focus loss before command runs
        COMMANDS[btn.dataset.cmd]?.()
      })
    })

    function initToolbarTooltips() {
      const tip = document.createElement('div')
      tip.id = 'toolbar-tooltip'
      document.body.appendChild(tip)
      let showTimer = null
      let activeEl = null

      function positionTip(el) {
        const rect = el.getBoundingClientRect()
        const tipRect = tip.getBoundingClientRect()
        const margin = 8
        const belowTop = rect.bottom + margin
        const aboveTop = rect.top - tipRect.height - margin
        const showAbove = belowTop + tipRect.height > window.innerHeight && aboveTop > margin
        const top = showAbove ? aboveTop : belowTop
        const half = tipRect.width / 2
        const idealLeft = rect.left + rect.width / 2
        const left = Math.min(
          Math.max(idealLeft, half + margin),
          window.innerWidth - half - margin
        )
        // Arrow points at the button center regardless of how far the tooltip was clamped
        const arrowPx = idealLeft - (left - half)
        tip.style.setProperty('--arrow-offset', `${arrowPx}px`)
        tip.style.left = `${left}px`
        tip.style.top = `${top}px`
        tip.classList.toggle('above', showAbove)
        tip.classList.toggle('below', !showAbove)
      }

      function show(el) {
        if (el.disabled) return
        const text = el.dataset.tooltip
        if (!text) return
        activeEl = el
        clearTimeout(showTimer)
        showTimer = setTimeout(() => {
          if (activeEl !== el) return
          tip.textContent = text
          tip.classList.remove('visible')
          tip.style.left = '-9999px'
          tip.style.top = '-9999px'
          requestAnimationFrame(() => {
            positionTip(el)
            tip.classList.add('visible')
          })
        }, 220)
      }

      function hide(el) {
        if (el && activeEl !== el) return
        activeEl = null
        clearTimeout(showTimer)
        tip.classList.remove('visible')
      }

      document.querySelectorAll('#toolbar button[title]').forEach(el => {
        el.dataset.tooltip = el.getAttribute('title')
        el.setAttribute('aria-label', el.dataset.tooltip)
        el.removeAttribute('title')
        el.addEventListener('mouseenter', () => show(el))
        el.addEventListener('mouseleave', () => hide(el))
        el.addEventListener('focus', () => show(el))
        el.addEventListener('blur', () => hide(el))
        el.addEventListener('mousedown', () => hide(el))
      })
      document.getElementById('editor-wrap').addEventListener('scroll', () => hide(activeEl))
      window.addEventListener('resize', () => hide(activeEl))
    }

    initToolbarTooltips()

    const headingButton = document.getElementById('heading-button')
    const headingCurrent = document.getElementById('heading-current')
    const headingMenu = document.getElementById('heading-menu')

    function positionHeadingMenu() {
      const rect = headingButton.getBoundingClientRect()
      const margin = 8
      headingMenu.style.left = `${Math.max(rect.left, margin)}px`
      headingMenu.style.top = `${rect.bottom + margin}px`
    }

    function closeHeadingMenu() {
      headingMenu.classList.remove('visible')
      headingButton.setAttribute('aria-expanded', 'false')
    }

    function openHeadingMenu() {
      positionHeadingMenu()
      headingMenu.classList.add('visible')
      headingButton.setAttribute('aria-expanded', 'true')
    }

    function setHeadingLevel(level) {
      if (_isInFootnote()) { closeHeadingMenu(); return }
      if (level === 0) editor.chain().focus().setParagraph().run()
      else editor.chain().focus().setHeading({ level }).run()
      closeHeadingMenu()
    }

    headingButton.addEventListener('click', e => {
      e.preventDefault()
      if (headingMenu.classList.contains('visible')) closeHeadingMenu()
      else openHeadingMenu()
    })

    headingMenu.querySelectorAll('[data-heading-level]').forEach(item => {
      item.addEventListener('mousedown', e => e.preventDefault())
      item.addEventListener('click', () => setHeadingLevel(parseInt(item.dataset.headingLevel)))
    })

    document.addEventListener('mousedown', e => {
      if (!headingMenu.contains(e.target) && !headingButton.contains(e.target)) closeHeadingMenu()
    })
    window.addEventListener('resize', closeHeadingMenu)
    document.getElementById('editor-wrap').addEventListener('scroll', closeHeadingMenu)

      try { parsed = new URL(raw) } catch (_) { return }
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return
      editor.chain().focus().insertContent({ type: 'embedBlock', attrs: { url: raw } }).run()
      _closeEmbedMenu()

    function updateToolbar() {
      const inFootnote = _isInFootnote()
      TOGGLE_CMDS.forEach(cmd => {
        const btn = document.querySelector(`[data-cmd="${cmd}"]`)
        if (btn) btn.classList.toggle('active', editor.isActive(cmd))
      })
      BLOCK_CMDS.forEach(cmd => {
        const btn = document.querySelector(`[data-cmd="${cmd}"]`)
        if (btn) btn.disabled = inFootnote
      })
      // Heading menu

        if (editor.isActive('heading', { level: i })) { headingLevel = String(i); break }
      }
      headingCurrent.textContent = headingLevel === '0' ? 'P' : `H${headingLevel}`
      headingButton.classList.toggle('heading-active', headingLevel !== '0')
      headingMenu.querySelectorAll('[data-heading-level]').forEach(item => {

      document.getElementById('btn-footnote').disabled = inFootnote

      const selNode = editor.state.selection.node
      const selectedImage = selNode?.type.name === 'image' ? selNode : null
      const alignControls = document.getElementById('image-align-controls')

    let debounce
    function _postStats() {

    editor.on('update', () => {

      if (_findOpen) _refreshFind(false)
      clearTimeout(debounce)
      debounce = setTimeout(() => {

        }

    // ── Swift → JS bridge (globals) ───────────────────
    window.applySpellErrors = function(words) {
      function escapeRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      }
      const { state, dispatch } = editor.view
      const decos = []
      if (Array.isArray(words) && words.length > 0) {
        // One alternation regex for all words, instead of words × text-nodes RegExp allocs
        const re = new RegExp('\\b(?:' + words.map(escapeRegex).join('|') + ')\\b', 'gi')
        state.doc.descendants((node, pos) => {
          if (!node.isText) return
          const text = node.text
          re.lastIndex = 0
          let match
          while ((match = re.exec(text)) !== null) {
            decos.push(
              Decoration.inline(
                pos + match.index,
                pos + match.index + match[0].length,
                { class: 'spell-error' }
              )
            )
          }
        })
      }
      const decoSet = DecorationSet.create(state.doc, decos)
      dispatch(state.tr.setMeta(spellCheckKey, decoSet))
    }

    // Returns { word, from, to } if the click landed on a spell-error span,
    // null otherwise. Uses the existing DOM decoration rather than re-scanning.
    window.spellContextAtPoint = function(x, y) {
      let el = document.elementFromPoint(x, y)
      while (el && !el.classList.contains('spell-error')) {
        if (!el.parentElement || el === document.body) { el = null; break }
        el = el.parentElement
      }
      if (!el) return null
      const word = el.textContent
      if (!word) return null
      try {
        const from = editor.view.posAtDOM(el, 0)
        const to = editor.view.posAtDOM(el, el.childNodes.length)
        return { word, from, to }
      } catch (_) { return null }
    }

    window.replaceSpellError = function(from, to, replacement) {
      if (typeof from !== 'number' || typeof to !== 'number' || typeof replacement !== 'string') return
      editor.view.dispatch(editor.state.tr.insertText(replacement, from, to))
      editor.view.focus()
    }

    // ── Find & replace ────────────────────────────────
    let _findOpen = false
    let _findActiveIndex = 0
    let _findMatchPositions = []   // [{ from, to }] in doc positions

    function _collectFindMatches() {
      const query = document.getElementById('find-input').value
      const caseSensitive = document.getElementById('find-case').classList.contains('active')
      const result = []
      if (!query) return result
      editor.state.doc.descendants((node, pos) => {
        if (!node.isTextblock) return true
        let text = ''
        const positions = []
        node.descendants((child, childPos) => {
          if (child.isText) {
            for (let i = 0; i < child.text.length; i++) {
              positions.push(pos + 1 + childPos + i)
              text += child.text[i]
            }
          }
        })
        for (const m of findMatches(text, query, caseSensitive)) {
          result.push({ from: positions[m.start], to: positions[m.end - 1] + 1 })
        }
        return false
      })
      return result
    }

    function _renderFindDecorations() {
      const decos = _findMatchPositions.map((m, i) =>
        Decoration.inline(m.from, m.to, {
          class: i === _findActiveIndex ? 'find-match find-match-active' : 'find-match'
        })
      )
      const { state, dispatch } = editor.view
      dispatch(state.tr.setMeta(findKey, DecorationSet.create(state.doc, decos)))
      document.getElementById('find-count').textContent = _findMatchPositions.length
        ? `${_findActiveIndex + 1} of ${_findMatchPositions.length}`
        : '0 of 0'
    }

    function _scrollToActiveMatch() {
      const m = _findMatchPositions[_findActiveIndex]
      if (!m) return
      try {
        const dom = editor.view.domAtPos(m.from).node
        const el = dom.nodeType === Node.TEXT_NODE ? dom.parentElement : dom
        el?.scrollIntoView({ block: 'center' })
      } catch (_) {}
    }

    function _refreshFind(resetIndex) {
      _findMatchPositions = _collectFindMatches()
      if (resetIndex || _findActiveIndex >= _findMatchPositions.length) _findActiveIndex = 0
      _renderFindDecorations()
    }

    function _stepFind(delta) {
      if (!_findMatchPositions.length) return
      _findActiveIndex = (_findActiveIndex + delta + _findMatchPositions.length) % _findMatchPositions.length
      _renderFindDecorations()
      _scrollToActiveMatch()
    }

    function _openFindBar() {
      if (codeViewActive) return
      _findOpen = true
      document.getElementById('find-bar').classList.add('visible')
      const input = document.getElementById('find-input')
      const sel = window.getSelection()
      if (sel && !sel.isCollapsed) input.value = sel.toString()
      input.focus()
      input.select()
      _refreshFind(true)
      if (_findMatchPositions.length) _scrollToActiveMatch()
    }

    function _closeFindBar() {
      if (!_findOpen) return
      _findOpen = false
      document.getElementById('find-bar').classList.remove('visible')
      _findMatchPositions = []
      const { state, dispatch } = editor.view
      dispatch(state.tr.setMeta(findKey, DecorationSet.empty))
      editor.commands.focus()
    }

    function _replaceActive() {
      const m = _findMatchPositions[_findActiveIndex]
      if (!m) return
      const replacement = document.getElementById('replace-input').value
      editor.view.dispatch(editor.state.tr.insertText(replacement, m.from, m.to))
      _refreshFind(false)
      _scrollToActiveMatch()
    }

    function _replaceAll() {
      if (!_findMatchPositions.length) return
      const replacement = document.getElementById('replace-input').value
      const tr = editor.state.tr
      for (const m of [..._findMatchPositions].reverse()) {
        tr.insertText(replacement, m.from, m.to)
      }
      editor.view.dispatch(tr)
      _refreshFind(true)
    }

    document.getElementById('find-input').addEventListener('input', () => _refreshFind(true))
    document.getElementById('find-next').addEventListener('click', () => _stepFind(1))
    document.getElementById('find-prev').addEventListener('click', () => _stepFind(-1))
    document.getElementById('find-case').addEventListener('click', e => {
      e.currentTarget.classList.toggle('active')
      _refreshFind(true)
    })
    document.getElementById('replace-one').addEventListener('click', _replaceActive)
    document.getElementById('replace-all').addEventListener('click', _replaceAll)
    document.getElementById('find-close').addEventListener('click', _closeFindBar)
    document.getElementById('find-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); _stepFind(e.shiftKey ? -1 : 1) }
    })
    document.addEventListener('keydown', e => {
      if (e.metaKey && !e.shiftKey && !e.altKey && e.key === 'f') {
        e.preventDefault()

        e.preventDefault()
        _closeFindBar()
      }
    })

    // ── Footnotes: insert + jump ──────────────────────
    function _findFootnoteItemPos(fnId) {
      let itemPos = null
      editor.state.doc.descendants((node, pos) => {
        if (node.type.name === 'footnoteItem' && node.attrs.fnId === fnId) {
          itemPos = pos
          return false
        }
        return true
      })
      return itemPos
    }

    function insertFootnote() {
      if (codeViewActive) return
      const { state } = editor
      // No footnotes-from-within-footnotes: bail if the cursor is in the list
      const $from = state.selection.$from
      for (let d = $from.depth; d > 0; d--) {
        if ($from.node(d).type.name === 'footnotesList') return
      }
      const fnId = 'fn-' + crypto.randomUUID()
      const schema = state.schema
      const tr = state.tr
      tr.insert(state.selection.from, schema.nodes.footnoteMarker.create({ fnId }))

      // Append the entry to the footnotes list, creating it at the doc end if
      // missing.
      let listPos = null
      let listNode = null
      tr.doc.descendants((node, pos) => {
        if (node.type.name === 'footnotesList') { listPos = pos; listNode = node; return false }
        return true
      })
      const item = schema.nodes.footnoteItem.create({ fnId })
      if (listPos === null) {
        tr.insert(tr.doc.content.size, schema.nodes.footnotesList.create(null, [item]))
      } else {
        tr.insert(listPos + listNode.nodeSize - 1, item)
      }
      editor.view.dispatch(tr)

      // Put the cursor inside the new entry so the user can type immediately
      const itemPos = _findFootnoteItemPos(fnId)
      if (itemPos !== null) {
        editor.chain().focus().setTextSelection(itemPos + 1).scrollIntoView().run()
      }
    }
    window.insertFootnote = insertFootnote

    // Clicking a marker jumps to (and focuses) its entry
    document.getElementById('editor').addEventListener('click', e => {
      const sup = e.target.closest('sup.fn[data-fn]')
      if (!sup) return
      e.preventDefault()   // stop the <a href="#id"> from triggering a fragment navigation
      const itemPos = _findFootnoteItemPos(sup.getAttribute('data-fn'))
      if (itemPos !== null) {
        editor.chain().focus().setTextSelection(itemPos + 1).scrollIntoView().run()
      }
    })

    document.getElementById('btn-footnote').addEventListener('mousedown', e => {
      e.preventDefault()
      insertFootnote()
    })

    // ── Code view ─────────────────────────────────────
    let codeViewActive = false
    // Authoritative HTML that bypasses Tiptap's schema parser. Set when content
    // is loaded from WordPress or when the user edits in code view. Cleared on any
    // visual edit (onUpdate) so Tiptap becomes the source of truth again.
    let _rawHTML = null
    // Last raw HTML set via setContent() or saved from code view. Unlike _rawHTML,
    // this is never cleared by visual edits — so code view always shows the full
    // WordPress HTML (including block comments) even after the user has typed in
    // the visual editor.
    let _rawHTMLOnLoad = null
    // Textarea value when code view was opened. Used to detect whether the user
    // actually edited anything — if unchanged on exit, we skip setContent so
    // Tiptap's visual state is preserved unchanged.
    let _codeViewOriginal = null

    function _codeViewChanged() {
      clearTimeout(debounce)
      debounce = setTimeout(() => {
        const html = document.getElementById('code-editor').value
        if (window.webkit?.messageHandlers?.contentChanged) {
          window.webkit.messageHandlers.contentChanged.postMessage(html)
        }
      }, 500)
    }

    function _enterCodeView() {
      if (codeViewActive) return
      _closeFindBar()
      _hideImageToolbar()
      _closeEmbedMenu()
      codeViewActive = true
      // _rawHTML is cleared (set to null) on every Tiptap update event, so null means
      // the user has made visual edits since the last load/code-view save.
      // Always run the source through formatHTML for a readable, indented display.
      // _rawHTMLOnLoad is never updated unless the user edits in code view, so
      // formatHTML(_rawHTMLOnLoad) is idempotent across repeated enter/exit cycles.
      const hasVisualEdits = _rawHTML === null
      const sourceHTML = (!hasVisualEdits && _rawHTMLOnLoad !== null)
        ? _rawHTMLOnLoad
        : toWordPressHTML(editor.getHTML())
      const codeViewHTML = formatHTML(sourceHTML)
      _codeViewOriginal = codeViewHTML
      document.getElementById('code-editor').value = codeViewHTML
      document.getElementById('editor').style.display = 'none'
      document.getElementById('code-editor').style.display = 'block'
      document.getElementById('btn-code-view').classList.add('active')
      document.getElementById('toolbar').querySelectorAll('button:not(#btn-code-view), select').forEach(el => { el.disabled = true })
      const ta = document.getElementById('code-editor')
      ta.addEventListener('input', _codeViewChanged)
      ta.selectionStart = ta.selectionEnd = 0
      ta.scrollTop = 0
      ta.focus()
    }

    function _exitCodeView() {
      if (!codeViewActive) return
      codeViewActive = false
      const html = document.getElementById('code-editor').value
      document.getElementById('code-editor').removeEventListener('input', _codeViewChanged)
      clearTimeout(debounce)
      const userEdited = html !== _codeViewOriginal
      _codeViewOriginal = null
      if (userEdited) {
        // User changed the HTML — parse it back into Tiptap and update raw stores.
        _rawHTML = html
        _rawHTMLOnLoad = html
        editor.commands.setContent(html, false)
      }
      document.getElementById('editor').style.display = ''
      document.getElementById('code-editor').style.display = 'none'
      document.getElementById('btn-code-view').classList.remove('active')
      document.getElementById('toolbar').querySelectorAll('button, select').forEach(el => { el.disabled = false })
      editor.commands.focus()
      // Always fire contentChanged so Swift's htmlContent stays current.
      // If not edited, getContent() returns the pre-code-view value unchanged.
      if (window.webkit?.messageHandlers?.contentChanged) {
        window.webkit.messageHandlers.contentChanged.postMessage(
          userEdited ? html : window.getContent()
        )
      }
      _postStats()
    }

    document.getElementById('btn-code-view').addEventListener('click', () => {
      codeViewActive ? _exitCodeView() : _enterCodeView()
    })

    // AI toolbar buttons
    window.setAIEnabled = enabled => {

    window.setEvaluating = active => {

    document.getElementById('btn-evaluate').addEventListener('mousedown', e => {

      window.webkit.messageHandlers.triggerEvaluate.postMessage({})

        codeViewActive = false
        document.getElementById('editor').style.display = ''
        document.getElementById('code-editor').style.display = 'none'
        document.getElementById('btn-code-view').classList.remove('active')
        document.getElementById('toolbar').querySelectorAll('button, select').forEach(el => { el.disabled = false })
      }
      _closeFindBar()
      _rawHTML = html || null
      _rawHTMLOnLoad = html || null

    }
    window.openFindBar = _openFindBar
    window.getContent = () => codeViewActive

    window.syncContentToSwift = () => {
