          return { ...this.parent?.(), ...generated }
        },
        renderHTML(props) {
          const out = this.parent?.(props)
          const settings = settingsFor(props.node.type.name)
          for (const [name, def] of Object.entries(settings)) {
            const value = props.node.attrs[name]
            if (def.kind === 'carried' || !settingIsSet(def, value)) continue
            if (out && out.nodeType === 1) applySettingToElement(out, def, value)
            else if (Array.isArray(out)) applySettingToSpec(out, def, value)
          }
          return out
        },
      })
    }

    const GutenbergPassthrough = TiptapNode.create({
      name: 'gutenbergPassthrough',
      group: 'block',
      atom: true,
      draggable: true,
      // Must out-rank every core node (100) and the footnote nodes (110) so an
      // unmodeled block sitting on a shared tag (<ul>, <pre>, <blockquote>, …)
      // isn't claimed by the generic rule and shredded. Stays below Paragraph
      // (1000) so paragraph remains the schema's first block node, which is
      // what ProseMirror fills empty `block+` content with. Blocks Quill does
      // model opt out via QUILL_MODELED_BLOCK_CLASSES in editor-transforms.js.
      priority: 200,

      addAttributes() {
        return {
          blockLabel: { default: '' },
          blockName:  { default: null },
          attrsJSON:  { default: null },
          sourceHTML: { default: '' },
          unsupportedSource: { default: null },
        }
      },

      parseHTML() {
        return [
          {
            // First, so it out-ranks the class catch-all below. blockName stays
            // null: this block's own comments are already inside its source, so
            // regenerating them would double them.
            tag: 'div.wp-block-quill-unsupported',
            getAttrs: el => ({
              blockLabel: el.getAttribute('data-quill-unsupported-label') || 'Block',
              blockName: null,
              attrsJSON: null,
              sourceHTML: el.outerHTML,
              unsupportedSource: el.getAttribute('data-quill-unsupported-source'),
            }),
          },
          {
            tag: '[class*="wp-block-"]:not(figure)',
            getAttrs: el => parsePassthroughBlock(el) || false,
          },
          {
            // Figures too. Only image/gallery/embed/table have figure rules of
            // their own (QUILL_MODELED_FIGURE_CLASSES); every other wp-block-*
            // figure — audio, video, pullquote, playlist — has none, and the
            // generic parser destroys it rather than leaving it alone.
            tag: 'figure[class*="wp-block-"]',
            getAttrs: el => isModeledFigure(el) ? false : (parsePassthroughBlock(el) || false),
          },
        ]
      },

      renderHTML({ node }) {
        const wrapper = document.createElement('div')
        wrapper.innerHTML = node.attrs.sourceHTML
        const el = wrapper.firstElementChild
        if (!el) return ['div', {}]
        // Unconditional marker (independent of blockName) so toWordPressHTML can
        // find and shield this element's nested content from its comment-strip
        // pass, whether or not this element itself had its own wp:name comments.
        el.setAttribute('data-quill-passthrough', '')
        if (node.attrs.blockName) {
          el.setAttribute('data-quill-passthrough-name', node.attrs.blockName)
          if (node.attrs.attrsJSON) {
            el.setAttribute('data-quill-passthrough-attrs', node.attrs.attrsJSON)
          }
        }
        return el
      },

      addNodeView() {
        return ({ node }) => new PassthroughNodeView(node)
      },
    })

    // ── Footnotes ─────────────────────────────────────
    // Self-contained HTML footnotes: markers are inline atoms
    // <sup data-fn class="fn"><a href="#id"></a></sup>; the list is a literal
    // <ol class="wp-block-footnotes"> pinned at the document end. Marker
    // numbers are rendered by CSS counters in the editor and written as real
    // text by toWordPressHTML on save.
    const FootnoteMarker = TiptapNode.create({
      name: 'footnoteMarker',
      group: 'inline',
      inline: true,
      atom: true,
      priority: 110,
      addAttributes() {
        return { fnId: { default: null } }
      },
      parseHTML() {
        return [{
          tag: 'sup.fn[data-fn]',
          getAttrs: el => ({ fnId: el.getAttribute('data-fn') }),
        }]
      },
      renderHTML({ node }) {
        return ['sup', { 'data-fn': node.attrs.fnId, class: 'fn' },
          ['a', { href: '#' + node.attrs.fnId }]]
      },
    })

    const FootnotesList = TiptapNode.create({
      name: 'footnotesList',
      group: 'block',
      content: 'footnoteItem+',
      defining: true,
      isolating: true,
      priority: 110,  // must out-rank OrderedList's generic 'ol' parse rule
      parseHTML() {
        return [{ tag: 'ol.wp-block-footnotes' }]
      },
      renderHTML() {
        return ['ol', { class: 'wp-block-footnotes' }, 0]
      },
    })

    const FootnoteItem = TiptapNode.create({
      name: 'footnoteItem',
      content: 'inline*',
      defining: true,
      priority: 110,  // must out-rank ListItem's generic 'li' rule for these lis
      addAttributes() {
        return { fnId: { default: null } }
      },
      parseHTML() {
        return [{
          tag: 'ol.wp-block-footnotes > li',
          getAttrs: el => {
            el.querySelectorAll('.footnote-backref').forEach(a => a.remove())
            return { fnId: el.getAttribute('id') }
          },
        }]
      },
      renderHTML({ node }) {
        return ['li', { id: node.attrs.fnId }, 0]
      },
      addNodeView() {
        return ({ node, editor, getPos }) => new FootnoteItemNodeView(node, editor, getPos)
      },
    })

    class FootnoteItemNodeView {
      constructor(node, editor, getPos) {
        this.node = node
        this.editor = editor

        this.dom = document.createElement('li')
        this.dom.id = node.attrs.fnId || ''

        this.contentDOM = document.createElement('span')
        this.contentDOM.className = 'fn-item-content'

        this.backArrow = document.createElement('a')
        this.backArrow.className = 'fn-backref'
        this.backArrow.textContent = '↩'
        this.backArrow.contentEditable = 'false'
        this.backArrow.tabIndex = -1
        this.backArrow.setAttribute('aria-label', 'Back to content')
        this.backArrow.addEventListener('mousedown', e => {
          e.preventDefault()
          const fnId = this.node.attrs.fnId
          let markerPos = null
          let markerSize = 0
          this.editor.state.doc.descendants((n, pos) => {
            if (n.type.name === 'footnoteMarker' && n.attrs.fnId === fnId) {
              markerPos = pos
              markerSize = n.nodeSize
              return false
            }
            return true
          })
          if (markerPos !== null) {
            this.editor.chain().focus().setTextSelection(markerPos + markerSize).scrollIntoView().run()
          }
        })

        this.dom.appendChild(this.contentDOM)
        this.dom.appendChild(this.backArrow)
        this._syncEmpty(node)
      }

      _syncEmpty(node) {
        this.dom.classList.toggle('fn-item-empty', node.content.size === 0)
      }

      update(node) {
        if (node.type.name !== 'footnoteItem') return false
        this.node = node
        this.dom.id = node.attrs.fnId || ''
        this._syncEmpty(node)
        return true
      }

      stopEvent(event) {
        return event.target === this.backArrow
      }

      ignoreMutation(mutation) {
        return mutation.target === this.backArrow ||
          this.backArrow.contains(mutation.target)
      }
    }

    // Keeps the footnotes list consistent with the markers after every doc
    // change: entries follow marker order, orphaned entries are removed,
    // missing entries are created (paste/undo edge cases), and the list
    // itself is removed when the last marker goes. appendTransaction runs
    // again on its own output; the second pass finds everything consistent
    // and returns null, so there is no loop.
    const FootnoteSync = Extension.create({
      name: 'footnoteSync',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: new PluginKey('footnoteSync'),
            appendTransaction(transactions, oldState, newState) {
              if (!transactions.some(tr => tr.docChanged)) return null

              const markerIds = []
              let listPos = null
              let listNode = null
              newState.doc.descendants((node, pos) => {
                if (node.type.name === 'footnotesList') {
                  listPos = pos
                  listNode = node
                  return false  // don't collect markers inside the list
                }
                if (node.type.name === 'footnoteMarker' && node.attrs.fnId) {
                  markerIds.push(node.attrs.fnId)
                }
                return true
              })

              if (listPos === null) {
                if (markerIds.length === 0) return null
                const items = markerIds.map(id =>
                  newState.schema.nodes.footnoteItem.create({ fnId: id }))
                return newState.tr.insert(
                  newState.doc.content.size,
                  newState.schema.nodes.footnotesList.create(null, items)
                )
              }

              const currentIds = []
              const itemsById = new Map()
              listNode.forEach(child => {
                currentIds.push(child.attrs.fnId)
                if (child.attrs.fnId) itemsById.set(child.attrs.fnId, child)
              })

              if (currentIds.length === markerIds.length &&
                  currentIds.every((id, i) => id === markerIds[i])) return null

              const tr = newState.tr
              if (markerIds.length === 0) {
                tr.delete(listPos, listPos + listNode.nodeSize)
              } else {
                const desired = markerIds.map(id =>
                  itemsById.get(id) || newState.schema.nodes.footnoteItem.create({ fnId: id }))
                tr.replaceWith(listPos + 1, listPos + listNode.nodeSize - 1, desired)
              }
              return tr
            },
          })
        ]
      },
    })

    // ── Spell check ───────────────────────────────────────
    // ── Container chrome ─────────────────────────────
    // Every visual affordance the container blocks need — a <details> forced
    // open so its body stays editable, collapsed-for-preview, the active tab —
    // is a decoration. Decorations are not part of the document, so none of it
    // can reach getHTML() and therefore a save.
    const containerChromeKey = new PluginKey('containerChrome')

    const COLLAPSIBLE = new Set(['accordionItem', 'detailsBlock'])

    // The minus buttons remove one part; this removes the whole block. A block
    // type is deletable only by being named here, so the ✕ and ⌘⇧⌫ can never
    // disagree about what they cover.
    const DELETABLE_BLOCKS = new Map([
      ['table', 'table'],
      ['tabsBlock', 'tabs'],
      ['accordionBlock', 'accordion'],
      ['detailsBlock', 'details'],
      ['columnsBlock', 'columns'],
      ['buttonsBlock', 'buttons'],
      ['pullquote', 'pullquote'],
      ['preformatted', 'preformatted'],
      ['blockquote', 'quote'],
      ['codeBlock', 'code block'],
      ['horizontalRule', 'separator'],
    ])

    function _deletableBlockAt($pos) {
      for (let d = $pos.depth; d > 0; d--) {
        const node = $pos.node(d)
        if (DELETABLE_BLOCKS.has(node.type.name)) return { node, pos: $pos.before(d) }
      }
      return null
    }

    // A leaf block is never an ancestor of the caret, so a selected separator
    // is reachable only through the node selection.
    function _deletableTarget(state) {
      const node = state.selection.node
      if (node && DELETABLE_BLOCKS.has(node.type.name)) return { node, pos: state.selection.from }
      return _deletableBlockAt(state.selection.$from)
    }

    function _caretAfterDeleting(doc, pos) {
      let after = null, before = null
      doc.descendants((node, at) => {
        if (!node.isTextblock) return true
        if (at >= pos) { if (after === null) after = at + 1 }
        else before = at + 1 + node.content.size
        return false
      })
      return after !== null ? after : before
    }

    function _deleteContainerBlock() {
      const target = _deletableTarget(editor.state)
      if (!target) return false
      const tr = editor.state.tr.delete(target.pos, target.pos + target.node.nodeSize)
      const $at = tr.doc.resolve(Math.min(target.pos, tr.doc.content.size))
      if ($at.parent.content.size === 0) tr.insert($at.pos, editor.schema.nodes.paragraph.create())
      editor.view.dispatch(tr)
      const caret = _caretAfterDeleting(editor.state.doc, target.pos)
      if (caret !== null) editor.commands.setTextSelection(caret)
      editor.commands.focus()
      return true
    }

    // Esc belongs to whatever overlay is open before it belongs to the editor.
    function _overlayOpen() {
      return !!document.querySelector('#insert-menu.visible, #embed-menu.visible, #find-bar.visible, #table-size-menu.visible')
    }

    // Land the caret in typable space just past the container, making that
    // paragraph when the container is the last thing there is.
    function _exitContainerBlock(tr, target) {
      target = target || _deletableBlockAt(editor.state.selection.$from)
      if (!target) return false
      tr = tr || editor.state.tr
      const after = tr.mapping.map(target.pos + target.node.nodeSize)
      const next = tr.doc.nodeAt(after)
      if (!next || !next.isTextblock) tr.insert(after, editor.schema.nodes.paragraph.create())
      editor.view.dispatch(tr)
      editor.commands.setTextSelection(after + 1)
      editor.commands.focus()
      return true
    }

    // Without this every container answers Enter differently: ProseMirror's
    // lift escapes only where the schema lets it, so an earlier tab panel
    // ignored it and a column split itself in half.
    function _containerEnter() {
      if (_isInFootnote()) return false
      const { $from, empty } = editor.state.selection
      if (!empty) return false

      if ($from.parent.type.name === 'preformatted') {
        if ($from.parentOffset !== $from.parent.content.size) return false
        if (!$from.parent.textContent.endsWith('\n\n')) return false
        return _exitContainerBlock(editor.state.tr.delete($from.pos - 2, $from.pos))
      }

      const target = _deletableBlockAt($from)
      // A cell legitimately holds paragraphs, and escaping a whole table from
      // the middle of one would surprise more than it helps.
      if (!target || target.node.type.name === 'table') return false

      if ($from.parent.type.name === 'paragraph' && $from.parent.content.size === 0
          && $from.after() === $from.end(-1)) {
        const tr = editor.state.tr
        if ($from.node(-1).childCount > 1) tr.delete($from.before(), $from.after())
        return _exitContainerBlock(tr, target)
      }

      if (target.node.type.name === 'pullquote' && $from.parent.type.name === 'paragraph'
          && $from.node(-1).type.name === 'pullquote') {
        const tr = editor.state.tr
        tr.split($from.pos, 1, [{ type: editor.schema.nodes.paragraph }])
        editor.view.dispatch(tr)
        return true
      }
      return false
    }

    const ContainerExit = Extension.create({
      name: 'containerExit',
      priority: 250,
      addKeyboardShortcuts() {
        return {
          Escape: () => (_overlayOpen() ? false : _exitContainerBlock()),
          Enter: () => _containerEnter(),
        }
      },
    })

    // A class, never a widget: a contenteditable=false node next to the caret
    // is where WebKit stops accepting keystrokes, so the hint is drawn in CSS.
    const HINTED_TITLES = new Set(['accordionHeading', 'detailsSummary'])

    // The whole accordion row toggles, so its title is the one place a press
    // must fall through and land a caret instead.
    function _onOwnText(el, x, y) {
      const range = el.ownerDocument.createRange()
      range.selectNodeContents(el)
      // Absent wherever there is no layout engine, jsdom included.
      if (!range.getClientRects) return false
      const rects = range.getClientRects()
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i]
        if (!r.width || !r.height) continue
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true
      }
      return false
    }

    function _tabDecorations(node, pos, head, decos) {
      if (node.childCount < 2) return
      const list = node.child(0)
      const panels = node.child(1)
      const listContent = pos + 2
      const panelsContent = pos + 1 + list.nodeSize + 1
      const spans = []
      list.forEach((child, offset, i) => spans.push([listContent + offset, child.nodeSize, i]))
      panels.forEach((child, offset, i) => spans.push([panelsContent + offset, child.nodeSize, i]))
      let active = 0
      for (const [from, size, i] of spans) {
        if (head > from && head < from + size) { active = i; break }
      }
      for (const [from, size, i] of spans) {
        if (i === active) decos.push(Decoration.node(from, from + size, { class: 'is-active-tab' }))
      }
      // The visibly active tab follows the caret, so isDefaultTab needs a mark
      // of its own or the setting shows nowhere. One tab is trivially default.
      if (list.childCount < 2) return
      const defaultIndex = _carriedAttr(node.attrs.blockAttrs, 'activeTabIndex') || 0
      list.forEach((child, offset, i) => {
        if (i !== defaultIndex) return
        decos.push(Decoration.node(listContent + offset, listContent + offset + child.nodeSize, { class: 'is-default-tab' }))
      })
    }

    function _chromeDecorations(state) {
      const decos = []
      const head = state.selection.head
      state.doc.descendants((node, pos) => {
        const name = node.type.name
        if (name === 'detailsBlock') {
          decos.push(Decoration.node(pos, pos + node.nodeSize, { open: '' }))
          if (node.attrs.showContent) {
            decos.push(Decoration.node(pos, pos + node.nodeSize, { class: 'shows-content' }))
          }
        }
        if (name === 'tabsBlock') _tabDecorations(node, pos, head, decos)
        if (HINTED_TITLES.has(name) && node.content.size === 0) {
          decos.push(Decoration.node(pos, pos + node.nodeSize, { class: 'is-untitled' }))
        }
        return true
      })
      return decos
    }

    function _collapsibleAt($pos) {
      for (let d = $pos.depth; d > 0; d--) {
        if (COLLAPSIBLE.has($pos.node(d).type.name)) return { pos: $pos.before(d), node: $pos.node(d) }
      }
      return null
    }

    function _toggleCollapseAt(view, $pos) {
      const target = _collapsibleAt($pos)
      if (!target) return false
      view.dispatch(view.state.tr.setMeta(containerChromeKey, {
        pos: target.pos, nodeSize: target.node.nodeSize,
      }))
      return true
    }

    const ContainerChrome = Extension.create({
      name: 'containerChrome',
      addKeyboardShortcuts() {
        return { 'Meta-Shift-Backspace': () => _deleteContainerBlock() }
      },
      addCommands() {
        return {
          toggleContainerCollapse: () => ({ state, dispatch }) => {
            const target = _collapsibleAt(state.selection.$head)
            if (!target) return false
            if (dispatch) {
              dispatch(state.tr.setMeta(containerChromeKey, {
                pos: target.pos, nodeSize: target.node.nodeSize,
              }))
            }
            return true
          },
        }
      },
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: containerChromeKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                let next = set.map(tr.mapping, tr.doc)
                const toggle = tr.getMeta(containerChromeKey)
                if (toggle) {
                  const at = next.find(toggle.pos, toggle.pos + toggle.nodeSize)
                                 .filter(d => d.from === toggle.pos)
                  next = at.length
                    ? next.remove(at)
                    : next.add(tr.doc, [Decoration.node(
                        toggle.pos, toggle.pos + toggle.nodeSize, { class: 'is-collapsed' })])
                }
                return next
              },
            },
            props: {
              decorations(state) {
                return containerChromeKey.getState(state).add(state.doc, _chromeDecorations(state))
              },
              handleDOMEvents: {
                // <details> is forced open by decoration; let nothing flip it back.
                click(view, event) {
                  return !!(event.target.closest && event.target.closest('.wp-block-details > summary'))
                    && (event.preventDefault(), true)
                },
                mousedown(view, event) {
                  const el = event.target.closest && event.target.closest(
                    '.wp-block-accordion-heading, .wp-block-details > summary')
                  if (!el) return false
                  const isSummary = el.tagName === 'SUMMARY'
                  const title = isSummary
                    ? el : el.querySelector('.wp-block-accordion-heading__toggle-title')
                  if (!title) return false
                  const rect = el.getBoundingClientRect()
                  const onArrow = isSummary && event.clientX - rect.left <= 22
                  // An untitled accordion title has no arrow, so the icon is its
                  // only toggle zone -- without this, an untitled item with an
                  // empty title could never be collapsed by click. rect.width is
                  // 0 in jsdom (no layout), which would make the right-edge test
                  // spuriously true for every click -- gate on real layout.
                  const onIcon = !isSummary && rect.width > 0 && el.classList.contains('has-icon') &&
                    (el.classList.contains('has-icon-left')
                      ? event.clientX - rect.left <= 34
                      : rect.right - event.clientX <= 34)
                  // An untitled row is zero-width, so the browser seats the
                  // caret in the panel below instead. Deferred past WebKit's own
                  // click handling, and without preventDefault, which would
                  // leave nothing focused and drop every keystroke.
                  if (!onArrow && !onIcon && el.classList.contains('is-untitled')) {
                    const at = view.posAtDOM(title, 0)
                    if (at >= 0) {
                      setTimeout(() => editor.chain().focus().setTextSelection(at).run(), 60)
                    }
                    return false
                  }
                  if (isSummary) {
                    if (!onArrow) return false
                  } else if (!onIcon) {
                    if (!title.textContent.trim()) return false
                    if (_onOwnText(title, event.clientX, event.clientY)) return false
                  }
                  const pos = view.posAtDOM(el, 0)
                  if (pos < 0) return false
                  event.preventDefault()
                  return _toggleCollapseAt(view, view.state.doc.resolve(pos))
                },
              },
            },
          }),
        ]
      },
    })

    const spellCheckKey = new PluginKey('spellCheck')

    const SpellCheck = Extension.create({
      name: 'spellCheck',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: spellCheckKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                const incoming = tr.getMeta(spellCheckKey)
                if (incoming !== undefined) return incoming
                if (!tr.docChanged) return set
                let next = set.map(tr.mapping, tr.doc)
                for (const step of tr.steps) {
                  step.getMap().forEach((oldStart, oldEnd, newStart, newEnd) => {
                    const overlapping = next.find(newStart, newEnd)
                    if (overlapping.length) next = next.remove(overlapping)
                  })
                }
                return next
              }
            },
            props: {
              decorations(state) { return spellCheckKey.getState(state) }
            }
          })
        ]
      }
    })

    // ── Find & replace highlight ─────────────────────
    const findKey = new PluginKey('findReplace')

    const FindHighlight = Extension.create({
      name: 'findHighlight',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: findKey,
            state: {
              init() { return DecorationSet.empty },
              apply(tr, set) {
                const incoming = tr.getMeta(findKey)
                if (incoming !== undefined) return incoming
                return tr.docChanged ? set.map(tr.mapping, tr.doc) : set
              }
            },
            props: {
              decorations(state) { return findKey.getState(state) }
            }
          })
        ]
      }
    })

    // Blocks that end a document with nowhere to click after them: a table
    // seats the caret back in its last cell, and the rest hold no text at all.
    // Lists, quotes and the containers are left out — Enter already walks out of
    // those. The save transform drops the paragraph again while it is empty.
    const TRAILING_PARAGRAPH_AFTER = new Set([
      'table', 'galleryBlock', 'embedBlock', 'gutenbergPassthrough', 'horizontalRule',
    ])

    const TrailingParagraph = Extension.create({
      name: 'trailingParagraph',
      addProseMirrorPlugins() {
        return [
          new Plugin({
            key: new PluginKey('trailingParagraph'),
            appendTransaction(_trs, _oldState, state) {
              const last = state.doc.lastChild
              if (!last || !TRAILING_PARAGRAPH_AFTER.has(last.type.name)) return null
              return state.tr.insert(state.doc.content.size, state.schema.nodes.paragraph.create())
            },
          }),
        ]
      },
    })

    // Extended blockquote: allows an optional cite as its last child.
    const CustomBlockquote = withBlockAttrs(withClassAttr(Blockquote.extend({
      content: 'block+ cite?',
      addKeyboardShortcuts() {
        const orig = this.parent?.()
        const wrapped = Object.fromEntries(Object.entries(orig || {}).map(([k, fn]) =>
          [k, (...args) => _isInFootnote() ? !_fnPassthrough.has(k) : fn(...args)]))
        return {
          ...wrapped,
          Enter: () => {
            if (_isInFootnote()) return true
            const { state } = this.editor
            const { $from, empty } = state.selection
            const bqDepth = _ancestorDepth($from, 'blockquote')
            if (bqDepth === -1) return false
            if ($from.node($from.depth).type.name === 'cite') return false
            if ($from.depth > bqDepth + 2) return false
            if (empty && $from.parent.content.size === 0) {
              return this.editor.commands.liftEmptyBlock()
            }
            const { tr } = state
            const paraType = state.schema.nodes.paragraph
            if (!empty) tr.deleteSelection()
            const $cur = tr.selection.$from
            const curBqDepth = _ancestorDepth($cur, 'blockquote')
            if (curBqDepth === -1) return false
            tr.split($cur.pos, $cur.depth - curBqDepth, [{type: paraType, attrs: null}])
            tr.scrollIntoView()
            this.editor.view.dispatch(tr)
            return true
          },
        }
      },
    })))

    // Phrasing wrappers nothing else claims; del is strike's, ruby is structural.
    const PRESERVED_INLINE_TAGS = [
      'abbr', 'bdi', 'bdo', 'big', 'data', 'dfn', 'ins', 'kbd',
      'mark', 'q', 'samp', 'small', 'sub', 'sup', 'time', 'var',
    ]

    const _attrMap = el => Object.fromEntries(
      Array.from(el.attributes)
        .filter(a => isCarryableAttr(a.name, a.value))
        .map(a => [a.name, a.value]))

    const RawInline = Mark.create({
      name: 'rawInline',
      priority: 50,
      excludes: '',
      addAttributes() {
        return {
          tag:      { default: 'span', renderHTML: () => ({}) },
          rawAttrs: { default: null,   renderHTML: () => ({}) },
        }
      },
      parseHTML() {
        return PRESERVED_INLINE_TAGS.map(tag => ({
          tag,
          getAttrs: el => el.matches('sup.fn[data-fn]')
            ? false
            : { tag, rawAttrs: _attrMap(el) },
        })).concat([{
          tag: 'span',
          getAttrs: el => (!el.attributes.length || /underline|line-through/.test(el.style.textDecoration))
            ? false
            : { tag: 'span', rawAttrs: _attrMap(el) },
        }])
      },
      renderHTML({ mark }) {
        return [mark.attrs.tag || 'span', mark.attrs.rawAttrs || {}, 0]
      },
    })

    // Everything else core wrote on the anchor -- title, its own data-* -- is carried.
    const LINK_MODELED_ATTRS = new Set(['href', 'target', 'rel', 'class'])

    const LinkWithRawAttrs = Link.extend({
      addAttributes() {
        return {
          ...this.parent?.(),

    function initToolbarTooltips() {
      const tip = document.createElement('div')
      tip.id = 'toolbar-tooltip'

      let activeEl = null

      function positionTip(el) {
        const rect = el.getBoundingClientRect()
        const tipRect = tip.getBoundingClientRect()
        const margin = 8
        const belowTop = rect.bottom + margin
        const aboveTop = rect.top - tipRect.height - margin
        const showAbove = belowTop + tipRect.height > window.innerHeight && aboveTop > margin
        const top = showAbove ? aboveTop : belowTop
        const half = tipRect.width / 2
        const idealLeft = rect.left + rect.width / 2
        const left = Math.min(
          Math.max(idealLeft, half + margin),
          window.innerWidth - half - margin
        )
        // Arrow points at the button center regardless of how far the tooltip was clamped
        const arrowPx = idealLeft - (left - half)
        tip.style.setProperty('--arrow-offset', `${arrowPx}px`)
        tip.style.left = `${left}px`
        tip.style.top = `${top}px`
        tip.classList.toggle('above', showAbove)
        tip.classList.toggle('below', !showAbove)
      }

        if (el.disabled) return
        const text = el.dataset.tooltip
        if (!text) return
        activeEl = el
        clearTimeout(showTimer)
        showTimer = setTimeout(() => {
          if (activeEl !== el) return
          tip.textContent = text
          tip.classList.remove('visible')
          tip.style.left = '-9999px'
          tip.style.top = '-9999px'
          requestAnimationFrame(() => {
            positionTip(el)
            tip.classList.add('visible')
          })
        }, 220)
      }

      function hide(el) {
        if (el && activeEl !== el) return
        activeEl = null
        clearTimeout(showTimer)
        tip.classList.remove('visible')
      }

        el.removeAttribute('title')
        el.addEventListener('mouseenter', () => show(el))
        el.addEventListener('mouseleave', () => hide(el))
        el.addEventListener('focus', () => show(el))
        el.addEventListener('blur', () => hide(el))
        el.addEventListener('mousedown', () => hide(el))

      window.addEventListener('resize', () => hide(activeEl))

    // ── Registry-driven toolbar controls ──────────────
    // One span per node that declares a control, generated into row 2 beside

    // An atom block -- a separator, an image -- is reached as a NodeSelection
    // rather than as an ancestor of the caret.
    function _settingBlockAt(state, typeName) {
      const selected = state.selection.node
      if (selected && selected.type.name === typeName) return { node: selected, pos: state.selection.from }
      const $from = state.selection.$from
      for (let d = $from.depth; d >= 1; d--) {
        if ($from.node(d).type.name === typeName) return { node: $from.node(d), pos: $from.before(d) }
      }
      return null
    }

    function _setSettingAttrs(typeName, attrs) {
      const target = _settingBlockAt(editor.state, typeName)
      if (!target) return
      const { state, view } = editor
      view.dispatch(state.tr.setNodeMarkup(target.pos, undefined, { ...target.node.attrs, ...attrs }))

    // A block carries exactly one style, so choosing one clears every other
    // is-style-* token while leaving the user's own classes in place.
    function _spliceStyleToken(classes, token) {
      const kept = String(classes || '').split(/\s+/).filter(c => c && !/^is-style-/.test(c))
      if (token) kept.push(token)
      return kept.join(' ')
    }

    function _styleTokenIn(classes) {
      const m = String(classes || '').match(/(?:^|\s)(is-style-[^\s]+)/)
      return m ? m[1] : ''
    }

    function _blockStyleOf(node, def) {
      const { classAttr } = def.control
      return (classAttr ? _styleTokenIn(node.attrs[classAttr]) : '')
        || _styleTokenIn(carriedClassName(node.attrs.blockAttrs))
    }

    function _carriedAttr(raw, key) {
      try {
        const parsed = raw ? JSON.parse(raw) : null
        return (parsed && typeof parsed === 'object') ? parsed[key] : undefined
      } catch (e) {
        return undefined
      }
    }

    // A null value deletes the key, and an empty carrier becomes no carrier at
    // all, so a setting back at its default writes no delimiter attribute.
    function _withCarriedAttr(raw, key, value) {
      let carried = {}
      try { carried = raw ? JSON.parse(raw) : {} } catch (e) { carried = {} }
      if (value === null || value === undefined || value === '') delete carried[key]
      else carried[key] = value
      return Object.keys(carried).length ? JSON.stringify(carried) : null
    }

    // A control on one node that writes an index onto an ancestor -- core's own
    // shape for the tabs default tab, whose checkbox sits on the panel while
    // activeTabIndex lives on the tabs block.
    function _ancestorIndexTarget(state, typeName, control) {
      const $from = state.selection.$from
      for (let d = $from.depth; d >= 1; d--) {
        if ($from.node(d).type.name !== typeName) continue
        const index = $from.index(d - 1)
        for (let a = d - 1; a >= 1; a--) {
          if ($from.node(a).type.name !== control.ancestor) continue
          return { index, node: $from.node(a), pos: $from.before(a) }
        }
        return null
      }
      return null
    }

    function _setBlockStyle(typeName, def, token) {
      const target = _settingBlockAt(editor.state, typeName)
      if (!target) return
      const { classAttr } = def.control
      const attrs = {}
      attrs.blockAttrs = _withCarriedAttr(target.node.attrs.blockAttrs, 'className',
        _spliceStyleToken(carriedClassName(target.node.attrs.blockAttrs), token))
      if (classAttr) attrs[classAttr] = _spliceStyleToken(target.node.attrs[classAttr], token) || null
      _setSettingAttrs(typeName, attrs)
    }

    // A carried setting has no attribute of its own -- its value lives in the
    // delimiter JSON the carrier holds.
    function _settingValue(node, name, def) {
      if (def.kind !== 'carried') return node.attrs[name]
      const carried = _carriedAttr(node.attrs.blockAttrs, name)
      return carried === undefined ? def.default : carried
    }

    // Core's serializer omits an attribute that equals its default, so writing
    // the default deletes the key rather than spelling it out.
    function _attrsWithSetting(attrs, name, def, value) {
      if (def.kind !== 'carried') return { ...attrs, [name]: value }
      return { ...attrs, blockAttrs: _withCarriedAttr(attrs.blockAttrs, name, value === def.default ? null : value) }
    }

    // A propagated setting is stored twice by core -- on the block and on each
    // descendant that draws it -- so both halves move in one transaction, and
    // one undo reverses the lot. The descendant both draws and carries it.
    function _setSettingValue(typeName, name, def, value) {
      const target = _settingBlockAt(editor.state, typeName)
      if (!target) return
      const { state, view } = editor
      const tr = state.tr
      tr.setNodeMarkup(target.pos, undefined, _attrsWithSetting(target.node.attrs, name, def, value))
      const propagate = def.control && def.control.propagate
      if (propagate) {
        target.node.descendants((child, offset) => {
          if (child.type.name !== propagate) return
          const carried = _attrsWithSetting(child.attrs, name, { kind: 'carried', default: def.default }, value)
          tr.setNodeMarkup(target.pos + 1 + offset, undefined, { ...carried, [name]: value })
        })
      }
      view.dispatch(tr)
    }

    // A toggle's on value is the flagClass `when` where there is one and true
    // otherwise; its off value is the default, unless the default is already
    // the on value.
    function _toggleValues(def) {
      const on = 'when' in def ? def.when : true
      return [on, def.default === on ? !on : def.default]
    }

    // Mirrors the save transform: a declared section wins, and an all-<th>
    // first row is the fallback for classic tables and for the ones Quill
    // inserts, which declare nothing.
    function _tableSections(node) {
      const rows = []
      node.forEach((row, offset) => rows.push({ row, offset, type: row.attrs.rowType || 'body' }))
      if (!rows.length || rows[0].type !== 'body' || rows.some(r => r.type === 'head')) return rows
      const first = rows[0].row
      const headed = first.childCount > 0 &&
        Array.from({ length: first.childCount }, (_, i) => first.child(i))
          .every(cell => cell.type.name === 'tableHeader')
      if (headed) rows[0].type = 'head'
      return rows
    }

    function _tableSectionRow(node, type) {
      return _tableSections(node).find(r => r.type === type) || null
    }

    // core's header section is <th> cells, its footer <td>.
    function _toggleTableSection(type) {
      const target = _settingBlockAt(editor.state, 'table')
      if (!target) return
      const { node, pos } = target
      const existing = _tableSectionRow(node, type)
      const tr = editor.state.tr
      if (existing) {
        if (node.childCount <= 1) return
        const at = pos + 1 + existing.offset
        tr.delete(at, at + existing.row.nodeSize)
      } else {
        const cellType = type === 'head' ? editor.schema.nodes.tableHeader : editor.schema.nodes.tableCell
        const width = node.firstChild ? node.firstChild.childCount : 1
        const cells = Array.from({ length: width }, () => cellType.createAndFill())
        const row = editor.schema.nodes.tableRow.create({ rowType: type }, cells)
        tr.insert(type === 'head' ? pos + 1 : pos + node.nodeSize - 1, row)
      }
      editor.view.dispatch(tr)
      editor.commands.focus()
    }

    function _buildSettingToggle(typeName, name, def) {
      const [on, off] = _toggleValues(def)
      const btn = document.createElement('button')
      btn.dataset.setting = name
      btn.textContent = def.control.label
      if (def.control.title) btn.title = def.control.title
      btn.addEventListener('mousedown', e => {
        e.preventDefault()
        const target = _settingBlockAt(editor.state, typeName)
        if (target) _setSettingValue(typeName, name, def, _settingValue(target.node, name, def) === on ? off : on)
      })
      return { name, def, el: btn, reflect: node => btn.classList.toggle('active', _settingValue(node, name, def) === on) }
    }

    // Core hands the heading its icon settings through block context; Quill has
    // none, so a new item copies them off the accordion, drawing and carrying
    // them the way core's own save() would.
    function _inheritedAccordionHeading(accordion) {
      const attrs = {}
      let carried = null
      for (const [name, def] of Object.entries(settingsFor('accordionBlock'))) {
        if (!def.control || def.control.propagate !== 'accordionHeading') continue
        const value = _carriedAttr(accordion.attrs.blockAttrs, name)
        if (value === undefined) continue
        attrs[name] = value
        carried = _withCarriedAttr(carried, name, value)
      }
      return editor.schema.nodes.accordionHeading.create({ ...attrs, blockAttrs: carried })
    }

    // Two options is a switch, not a list -- the rule the block styles follow.
    // It shows the option it is on rather than a checked state: joined to the
    // toggle that gates it, a second raised segment would read as a second
    // on/off, and a side is always one value or the other.
    function _buildSettingChoiceToggle(typeName, name, def) {
      const [first, second] = def.control.options
      const btn = document.createElement('button')
      btn.dataset.setting = name
      btn.title = def.control.title || def.control.label
      btn.addEventListener('mousedown', e => {
        e.preventDefault()
        const target = _settingBlockAt(editor.state, typeName)
        if (!target) return
        const on = _settingValue(target.node, name, def) === second.value
        _setSettingValue(typeName, name, def, on ? first.value : second.value)
      })
      return {
        name,
        def,
        el: btn,
        reflect: node => {
          btn.textContent = (_settingValue(node, name, def) === second.value ? second : first).label
        },
      }
    }

    function _buildSettingChoice(typeName, name, def) {
      if (def.control.options.length === 2) return _buildSettingChoiceToggle(typeName, name, def)
      const select = document.createElement('select')
      select.className = 'setting-select'
      select.dataset.setting = name
      select.title = def.control.title || def.control.label
      for (const option of def.control.options) {
        const el = document.createElement('option')
        el.value = option.value
        el.textContent = option.label
        select.appendChild(el)
      }
      select.addEventListener('mousedown', e => e.stopPropagation())
      // A select has to take focus to open, so unlike the buttons it cannot
      // preventDefault; without this the caret is stranded and keystrokes drop.
      select.addEventListener('change', () => {
        _setSettingValue(typeName, name, def, select.value)
        editor.commands.focus()
      })
      return { name, def, el: select, reflect: node => { select.value = _settingValue(node, name, def) } }
    }

    // Two styles is a switch, not a list: the control is a button labelled with
    // the non-default style. Only the separator has more than two.
    function _buildSettingStyleToggle(typeName, name, def) {
      const { value: token, label } = def.control.options[1]
      const btn = document.createElement('button')
      btn.dataset.setting = name
      btn.dataset.style = token
      btn.textContent = label
      btn.title = label
      btn.addEventListener('mousedown', e => {
        e.preventDefault()
        const target = _settingBlockAt(editor.state, typeName)
        if (target) _setBlockStyle(typeName, def, _blockStyleOf(target.node, def) === token ? '' : token)
      })
      return { name, def, el: btn, reflect: node => btn.classList.toggle('active', _blockStyleOf(node, def) === token) }
    }

    function _buildSettingStylePicker(typeName, name, def) {
      if (def.control.options.length === 2) return _buildSettingStyleToggle(typeName, name, def)
      const select = document.createElement('select')
      select.className = 'setting-select'
      select.dataset.setting = name
      select.title = def.control.label
      for (const option of def.control.options) {
        const el = document.createElement('option')
        el.value = option.value
        el.textContent = option.label
        select.appendChild(el)
      }
      select.addEventListener('mousedown', e => e.stopPropagation())
      select.addEventListener('change', () => {
        _setBlockStyle(typeName, def, select.value)
        editor.commands.focus()
      })
      return { name, def, el: select, reflect: node => { select.value = _blockStyleOf(node, def) } }
    }

    function _buildSettingAncestorIndex(typeName, name, def) {
      const { control } = def
      const btn = document.createElement('button')
      btn.dataset.setting = name
      btn.textContent = control.label
      if (control.title) btn.title = control.title
      btn.addEventListener('mousedown', e => {
        e.preventDefault()
        const target = _ancestorIndexTarget(editor.state, typeName, control)
        if (!target) return
        const current = _carriedAttr(target.node.attrs.blockAttrs, control.attr) || 0
        const next = current === target.index ? null : target.index || null
        const { state, view } = editor
        view.dispatch(state.tr.setNodeMarkup(target.pos, undefined, {
          ...target.node.attrs,
          blockAttrs: _withCarriedAttr(target.node.attrs.blockAttrs, control.attr, next),
        }))
      })
      return {
        name,
        def,
        el: btn,
        reflect: () => {
          const target = _ancestorIndexTarget(editor.state, typeName, control)
          const current = target ? (_carriedAttr(target.node.attrs.blockAttrs, control.attr) || 0) : -1
          btn.classList.toggle('active', !!target && current === target.index)
        },
      }
    }

    // Core's algorithm, verbatim: appending the token when it is absent and
    // trimming, then stripping it and trimming on the way back off.
    function _withRelToken(rel, token, on) {
      const current = String(rel || '')
      if (on) return (current.includes(token) ? current : current + ' ' + token).trim()
      return current.replace(new RegExp('\\b' + token + '\\s*', 'g'), '').trim()
    }

    function _buildSettingNewTab(typeName, name, def) {
      const { control } = def
      const btn = document.createElement('button')
      btn.dataset.setting = name
      btn.textContent = control.label
      if (control.title) btn.title = control.title
      btn.addEventListener('mousedown', e => {
        e.preventDefault()
        const target = _settingBlockAt(editor.state, typeName)
        if (!target) return
        const on = target.node.attrs[name] !== '_blank'
        _setSettingAttrs(typeName, {
          [name]: on ? '_blank' : null,
          [control.relSetting]: _withRelToken(target.node.attrs[control.relSetting], control.rel, on) || null,
        })
      })
      return { name, def, el: btn, reflect: node => btn.classList.toggle('active', node.attrs[name] === '_blank') }
    }

    function _buildSettingControl(typeName, name, def) {
      if (def.control.type === 'newTab') return _buildSettingNewTab(typeName, name, def)
      if (def.control.type === 'toggle') return _buildSettingToggle(typeName, name, def)
      if (def.control.type === 'choice') return _buildSettingChoice(typeName, name, def)
      if (def.control.type === 'blockStyle') return _buildSettingStylePicker(typeName, name, def)
      if (def.control.type === 'ancestorIndex') return _buildSettingAncestorIndex(typeName, name, def)
      return null
    }

    // A control that gates another is rendered joined to it, so the dependency
    // is visible rather than implied by adjacency.
    function _appendSettingControls(span, controls) {
      const dependents = new Map()
      for (const c of controls) {
        if (c.def.control.showWhen) dependents.set(c.def.control.showWhen, c)
      }
      const placed = new Set()
      for (const c of controls) {
        if (placed.has(c)) continue
        const dependent = dependents.get(c.name)
        if (!dependent) { span.appendChild(c.el); continue }
        const pair = document.createElement('span')
        pair.className = 'setting-pair'
        pair.appendChild(c.el)
        pair.appendChild(dependent.el)
        span.appendChild(pair)
        placed.add(dependent)
        dependent.pair = pair
      }
    }

    function _buildSettingGroups() {
      const groups = []
      for (const typeName of settingsNodeNames()) {
        const controls = Object.entries(settingsFor(typeName))
          .filter(([, def]) => def.control)
          .map(([name, def]) => _buildSettingControl(typeName, name, def))
          .filter(Boolean)
        if (!controls.length) continue
        const span = document.createElement('span')
        span.id = `settings-${typeName}-controls`
        span.className = 'tb-group'
        span.style.display = 'none'
        _appendSettingControls(span, controls)
        document.getElementById('toolbar-row2').appendChild(span)
        groups.push({ typeName, span, controls })
      }
      return groups
    }

    const _settingGroups = _buildSettingGroups()

    function _updateSettingControls() {
      for (const group of _settingGroups) {
        const target = _settingBlockAt(editor.state, group.typeName)
        group.span.style.display = target ? 'inline-flex' : 'none'
        if (!target) continue
        for (const c of group.controls) {
          c.reflect(target.node)
          const gate = c.def.control.showWhen
          if (!gate) continue
          const gateDef = settingsFor(group.typeName)[gate]
          // showWhen usually names a sibling setting; linkTarget's names the raw
          // `href` attribute instead, since whether a link exists isn't a setting.
          const on = gateDef ? !!_settingValue(target.node, gate, gateDef) : !!target.node.attrs[gate]
          c.el.style.display = on ? '' : 'none'
          if (c.pair) c.pair.classList.toggle('is-solo', !on)
        }
      }
    }

    initToolbarTooltips()

    const headingButton = document.getElementById('heading-button')
    const headingCurrent = document.getElementById('heading-current')
    const headingMenu = document.getElementById('heading-menu')

    function positionHeadingMenu() {
      const rect = headingButton.getBoundingClientRect()
      const margin = 8
      headingMenu.style.left = `${Math.max(rect.left, margin)}px`
      headingMenu.style.top = `${rect.bottom + margin}px`
    }

    function closeHeadingMenu() {
      headingMenu.classList.remove('visible')
      headingButton.setAttribute('aria-expanded', 'false')
    }

    function openHeadingMenu() {
      positionHeadingMenu()
      headingMenu.classList.add('visible')
      headingButton.setAttribute('aria-expanded', 'true')
    }

    function setHeadingLevel(level) {
      if (_isInFootnote()) { closeHeadingMenu(); return }
      if (level === 0) editor.chain().focus().setParagraph().run()
      else editor.chain().focus().setHeading({ level }).run()
      closeHeadingMenu()
    }

    headingButton.addEventListener('click', e => {
      e.preventDefault()
      if (headingMenu.classList.contains('visible')) closeHeadingMenu()
      else openHeadingMenu()
    })

    headingMenu.querySelectorAll('[data-heading-level]').forEach(item => {
      item.addEventListener('mousedown', e => e.preventDefault())
      item.addEventListener('click', () => setHeadingLevel(parseInt(item.dataset.headingLevel)))
    })

    document.addEventListener('mousedown', e => {
      if (!headingMenu.contains(e.target) && !headingButton.contains(e.target)) closeHeadingMenu()
    })
    window.addEventListener('resize', closeHeadingMenu)
    document.getElementById('editor-wrap').addEventListener('scroll', closeHeadingMenu)

    // ── Block insert menu ────────────────────
    const insertButton = document.getElementById('insert-button')
    const insertMenu = document.getElementById('insert-menu')

    const INSERT_ACTIONS = {
      columns:      () => window.insertColumns(2),
      accordion:    () => window.insertAccordion(),
      tabs:         () => window.insertTabs(2),
      details:      () => window.insertDetails(),
      buttons:      () => window.insertButtons(),
      pullquote:    () => editor.chain().focus().setPullquote().run(),
      preformatted: () => editor.chain().focus().setPreformatted().run(),
      separator:    () => window.insertSeparator(),
    }

    function _closeInsertMenu() {
      insertMenu.classList.remove('visible')
      insertButton.setAttribute('aria-expanded', 'false')
    }

    function _openInsertMenu() {
      const rect = insertButton.getBoundingClientRect()
      insertMenu.style.left = `${Math.max(rect.left, 8)}px`
      insertMenu.style.top = `${rect.bottom + 8}px`
      insertMenu.classList.add('visible')
      insertButton.setAttribute('aria-expanded', 'true')
    }

    insertButton.addEventListener('click', e => {
      e.preventDefault()
      if (insertMenu.classList.contains('visible')) _closeInsertMenu()
      else _openInsertMenu()
    })

    insertMenu.addEventListener('mousedown', e => e.preventDefault())
    insertMenu.addEventListener('click', e => {
      const btn = e.target.closest('[data-insert]')
      if (!btn) return
      INSERT_ACTIONS[btn.dataset.insert]?.()
      _closeInsertMenu()
    })

    document.addEventListener('mousedown', e => {
      if (!insertMenu.contains(e.target) && !insertButton.contains(e.target)) _closeInsertMenu()
    })
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && insertMenu.classList.contains('visible')) _closeInsertMenu()
    })
    window.addEventListener('resize', _closeInsertMenu)
    document.getElementById('editor-wrap').addEventListener('scroll', _closeInsertMenu)

    // ── Table size picker ─────────────────────────────
    // Word's grid: hover or arrow to a size, click or Enter to insert. Header
    // row on by default, which is both what the old fixed 3x3 did and what
    // Gutenberg's own table starts with.
    const TABLE_PICKER_ROWS = 8
    const TABLE_PICKER_COLS = 10
    const tableButton = document.querySelector('[data-cmd="insertTable"]')
    const tableMenu = document.getElementById('table-size-menu')
    const tableGrid = document.getElementById('table-size-grid')
    const tableLabel = document.getElementById('table-size-label')
    let _tableSize = { rows: 0, cols: 0 }

    for (let r = 1; r <= TABLE_PICKER_ROWS; r++) {
      for (let c = 1; c <= TABLE_PICKER_COLS; c++) {
        const cell = document.createElement('div')
        cell.className = 'table-size-cell'
        cell.dataset.rows = r
        cell.dataset.cols = c
        tableGrid.appendChild(cell)
      }
    }

    function _paintTableSize(rows, cols) {
      _tableSize = { rows, cols }
      for (const cell of tableGrid.children) {
        cell.classList.toggle('in-range', +cell.dataset.rows <= rows && +cell.dataset.cols <= cols)
      }
      tableLabel.textContent = (rows && cols) ? `${cols}×${rows} Table` : 'Table'
    }

    function _closeTableMenu() {
      tableMenu.classList.remove('visible')
      tableButton.setAttribute('aria-expanded', 'false')
    }

    function _toggleTableMenu() {
      if (tableMenu.classList.contains('visible')) { _closeTableMenu(); return }
      const rect = tableButton.getBoundingClientRect()
      tableMenu.style.left = `${Math.max(rect.left, 8)}px`
      tableMenu.style.top = `${rect.bottom + 8}px`
      _paintTableSize(0, 0)
      tableMenu.classList.add('visible')
      tableButton.setAttribute('aria-expanded', 'true')
    }

    window.insertTable = (rows, cols) => {
      _closeTableMenu()
      if (_isInFootnote()) return false
      editor.chain().focus().insertTable({ rows, cols, withHeaderRow: true }).run()
      return true
    }

    tableMenu.addEventListener('mousedown', e => e.preventDefault())
    tableGrid.addEventListener('mouseover', e => {
      const cell = e.target.closest('.table-size-cell')
      if (cell) _paintTableSize(+cell.dataset.rows, +cell.dataset.cols)
    })
    tableGrid.addEventListener('click', e => {
      const cell = e.target.closest('.table-size-cell')
      if (cell) window.insertTable(+cell.dataset.rows, +cell.dataset.cols)
    })

    // Capture, so the arrows resize the grid instead of moving the caret the
    // picker deliberately left in place.
    const TABLE_PICKER_STEPS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }
    document.addEventListener('keydown', e => {
      if (!tableMenu.classList.contains('visible')) return
      const { rows, cols } = _tableSize
      if (e.key === 'Escape') { e.preventDefault(); _closeTableMenu(); return }
      if (e.key === 'Enter') {
        e.preventDefault()
        if (rows && cols) window.insertTable(rows, cols)
        return
      }
      const step = TABLE_PICKER_STEPS[e.key]
      if (!step) return
      e.preventDefault()
      e.stopPropagation()
      _paintTableSize(Math.min(TABLE_PICKER_ROWS, Math.max(1, rows + step[0])),
                      Math.min(TABLE_PICKER_COLS, Math.max(1, cols + step[1])))
    }, true)

    document.addEventListener('mousedown', e => {
      if (!tableMenu.contains(e.target) && !tableButton.contains(e.target)) _closeTableMenu()
    })
    window.addEventListener('resize', _closeTableMenu)
    document.getElementById('editor-wrap').addEventListener('scroll', _closeTableMenu)

    // ── Embed insert popover ──────────────────────────
    const embedButton = document.getElementById('embed-button')
    const embedMenu = document.getElementById('embed-menu')

    function _openEmbedMenu() {
      const rect = embedButton.getBoundingClientRect()
      embedMenu.style.left = `${Math.max(rect.left, 8)}px`
      embedMenu.style.top = `${rect.bottom + 8}px`
      embedMenu.classList.add('visible')
      const right = embedMenu.getBoundingClientRect().right
      if (right > window.innerWidth - 8)
        embedMenu.style.left = `${Math.max(8, window.innerWidth - 8 - embedMenu.offsetWidth)}px`
      const input = document.getElementById('embed-url-input')
      input.value = ''
      input.focus()
    }

    function _closeEmbedMenu() { embedMenu.classList.remove('visible') }

    function _insertEmbedFromMenu() {
      if (_isInFootnote()) { _closeEmbedMenu(); return }
      const raw = document.getElementById('embed-url-input').value.trim()
      let parsed
      try { parsed = new URL(raw) } catch (_) { return }
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return
      editor.chain().focus().insertContent({ type: 'embedBlock', attrs: { url: raw } }).run()
      _closeEmbedMenu()
    }

    embedButton.addEventListener('click', e => {
      e.preventDefault()
      embedMenu.classList.contains('visible') ? _closeEmbedMenu() : _openEmbedMenu()
    })
    document.getElementById('embed-insert-btn').addEventListener('click', _insertEmbedFromMenu)
    document.getElementById('embed-url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); _insertEmbedFromMenu() }
      if (e.key === 'Escape') { e.preventDefault(); _closeEmbedMenu() }
    })
    document.addEventListener('mousedown', e => {
      if (!embedMenu.contains(e.target) && !embedButton.contains(e.target)) _closeEmbedMenu()
    })

    document.getElementById('btn-spell').addEventListener('mousedown', e => {
      e.preventDefault()
      window.webkit.messageHandlers.checkSpelling.postMessage(editor.getText())
    })

    // ── Active-state updates ───────────────────────────
    const TOGGLE_CMDS = ['bold','italic','strike','code',
                         'blockquote','codeBlock','bulletList','orderedList','link']
    const _toggleBtns = TOGGLE_CMDS.map(cmd => [cmd, document.querySelector(`[data-cmd="${cmd}"]`)])
    const _blockBtns = BLOCK_CMDS.map(cmd => document.querySelector(`[data-cmd="${cmd}"]`)).filter(Boolean)
    const _undoBtn = document.querySelector('[data-cmd="undo"]')
    const _redoBtn = document.querySelector('[data-cmd="redo"]')
    const _tableControls = document.getElementById('table-controls')
    const _btnTableHeader = document.querySelector('[data-cmd="toggleTableHeader"]')
    const _btnTableFooter = document.querySelector('[data-cmd="toggleTableFooter"]')
    const _bqControls = document.getElementById('blockquote-controls')
    const _columnsControls = document.getElementById('columns-controls')
    const _buttonsControls = document.getElementById('buttons-controls')
    const _accordionControls = document.getElementById('accordion-controls')
    const _detailsControls = document.getElementById('details-controls')
    const _btnAccordionAutoclose = document.getElementById('btn-accordion-autoclose')
    const _btnDetailsOpen = document.getElementById('btn-details-open')
    const _linkControls = document.getElementById('link-controls')
    const _btnLinkNewTab = document.getElementById('btn-link-new-tab')
    const _tabsControls = document.getElementById('tabs-controls')
    const _blockControls = document.getElementById('block-controls')
    const _deleteBlockBtn = document.querySelector('[data-cmd="deleteBlock"]')
    const _row2 = document.getElementById('toolbar-row2')
    const _row2Groups = Array.from(_row2.children)
    const _linkBtn = document.querySelector('[data-cmd="link"]')
    const _buttonLinkBtn = document.querySelector('[data-cmd="buttonLink"]')
    const _btnToggleCite = document.getElementById('btn-toggle-cite')
    const _embedBtn = document.getElementById('embed-button')
    const _footnoteBtn = document.getElementById('btn-footnote')

    // The caret setContent leaves behind is not a selection the user made.
    let _toolbarIdle = false

    // The site's own format-library.js composes the same single "noopener"
    // token core/button does, appended to whatever rel already says.
    _btnLinkNewTab.addEventListener('mousedown', e => {
      e.preventDefault()
      const link = editor.getAttributes('link')
      if (!link.href) return
      const on = link.target !== '_blank'
      editor.chain().focus().extendMarkRange('link').setLink({
        href: link.href,
        target: on ? '_blank' : null,
        rel: _withRelToken(link.rel, 'noopener', on) || null,
      }).run()
    })

    function updateToolbar() {
      if (_toolbarIdle) { _clearToolbarContext(); return }
      const inFootnote = _isInFootnote()
      _toggleBtns.forEach(([cmd, btn]) => {
        if (btn) btn.classList.toggle('active', editor.isActive(cmd))
      })
      // A button keeps its link in a node attribute, so isActive('link') is
      // always false there and the generic pass above leaves both controls dark.
      const linkedButton = _buttonBlockTarget(editor.state)
      const buttonIsLinked = !!(linkedButton && linkedButton.node.attrs.href)
      if (linkedButton) _linkBtn.classList.toggle('active', buttonIsLinked)
      _buttonLinkBtn.classList.toggle('active', buttonIsLinked)
      _blockBtns.forEach(btn => { btn.disabled = inFootnote })
      // Heading menu
      headingButton.disabled = inFootnote
      let headingLevel = '0'
      for (let i = 1; i <= 6; i++) {
        if (editor.isActive('heading', { level: i })) { headingLevel = String(i); break }
      }
      headingCurrent.textContent = headingLevel === '0' ? 'P' : `H${headingLevel}`
      headingButton.classList.toggle('heading-active', headingLevel !== '0')
      headingMenu.querySelectorAll('[data-heading-level]').forEach(item => {
        item.classList.toggle('active', item.dataset.headingLevel === headingLevel)
      })
      // Table controls
      const inTable = editor.isActive('table')
      _tableControls.style.display = inTable ? 'inline-flex' : 'none'
      if (inTable) {
        const table = _settingBlockAt(editor.state, 'table')
        for (const [type, btn] of [['head', _btnTableHeader], ['foot', _btnTableFooter]]) {
          btn.classList.toggle('active', !!table && !!_tableSectionRow(table.node, type))
        }
      }
      // Tabs controls
      _tabsControls.style.display = editor.isActive('tabsBlock') ? 'inline-flex' : 'none'
      // Accordion controls
      const inAccordion = editor.isActive('accordionBlock')
      _accordionControls.style.display = inAccordion ? 'inline-flex' : 'none'
      if (inAccordion) {
        _btnAccordionAutoclose.classList.toggle('active', !!editor.getAttributes('accordionBlock').autoclose)
      }
      // Details controls
      const inDetails = editor.isActive('detailsBlock')
      _detailsControls.style.display = inDetails ? 'inline-flex' : 'none'
      if (inDetails) {
        _btnDetailsOpen.classList.toggle('active', !!editor.getAttributes('detailsBlock').showContent)
      }
      // Buttons controls
      _buttonsControls.style.display = editor.isActive('buttonsBlock') ? 'inline-flex' : 'none'
      // Columns controls
      _columnsControls.style.display = editor.isActive('columnsBlock') ? 'inline-flex' : 'none'
      // Delete-block control
      const deletable = _deletableTarget(editor.state)
      _blockControls.style.display = deletable ? 'inline-flex' : 'none'
      if (deletable) {
        _deleteBlockBtn.title = `Delete ${DELETABLE_BLOCKS.get(deletable.node.type.name)}`
      }
      // Link new-tab control. A mark, not a block, so it is hand-written rather
      // than generated from the block settings registry.
      const inLink = editor.isActive('link')
      _linkControls.style.display = inLink ? 'inline-flex' : 'none'
      if (inLink) {
        _btnLinkNewTab.classList.toggle('active', editor.getAttributes('link').target === '_blank')
      }
      // Citation control
      const inQuote = editor.isActive('blockquote') || editor.isActive('pullquote')
      _bqControls.style.display = inQuote ? 'inline-flex' : 'none'
      if (inQuote) {
        _btnToggleCite.classList.toggle('active', editor.isActive('cite'))
      }
      // Undo / Redo
      _undoBtn.disabled = !editor.can().undo()
      _redoBtn.disabled = !editor.can().redo()
      // Embed / footnote buttons
      _embedBtn.disabled = inFootnote
      _footnoteBtn.disabled = inFootnote
      _updateSettingControls()
      // Image alignment controls
      const selNode = editor.state.selection.node
      const selectedImage = selNode?.type.name === 'image' ? selNode : null
      const alignControls = document.getElementById('image-align-controls')
      if (selectedImage) {
        alignControls.style.display = 'inline-flex'
        const alignCmdMap = { left: 'alignLeft', center: 'alignCenter', right: 'alignRight' }
        document.querySelectorAll('#image-align-controls button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.cmd === alignCmdMap[selectedImage.attrs.alignment])
        })
      } else {
        alignControls.style.display = 'none'
        document.querySelectorAll('#image-align-controls button').forEach(btn => {
          btn.classList.remove('active')
        })
      }
      // Row 2 exists only while one of its groups does.
      _row2.classList.toggle('visible',
        _row2Groups.some(el => el && el.style.display !== 'none'))
    }

    function _clearToolbarContext() {
      _toggleBtns.forEach(([, btn]) => { if (btn) btn.classList.remove('active') })
      _buttonLinkBtn.classList.remove('active')
      document.querySelectorAll('#image-align-controls button').forEach(btn => btn.classList.remove('active'))
      headingCurrent.textContent = 'P'
      headingButton.classList.remove('heading-active')
      headingMenu.querySelectorAll('[data-heading-level]').forEach(item => {
        item.classList.toggle('active', item.dataset.headingLevel === '0')
      })
      _row2Groups.forEach(el => { if (el) el.style.display = 'none' })
      _row2.classList.remove('visible')
      _undoBtn.disabled = !editor.can().undo()
      _redoBtn.disabled = !editor.can().redo()
    }

    editor.on('focus', () => {
      if (!_toolbarIdle) return
      _toolbarIdle = false
      updateToolbar()
    })

    // ── Content change → Swift ─────────────────────────
    let debounce
    function _postStats() {
      window.webkit?.messageHandlers?.statsChanged?.postMessage(countStats(editor.getText()))
    }

    editor.on('update', () => {
      _rawHTML = null
      if (_findOpen) _refreshFind(false)
      clearTimeout(debounce)
      debounce = setTimeout(() => {
        _postContent(toWordPressHTML(editor.getHTML()), true)
        _postStats()
      }, 500)
    })

    // ── Swift → JS bridge (globals) ───────────────────
    window.applySpellErrors = function(words) {
      function escapeRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      }
      const { state, dispatch } = editor.view
      const decos = []
      if (Array.isArray(words) && words.length > 0) {
        // One alternation regex for all words, instead of words × text-nodes RegExp allocs
        const re = new RegExp('\\b(?:' + words.map(escapeRegex).join('|') + ')\\b', 'gi')
        state.doc.descendants((node, pos) => {
          if (!node.isText) return
          const text = node.text
          re.lastIndex = 0
          let match
          while ((match = re.exec(text)) !== null) {
            decos.push(
              Decoration.inline(
                pos + match.index,
                pos + match.index + match[0].length,
                { class: 'spell-error' }
              )
            )
          }
        })
      }
      const decoSet = DecorationSet.create(state.doc, decos)
      dispatch(state.tr.setMeta(spellCheckKey, decoSet))
    }

    // Returns { word, from, to } if the click landed on a spell-error span,
    // null otherwise. Uses the existing DOM decoration rather than re-scanning.
    window.spellContextAtPoint = function(x, y) {
      let el = document.elementFromPoint(x, y)
      while (el && !el.classList.contains('spell-error')) {
        if (!el.parentElement || el === document.body) { el = null; break }
        el = el.parentElement
      }
      if (!el) return null
      const word = el.textContent
      if (!word) return null
      try {
        const from = editor.view.posAtDOM(el, 0)
        const to = editor.view.posAtDOM(el, el.childNodes.length)
        return { word, from, to }
      } catch (_) { return null }
    }

    window.replaceSpellError = function(from, to, replacement) {
      if (typeof from !== 'number' || typeof to !== 'number' || typeof replacement !== 'string') return
      editor.view.dispatch(editor.state.tr.insertText(replacement, from, to))
      editor.view.focus()
    }

    // ── Find & replace ────────────────────────────────
    let _findOpen = false
    let _findActiveIndex = 0
    let _findMatchPositions = []   // [{ from, to }] in doc positions

    function _collectFindMatches() {
      const query = document.getElementById('find-input').value
      const caseSensitive = document.getElementById('find-case').classList.contains('active')
      const result = []
      if (!query) return result
      editor.state.doc.descendants((node, pos) => {
        if (!node.isTextblock) return true
        let text = ''
        const positions = []
        node.descendants((child, childPos) => {
          if (child.isText) {
            for (let i = 0; i < child.text.length; i++) {
              positions.push(pos + 1 + childPos + i)
              text += child.text[i]
            }
          }
        })
        for (const m of findMatches(text, query, caseSensitive)) {
          result.push({ from: positions[m.start], to: positions[m.end - 1] + 1 })
        }
        return false
      })
      return result
    }

    function _renderFindDecorations() {
      const decos = _findMatchPositions.map((m, i) =>
        Decoration.inline(m.from, m.to, {
          class: i === _findActiveIndex ? 'find-match find-match-active' : 'find-match'
        })
      )
      const { state, dispatch } = editor.view
      dispatch(state.tr.setMeta(findKey, DecorationSet.create(state.doc, decos)))
      document.getElementById('find-count').textContent = _findMatchPositions.length
        ? `${_findActiveIndex + 1} of ${_findMatchPositions.length}`
        : '0 of 0'
    }

    function _scrollToActiveMatch() {
      const m = _findMatchPositions[_findActiveIndex]
      if (!m) return
      try {
        const dom = editor.view.domAtPos(m.from).node
        const el = dom.nodeType === Node.TEXT_NODE ? dom.parentElement : dom
        el?.scrollIntoView({ block: 'center' })
      } catch (_) {}
    }

    function _refreshFind(resetIndex) {
      _findMatchPositions = _collectFindMatches()
      if (resetIndex || _findActiveIndex >= _findMatchPositions.length) _findActiveIndex = 0
      _renderFindDecorations()
    }

    function _stepFind(delta) {
      if (!_findMatchPositions.length) return
      _findActiveIndex = (_findActiveIndex + delta + _findMatchPositions.length) % _findMatchPositions.length
      _renderFindDecorations()
      _scrollToActiveMatch()
    }

    function _openFindBar() {
      if (codeViewActive) return
      _findOpen = true
      document.getElementById('find-bar').classList.add('visible')
      const input = document.getElementById('find-input')
      const sel = window.getSelection()
      if (sel && !sel.isCollapsed) input.value = sel.toString()
      input.focus()
      input.select()
      _refreshFind(true)
      if (_findMatchPositions.length) _scrollToActiveMatch()
    }

    function _closeFindBar() {
      if (!_findOpen) return
      _findOpen = false
      document.getElementById('find-bar').classList.remove('visible')
      _findMatchPositions = []
      const { state, dispatch } = editor.view
      dispatch(state.tr.setMeta(findKey, DecorationSet.empty))
      editor.commands.focus()
    }

    function _replaceActive() {
      const m = _findMatchPositions[_findActiveIndex]
      if (!m) return
      const replacement = document.getElementById('replace-input').value
      editor.view.dispatch(editor.state.tr.insertText(replacement, m.from, m.to))
      _refreshFind(false)
      _scrollToActiveMatch()
    }

    function _replaceAll() {
      if (!_findMatchPositions.length) return
      const replacement = document.getElementById('replace-input').value
      const tr = editor.state.tr
      for (const m of [..._findMatchPositions].reverse()) {
        tr.insertText(replacement, m.from, m.to)
      }
      editor.view.dispatch(tr)
      _refreshFind(true)
    }

    document.getElementById('find-input').addEventListener('input', () => _refreshFind(true))
    document.getElementById('find-next').addEventListener('click', () => _stepFind(1))
    document.getElementById('find-prev').addEventListener('click', () => _stepFind(-1))
    document.getElementById('find-case').addEventListener('click', e => {
      e.currentTarget.classList.toggle('active')
      _refreshFind(true)
    })
    document.getElementById('replace-one').addEventListener('click', _replaceActive)
    document.getElementById('replace-all').addEventListener('click', _replaceAll)
    document.getElementById('find-close').addEventListener('click', _closeFindBar)
    document.getElementById('find-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); _stepFind(e.shiftKey ? -1 : 1) }
    })
    document.addEventListener('keydown', e => {
      if (e.key === 'Meta') document.body.classList.add('cmd-held')
      if (e.metaKey && !e.shiftKey && !e.altKey && e.key === 'f') {
        e.preventDefault()
        _openFindBar()
      } else if (e.key === 'Escape' && _findOpen) {
        e.preventDefault()
        _closeFindBar()
      }
    })
    document.addEventListener('keyup', e => {
      if (e.key === 'Meta') document.body.classList.remove('cmd-held')
    })
    window.addEventListener('blur', () => document.body.classList.remove('cmd-held'))

    // ── Footnotes: insert + jump ──────────────────────
    function _findFootnoteItemPos(fnId) {
      let itemPos = null
      editor.state.doc.descendants((node, pos) => {
        if (node.type.name === 'footnoteItem' && node.attrs.fnId === fnId) {
          itemPos = pos
          return false
        }
        return true
      })
      return itemPos
    }

    function insertFootnote() {
      if (codeViewActive) return
      const { state } = editor
      // No footnotes-from-within-footnotes: bail if the cursor is in the list
      const $from = state.selection.$from
      for (let d = $from.depth; d > 0; d--) {
        if ($from.node(d).type.name === 'footnotesList') return
      }
      const fnId = 'fn-' + crypto.randomUUID()
      const schema = state.schema
      const tr = state.tr
      tr.insert(state.selection.from, schema.nodes.footnoteMarker.create({ fnId }))

      // Append the entry to the footnotes list, creating it at the doc end if
      // missing.
      let listPos = null
      let listNode = null
      tr.doc.descendants((node, pos) => {
        if (node.type.name === 'footnotesList') { listPos = pos; listNode = node; return false }
        return true
      })
      const item = schema.nodes.footnoteItem.create({ fnId })
      if (listPos === null) {
        tr.insert(tr.doc.content.size, schema.nodes.footnotesList.create(null, [item]))
      } else {
        tr.insert(listPos + listNode.nodeSize - 1, item)
      }
      editor.view.dispatch(tr)

      // Put the cursor inside the new entry so the user can type immediately
      const itemPos = _findFootnoteItemPos(fnId)
      if (itemPos !== null) {
        editor.chain().focus().setTextSelection(itemPos + 1).scrollIntoView().run()
      }
    }
    window.insertFootnote = insertFootnote

    // Clicking a marker jumps to (and focuses) its entry
    document.getElementById('editor').addEventListener('click', e => {
      const sup = e.target.closest('sup.fn[data-fn]')
      if (!sup) return
      e.preventDefault()   // stop the <a href="#id"> from triggering a fragment navigation
      const itemPos = _findFootnoteItemPos(sup.getAttribute('data-fn'))
      if (itemPos !== null) {
        editor.chain().focus().setTextSelection(itemPos + 1).scrollIntoView().run()
      }
    })

    document.getElementById('btn-footnote').addEventListener('mousedown', e => {
      e.preventDefault()
      insertFootnote()
    })

    // Footnote bodies as WordPress stores them: a JSON array in post meta, not
    // in post_content. See docs/footnotes-meta.md.
    let _footnotes = '[]'

    // post_content and the footnote meta are produced together -- the delimiter
    // left in the content stands in for the bodies sent alongside it. Only the
    // visual document is authoritative for those bodies; code view shows the
    // delimiter alone, so an edit there must not clear what it stands for.
    function _postContent(html, footnotesAuthoritative) {
      const split = extractFootnotes(html)
      if (footnotesAuthoritative) _footnotes = JSON.stringify(split.footnotes)
      if (window.webkit?.messageHandlers?.contentChanged) {
        window.webkit.messageHandlers.contentChanged.postMessage(split.content)
      }
      if (window.webkit?.messageHandlers?.footnotesChanged) {
        window.webkit.messageHandlers.footnotesChanged.postMessage(_footnotes)
      }
    }

    // ── Code view ─────────────────────────────────────
    let codeViewActive = false
    // Authoritative HTML that bypasses Tiptap's schema parser. Set when content
    // is loaded from WordPress or when the user edits in code view. Cleared on any
    // visual edit (onUpdate) so Tiptap becomes the source of truth again.
    let _rawHTML = null
