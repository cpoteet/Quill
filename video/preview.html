<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quill intro preview</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <div id="frame-box"><iframe id="stage-frame" src="index.html" title="Stage"></iframe></div>
  <div id="controls">
    <button type="button" id="play">Play</button>
    <input type="range" id="scrub" min="0" max="60" step="0.0166667" value="0" aria-label="Time">
    <output id="time">0.00</output>
  </div>
  <script src="preview.js"></script>
</body>
</html>
