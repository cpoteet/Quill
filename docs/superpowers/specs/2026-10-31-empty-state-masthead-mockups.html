<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty state options</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1a1a1a; --muted: #737373; --faint: #a3a3a3; --rule: rgba(0,0,0,0.1); --rule-strong: #1a1a1a;
    --accent: #C77700;
    --sidebar: #f3f3f2; --sel: rgba(0,0,0,0.06);
    --chrome: #f5f5f4; --ctl: #ffffff; --ctl-border: rgba(0,0,0,0.14); --ctl-on: #1a1a1a; --ctl-on-ink: #fff;
    --amber: #C77700; --blue: #2f7de1; --green: #2e9d4f;
    --mark: #D8CDBD;
  }
  body.dark {
    --bg: #1e1e1e; --ink: #f0f0f0; --muted: #9a9a9a; --faint: #6b6b6b; --rule: rgba(255,255,255,0.12); --rule-strong: #e6e6e6;
    --accent: #F0B450;
    --sidebar: #262626; --sel: rgba(255,255,255,0.07);
    --chrome: #262626; --ctl: #2e2e2e; --ctl-border: rgba(255,255,255,0.14); --ctl-on: #f0f0f0; --ctl-on-ink: #1e1e1e;
    --amber: #BF801E; --blue: #4b93ef; --green: #3fb463;
    --mark: #5A5348;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
  }

  #bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 12px 16px; background: var(--chrome); border-bottom: 1px solid var(--rule);
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > span { color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--ctl-border); border-radius: 6px; overflow: hidden; background: var(--ctl); }
  .seg button {
    font: inherit; color: var(--ink); background: transparent; border: 0; padding: 5px 12px; cursor: default;
    border-right: 1px solid var(--ctl-border);
  }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--ctl-on); color: var(--ctl-on-ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #about { width: 100%; color: var(--muted); line-height: 1.45; }
  #about strong { color: var(--ink); font-weight: 600; }

  #window { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 250px; flex: none; background: var(--sidebar); border-right: 1px solid var(--rule); padding: 12px 10px; overflow: hidden; }
  #sidebar .sections { display: flex; gap: 4px; margin-bottom: 10px; }
  #sidebar .sections span { flex: 1; text-align: center; padding: 4px 0; border-radius: 5px; color: var(--muted); }
  #sidebar .sections span.on { background: var(--sel); color: var(--ink); }
  #sidebar .search { height: 24px; border-radius: 6px; background: var(--sel); margin-bottom: 12px; }
  .row { padding: 6px 8px; border-radius: 6px; }
  .row .t { font-weight: 500; line-height: 1.3; }
  .row .s { display: flex; align-items: center; gap: 5px; color: var(--muted); margin-top: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

  #main { flex: 1; overflow: auto; position: relative; }

  .serif { font-family: var(--serif); }
  body.ny { --serif: ui-serif, "New York", Georgia, serif; }
  body.iowan { --serif: "Iowan Old Style", "Palatino", Georgia, serif; }
  body.sf { --serif: -apple-system, BlinkMacSystemFont, sans-serif; }
  body.sf .name { letter-spacing: -0.025em; font-weight: 700; }

  .feather { display: block; fill: var(--mark); flex: none; }
  .feather.top { margin: 0 auto 14px; }
  .contents .feather.top { margin: 0 0 14px; }
  .rules .feather { align-self: center; }

  .label { font-family: var(--serif); font-variant-caps: all-small-caps; letter-spacing: 0.06em; font-size: 15px; color: var(--muted); }
  a.item { display: block; color: inherit; text-decoration: none; border-radius: 6px; }
  a.item:hover .it { color: var(--accent); }
  a.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .when { color: var(--muted); }
  .empty-note { color: var(--muted); line-height: 1.5; }
  .empty-note kbd { font: inherit; padding: 0 4px; border: 1px solid var(--ctl-border); border-radius: 3px; font-size: 12px; }

  /* A: Front page */
  .front { max-width: 520px; margin: 0 auto; padding: 72px 32px 48px; }
  .front .name { font-size: 46px; line-height: 1.08; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
  .front .rules { margin: 18px 0 36px; border-top: 2px solid var(--rule-strong); border-bottom: 1px solid var(--rule); padding: 7px 0; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .front .lead { margin-bottom: 30px; }
  .front .lead .it { font-family: var(--serif); font-size: 23px; line-height: 1.25; font-weight: 600; margin: 4px 0 4px; }
  .front .list a.item { display: flex; align-items: baseline; gap: 6px; padding: 5px 0; }
  .front .list .it { font-family: var(--serif); font-size: 16px; }
  .front .list .lead-dots { flex: 1; border-bottom: 1px dotted var(--faint); transform: translateY(-4px); min-width: 16px; }
  .front .list .when { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* B: Title page */
  .title { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 32px 12vh; }
  .title .name { font-size: 40px; line-height: 1.1; font-weight: 600; max-width: 560px; }
  .title .host { font-family: var(--serif); font-variant-caps: all-small-caps; letter-spacing: 0.08em; font-size: 15px; color: var(--muted); margin-top: 8px; }
  .title .orn { width: 36px; border-top: 1px solid var(--faint); margin: 28px 0 24px; }
  .title a.item { padding: 2px 4px; font-size: 14px; line-height: 1.5; }
  .title a.item .it { font-family: var(--serif); font-size: 17px; }
  .title .also { margin-top: 10px; color: var(--muted); }

  /* C: Contents */
  .contents { max-width: 560px; margin: 0 auto; padding: 64px 32px 48px; }
  .contents .name { font-size: 34px; line-height: 1.15; font-weight: 600; }
  .contents .host { color: var(--muted); margin: 6px 0 34px; }
  .contents section { margin-bottom: 26px; }
  .contents .label { display: block; border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin-bottom: 6px; }
  .contents a.item { display: flex; align-items: baseline; gap: 6px; padding: 5px 0; }
  .contents .it { font-family: var(--serif); font-size: 16.5px; }
  .contents .lead-dots { flex: 1; border-bottom: 1px dotted var(--faint); transform: translateY(-4px); min-width: 16px; }
  .contents .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="sf">
  <div id="bar">
    <div class="group"><span>Layout</span>
      <div class="seg" data-opt="layout" role="radiogroup" aria-label="Layout">
        <button data-v="front" class="on">Front page</button>
        <button data-v="title">Title page</button>
        <button data-v="contents">Contents</button>
      </div>
    </div>
    <div class="group"><span>Typeface</span>
      <div class="seg" data-opt="face" role="radiogroup" aria-label="Typeface">
        <button data-v="ny">New York</button>
        <button data-v="iowan">Iowan Old Style</button>
        <button data-v="sf" class="on">SF Pro</button>
      </div>
    </div>
    <div class="group"><span>Feather</span>
      <div class="seg" data-opt="feather" role="radiogroup" aria-label="Feather">
        <button data-v="above" class="on">Above the name</button>
        <button data-v="inline">In the rule</button>
        <button data-v="none">None</button>
      </div>
    </div>
    <div class="group"><span>Site</span>
      <div class="seg" data-opt="data" role="radiogroup" aria-label="Site data">
        <button data-v="typical" class="on">Typical</button>
        <button data-v="quiet">Nothing pending</button>
        <button data-v="long">Long name</button>
      </div>
    </div>
    <div class="group"><span>Theme</span>
      <div class="seg" data-opt="theme" role="radiogroup" aria-label="Theme">
        <button data-v="light" class="on">Light</button>
        <button data-v="dark">Dark</button>
      </div>
    </div>
    <div id="about"></div>
  </div>

  <div id="window">
    <aside id="sidebar" aria-hidden="true">
      <div class="sections"><span class="on">Posts</span><span>Pages</span><span>Drafts</span><span>Media</span></div>
      <div class="search"></div>
      <div id="rows"></div>
    </aside>
    <main id="main"></main>
  </div>

<script>
  const ABOUT = {
    front: '<strong>Front page.</strong> The site name set like a newspaper masthead over a double rule, with today\'s date and the address in the rule. One draft leads; scheduled posts follow as a short list with dot leaders. The most "Quill" of the three, and the busiest.',
    title: '<strong>Title page.</strong> The site name alone in the middle of the window, like a book\'s title page, with one link back to the draft you last touched. Closest to today\'s empty state, so it\'s the quietest change.',
    contents: '<strong>Contents.</strong> A table of contents for what\'s in progress: drafts and scheduled posts under small-caps headings, dates on dot leaders. Most useful on a site with several drafts going at once.',
  }
  const FACE = {
    ny: 'New York is the system serif (SwiftUI .fontDesign(.serif)), so nothing to bundle. If this pane can\'t reach it you\'ll see Georgia; open the file in Safari to see New York.',
    iowan: 'Iowan Old Style ships with macOS. Warmer and more bookish than New York, but it needs a named font in SwiftUI.',
    sf: 'SF Pro, set tight and heavy. No serif at all: Quill\'s own UI type, just larger.',
  }
  const FEATHER_ABOUT = {
    above: 'The feather sits above the name as the masthead\'s emblem, in the colour today\'s empty-state feather uses.',
    inline: 'The feather sits in the rule as a small ornament: between the date and the address on the front page, in place of the short rule on the title page.',
    none: 'No feather.',
  }
  const FEATHER_PATH = '<path fill-rule="evenodd" d="M178 22C174 47 163 70 147 91C160 84 166 75 169 68C168 89 154 113 135 130C151 123 159 111 163 104C157 128 142 149 120 162C137 154 146 145 150 138C140 165 120 184 92 190C79 173 77 157 82 137C81 151 84 160 88 165C82 141 89 122 101 106C96 120 94 133 97 141C92 121 102 100 113 90C105 106 104 119 106 126C103 104 119 86 129 74C119 91 118 104 119 109C121 79 144 40 178 22ZM170 37C144 79 111 138 91 188L94 188C114 138 146 78 170 37Z"/><path d="M92 181C85 200 79 218 72 237L81 230C85 214 91 198 97 183Z"/>'
  const feather = (height, cls = '') => `<svg class="feather ${cls}" viewBox="72 22 106 215" height="${height}" width="${(height * 106 / 215).toFixed(1)}" aria-hidden="true">${FEATHER_PATH}</svg>`
  const featherAbove = h => opts.feather === 'above' ? feather(h, 'top') : ''

  const SITES = {
    typical: {
      name: 'Siolon', host: 'siolon.com',
      drafts: [
        { title: 'Packing for the coast', when: 'Edited 2 hours ago', local: false },
        { title: 'What the fog keeps', when: 'Edited yesterday', local: true },
        { title: 'Notes on paper maps', when: 'Edited 12 Oct', local: false },
      ],
      scheduled: [
        { title: 'A year of single-lane roads', when: 'Tue 3 Nov' },
        { title: 'The thermos, reconsidered', when: 'Mon 9 Nov' },
      ],
    },
    quiet: { name: 'Siolon', host: 'siolon.com', drafts: [], scheduled: [] },
    long: {
      name: 'The Occasional Field Notes of a Coastal Walker', host: 'fieldnotes.example.com',
      drafts: [{ title: 'Packing for the coast, and other arguments with the forecast', when: 'Edited 2 hours ago', local: false }],
      scheduled: [{ title: 'A year of single-lane roads', when: 'Tue 3 Nov' }],
    },
  }
  const ROWS = [
    { t: 'Packing for the coast', s: 'Draft', c: '--amber' },
    { t: 'A year of single-lane roads', s: '3 Nov 2026 · Scheduled', c: '--blue' },
    { t: 'The thermos, reconsidered', s: '9 Nov 2026 · Scheduled', c: '--blue' },
    { t: 'Notes on paper maps', s: 'Draft', c: '--amber' },
    { t: 'Leaving before the light', s: '24 Oct 2026 · Published', c: '--green' },
    { t: 'Second lookout', s: '17 Oct 2026 · Published', c: '--green' },
  ]

  const opts = { layout: 'front', face: 'sf', feather: 'above', data: 'typical', theme: 'light' }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const today = new Date(2026, 9, 31).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
  const draftWhen = d => esc(d.when) + (d.local ? ' · on this Mac' : '')
  const leader = (it, when) => `<a class="item" href="#"><span class="it">${esc(it)}</span><span class="lead-dots"></span><span class="when">${when}</span></a>`
  const nothing = '<p class="empty-note">Nothing in progress. Start a post with <kbd>⌘N</kbd>.</p>'

  function front(site) {
    const [lead, ...rest] = site.drafts
    return `<div class="front">
      ${featherAbove(30)}
      <h1 class="name serif">${esc(site.name)}</h1>
      <div class="rules"><span>${today}</span>${opts.feather === 'inline' ? feather(14) : ''}<span>${esc(site.host)}</span></div>
      ${lead ? `<section class="lead"><span class="label">continue writing</span>
        <a class="item" href="#"><div class="it">${esc(lead.title)}</div><div class="when">${draftWhen(lead)}</div></a></section>` : ''}
      ${site.scheduled.length ? `<section class="list"><span class="label">scheduled</span>
        ${site.scheduled.map(p => leader(p.title, esc(p.when))).join('')}</section>` : ''}
      ${rest.length ? `<section class="list" style="margin-top:22px"><span class="label">other drafts</span>
        ${rest.map(d => leader(d.title, esc(d.when.replace('Edited ', '')))).join('')}</section>` : ''}
      ${!lead && !site.scheduled.length ? nothing : ''}
    </div>`
  }

  function title(site) {
    const lead = site.drafts[0]
    const others = site.drafts.length - 1 + site.scheduled.length
    return `<div class="title">
      ${featherAbove(30)}
      <h1 class="name serif">${esc(site.name)}</h1>
      <div class="host">${esc(site.host)}</div>
      ${opts.feather === 'inline' ? `<div style="margin:24px 0 20px">${feather(18)}</div>` : '<div class="orn"></div>'}
      ${lead ? `<a class="item" href="#">Continue <span class="it">${esc(lead.title)}</span></a>
        <div class="when">${draftWhen(lead)}</div>` : nothing}
      ${lead && others > 0 ? `<div class="also">${site.drafts.length - 1} more draft${site.drafts.length === 2 ? '' : 's'} · ${site.scheduled.length} scheduled</div>` : ''}
    </div>`
  }

  function contents(site) {
    return `<div class="contents">
      ${opts.feather === 'none' ? '' : feather(26, 'top')}
      <h1 class="name serif">${esc(site.name)}</h1>
      <div class="host">${esc(site.host)}</div>
      ${site.drafts.length ? `<section><span class="label">in progress</span>
        ${site.drafts.map(d => leader(d.title, esc(d.when.replace('Edited ', '')) + (d.local ? ' · Mac' : ''))).join('')}</section>` : ''}
      ${site.scheduled.length ? `<section><span class="label">scheduled</span>
        ${site.scheduled.map(p => leader(p.title, esc(p.when))).join('')}</section>` : ''}
      ${!site.drafts.length && !site.scheduled.length ? nothing : ''}
    </div>`
  }

  function render() {
    document.body.className = opts.face + (opts.theme === 'dark' ? ' dark' : '')
    document.getElementById('rows').innerHTML = (opts.data === 'quiet' ? ROWS.filter(r => r.s.endsWith('Published')) : ROWS)
      .map(r => `<div class="row"><div class="t">${esc(r.t)}</div><div class="s"><span class="dot" style="background:var(${r.c})"></span>${esc(r.s)}</div></div>`).join('')
    document.getElementById('main').innerHTML = { front, title, contents }[opts.layout](SITES[opts.data])
    document.getElementById('about').innerHTML = ABOUT[opts.layout] + ' ' + FACE[opts.face] + ' ' + FEATHER_ABOUT[opts.feather] +
      ' Every item opens in the editor. Shown only when nothing is selected; "No posts yet" and load errors stay as they are.'
  }

  document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b))
    opts[seg.dataset.opt] = b.dataset.v
    render()
  }))
  document.addEventListener('click', e => { if (e.target.closest('a.item')) e.preventDefault() })
  render()
</script>
</body>
</html>
