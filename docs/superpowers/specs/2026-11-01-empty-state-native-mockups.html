<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty state, native</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --faint: #aeaeb2; --sep: rgba(0,0,0,0.1);
    --sidebar: #f3f3f2; --sel: #C77700; --chrome: #f5f5f4;
    --ctl: #ffffff; --ctl-border: rgba(0,0,0,0.14); --ctl-on: #1d1d1f; --ctl-on-ink: #fff;
    --group: rgba(0,0,0,0.04); --group-border: rgba(0,0,0,0.06); --hover: rgba(0,0,0,0.04);
    --accent: #C77700; --mark: #D8CDBD;
    --draft: #D99A2B; --future: #4A8CCE; --publish: #3E9E63; --local: #6C63C9; --pending: #CF6B46;
    --button: #ffffff; --button-border: rgba(0,0,0,0.16);
  }
  body.dark {
    --bg: #1e1e1e; --ink: #f2f2f7; --muted: #98989d; --faint: #636366; --sep: rgba(255,255,255,0.12);
    --sidebar: #262626; --sel: #BF801E; --chrome: #262626;
    --ctl: #2e2e2e; --ctl-border: rgba(255,255,255,0.14); --ctl-on: #f2f2f7; --ctl-on-ink: #1e1e1e;
    --group: rgba(255,255,255,0.05); --group-border: rgba(255,255,255,0.06); --hover: rgba(255,255,255,0.05);
    --accent: #F0B450; --mark: #5A5348;
    --button: #3a3a3c; --button-border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow: hidden;
  }

  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; background: var(--chrome); border-bottom: 1px solid var(--sep); }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > span { color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--ctl-border); border-radius: 6px; overflow: hidden; background: var(--ctl); }
  .seg button { font: inherit; color: var(--ink); background: transparent; border: 0; padding: 5px 12px; border-right: 1px solid var(--ctl-border); cursor: default; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--ctl-on); color: var(--ctl-on-ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #about { width: 100%; color: var(--muted); line-height: 1.45; }
  #about strong { color: var(--ink); font-weight: 600; }

  #window { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 260px; flex: none; background: var(--sidebar); border-right: 1px solid var(--sep); padding: 12px 10px; overflow: hidden; }
  .sections { display: flex; gap: 4px; margin-bottom: 10px; }
  .sections span { flex: 1; text-align: center; padding: 4px 0; border-radius: 6px; color: var(--muted); font-size: 11px; }
  .sections span.on { background: var(--hover); color: var(--ink); }
  .search { height: 24px; border-radius: 6px; background: var(--hover); margin-bottom: 10px; color: var(--faint); padding: 4px 8px; font-size: 12px; }
  .srow { padding: 6px 8px; }
  .srow .t, .row .t { font-weight: 500; line-height: 1.3; }
  .srow .s, .row .s { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; margin-top: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

  #detail { flex: 1; position: relative; overflow: hidden; min-width: 0; }
  #detail.narrow { flex: none; width: 500px; border-right: 1px solid var(--sep); }
  #main { position: absolute; inset: 0; overflow: auto; }
  .bgmark { position: absolute; fill: var(--mark); pointer-events: none; }
  .bgmark.faint { opacity: 0.5; }
  .bgmark.cropped { height: 560px; width: 276px; right: -40px; bottom: -120px; }
  .bgmark.whole { height: 400px; width: 197px; right: 32px; bottom: 32px; }

  a.item { color: inherit; text-decoration: none; display: block; }
  a.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  a.item:hover .t { color: var(--accent); }
  .label { font-size: 11px; font-weight: 600; color: var(--muted); }
  .muted { color: var(--muted); }

  /* Current masthead, for reference */
  .mast { max-width: 520px; margin: 0 auto; padding: 72px 32px 48px; }
  .mast .name { font-size: 46px; font-weight: 700; letter-spacing: -0.025em; text-align: center; line-height: 1.08; }
  .mast .rules { margin: 18px 0 36px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--sep); padding: 7px 0; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .mast .cap { font-variant-caps: all-small-caps; letter-spacing: 0.06em; font-size: 15px; color: var(--muted); }
  .mast .lead { margin-bottom: 30px; }
  .mast .lead .t { font-size: 23px; font-weight: 600; margin: 4px 0; }
  .mast .list a.item { display: flex; align-items: baseline; gap: 6px; padding: 5px 0; }
  .mast .list .t { font-size: 16px; font-weight: 400; }
  .mast .dots { flex: 1; border-bottom: 1px dotted var(--faint); transform: translateY(-4px); min-width: 16px; }
  .mast .when { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* A: Rows */
  .rows { max-width: 440px; margin: 0 auto; padding: 88px 32px 48px; }
  .rows .site { font-size: 17px; font-weight: 600; }
  .rows .host { color: var(--muted); margin-top: 2px; }
  .rows section { margin-top: 28px; }
  .rows .label { padding: 0 8px 4px; }
  .row { padding: 6px 8px; border-radius: 6px; }
  .rows a.item:hover { background: var(--hover); border-radius: 6px; }
  .rows a.item:hover .t { color: inherit; }
  .rows .empty { margin-top: 28px; color: var(--muted); }

  /* B: Empty state */
  .cuv { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 32px 10vh; }
  .cuv .mark { height: 100px; width: 49px; fill: var(--mark); margin-bottom: 14px; }
  .cuv .site { font-size: 17px; font-weight: 700; }
  .cuv .desc { color: var(--muted); margin-top: 6px; max-width: 360px; line-height: 1.4; }
  .cuv .btn { margin-top: 16px; font: inherit; color: var(--ink); background: var(--button); border: 1px solid var(--button-border); border-radius: 6px; padding: 4px 12px; box-shadow: 0 0.5px 1px rgba(0,0,0,0.12); text-decoration: none; display: inline-block; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cuv .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cuv .sched { margin-top: 24px; color: var(--muted); line-height: 1.7; }
  .cuv .sched a { color: inherit; text-decoration: none; }
  .cuv .sched a:hover { color: var(--accent); }
  .cuv .sched b { color: var(--ink); font-weight: 500; }

  /* C: Grouped list */
  .grouped { max-width: 480px; margin: 0 auto; padding: 72px 32px 48px; }
  .grouped .site { font-size: 22px; font-weight: 700; }
  .grouped .host { color: var(--muted); margin-top: 2px; }
  .grouped section { margin-top: 22px; }
  .grouped .label { padding: 0 0 6px; }
  .box { background: var(--group); border: 1px solid var(--group-border); border-radius: 10px; overflow: hidden; }
  .box a.item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  .box a.item + a.item { border-top: 1px solid var(--sep); }
  .box a.item:hover { background: var(--hover); }
  .box a.item:hover .t { color: inherit; }
  .sym { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
  .box .body { flex: 1; min-width: 0; }
  .box .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box .s { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .chev { color: var(--faint); font-size: 14px; }
  .grouped .empty { margin-top: 22px; color: var(--muted); }
  .grouped .head { display: flex; align-items: center; gap: 12px; }
  .grouped .head img { width: 40px; height: 40px; border-radius: 9px; flex: none; object-fit: cover; box-shadow: 0 0 0 0.5px var(--sep); }
</style>
</head>
<body>
  <div id="bar">
    <div class="group"><span>Direction</span>
      <div class="seg" data-opt="dir" role="radiogroup" aria-label="Direction">
        <button data-v="mast">Current masthead</button>
        <button data-v="rows">A · Sidebar rows</button>
        <button data-v="cuv">B · Empty state</button>
        <button data-v="grouped" class="on">C · Grouped list</button>
      </div>
    </div>
    <div class="group"><span>Content</span>
      <div class="seg" data-opt="data" role="radiogroup" aria-label="Content">
        <button data-v="typical" class="on">Typical</button>
        <button data-v="quiet">Nothing pending</button>
        <button data-v="none">Empty section</button>
        <button data-v="long">Long titles</button>
      </div>
    </div>
    <div class="group"><span>Site icon</span>
      <div class="seg" data-opt="icon" role="radiogroup" aria-label="Site icon">
        <button data-v="yes" class="on">siolon.com's icon</button>
        <button data-v="no">None set</button>
      </div>
    </div>
    <div class="group"><span>Background feather</span>
      <div class="seg" data-opt="bg" role="radiogroup" aria-label="Background feather">
        <button data-v="off" class="on">Off</button>
        <button data-v="cropped">Cropped</button>
        <button data-v="whole">Whole</button>
      </div>
    </div>
    <div class="group"><span>Strength</span>
      <div class="seg" data-opt="strength" role="radiogroup" aria-label="Strength">
        <button data-v="mark" class="on">Mark colour</button>
        <button data-v="faint">Half</button>
      </div>
    </div>
    <div class="group"><span>Detail width</span>
      <div class="seg" data-opt="width" role="radiogroup" aria-label="Detail width">
        <button data-v="full" class="on">Full</button>
        <button data-v="narrow">Narrow (500pt)</button>
      </div>
    </div>
    <div class="group"><span>Theme</span>
      <div class="seg" data-opt="theme" role="radiogroup" aria-label="Theme">
        <button data-v="light" class="on">Light</button>
        <button data-v="dark">Dark</button>
      </div>
    </div>
    <p id="about"></p>
  </div>
  <div id="window">
    <aside id="sidebar">
      <div class="sections"><span class="on">Posts</span><span>Pages</span><span>Drafts</span><span>Media</span></div>
      <div class="search">Search Posts</div>
      <div id="sidebar-rows"></div>
    </aside>
    <div id="detail"><div id="bg"></div><main id="main"></main></div>
  </div>

<script>
  const ABOUT = {
    mast: '<strong>Current masthead.</strong> For comparison: display-size name, heavy rule with the date, small-caps labels, dotted leaders.',
    rows: '<strong>A · Sidebar rows.</strong> Quill\'s own pieces: the site name as a title, SectionLabel headings, and items drawn exactly like sidebar rows with their status dot. Hover is the sidebar\'s hover, not a colour change. Plainest of the three.',
    cuv: '<strong>B · Empty state.</strong> The ContentUnavailableView pattern Quill already uses for "Couldn\'t load posts": feather, site name, one line, and a standard push button for Continue writing. Scheduled is a short line of text underneath. Closest to the old screen.',
    grouped: '<strong>C · Grouped list.</strong> Inset grouped rows like System Settings, with the status symbols Quill already pairs with its colours and a chevron. The header shows the site\'s WordPress Site Icon when it has one (Settings → General), beside the name and address. With nothing to list, the page becomes the centred feather empty state, like "Couldn\'t load posts".',
  }
  const SITES = {
    typical: {
      lead: { title: 'Packing for the coast', status: 'draft', meta: 'Draft · edited 2 hours ago' },
      scheduled: [
        { title: 'Weeknotes 44', status: 'pending', when: 'Missed schedule', missed: true },
        { title: 'Autumn reading list', status: 'future', when: 'Tue, Nov 3 at 9:00 AM' },
        { title: 'Notes from the coast road', status: 'future', when: 'Fri, Nov 6 at 7:30 AM' },
      ],
    },
    quiet: { lead: null, scheduled: [] },
    none: { lead: null, scheduled: [], noItems: true },
    long: {
      lead: { title: 'Everything I learned rebuilding the editor toolbar, and what I would do differently next time', status: 'local', meta: 'Post draft · on this Mac · edited yesterday' },
      scheduled: [
        { title: 'A very long scheduled title that has to truncate before it crowds out the date', status: 'future', when: 'Tue, Nov 3 at 9:00 AM' },
      ],
    },
  }
  const SIDEBAR = [
    ['QA issue 3 old payload', 'future', 'Dec 1, 2026 · Scheduled'],
    ['Packing for the coast', 'draft', 'Nov 1, 2026 · Draft'],
    ['QA figures', 'publish', 'Oct 15, 2026 · Published'],
    ['QA Review fixes', 'draft', 'Oct 12, 2026 · Draft'],
    ['QA Locked cards', 'draft', 'Oct 12, 2026 · Draft'],
    ['Quill: A Native macOS App for WordPress', 'publish', 'Oct 11, 2026 · Published'],
  ]
  const SYMBOL = { draft: '✎', future: '◷', publish: '✓', local: '▤', pending: '…' }
  const opts = { dir: 'grouped', data: 'typical', theme: 'light', icon: 'yes', bg: 'off', width: 'full', strength: 'mark' }

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const dot = status => `<span class="dot" style="background:var(--${status})"></span>`
  const emptyLine = site => site.noItems ? 'No posts yet' : 'Select a post to edit'

  function mast(site) {
    return `<div class="mast"><div class="name">Siolon</div>
      <div class="rules"><span>Sunday, November 1, 2026</span><span>siolon.com</span></div>
      ${site.lead ? `<section class="lead"><span class="cap">continue writing</span>
        <a class="item" href="#"><div class="t">${esc(site.lead.title)}</div><div class="muted">${esc(site.lead.meta)}</div></a></section>` : ''}
      ${site.scheduled.length ? `<section class="list"><span class="cap">scheduled</span>
        ${site.scheduled.map(p => `<a class="item" href="#"><span class="t">${esc(p.title)}</span><span class="dots"></span><span class="when">${p.missed ? 'Missed schedule' : esc(p.when.split(' at ')[0])}</span></a>`).join('')}</section>` : ''}
      ${!site.lead && !site.scheduled.length ? `<p class="muted">${emptyLine(site)}</p>` : ''}</div>`
  }

  function rows(site) {
    const row = (p, meta) => `<a class="item row" href="#"><div class="t">${esc(p.title)}</div><div class="s">${dot(p.status)}<span>${esc(meta)}</span></div></a>`
    return `<div class="rows"><div class="site">Siolon</div><div class="host">siolon.com</div>
      ${site.lead ? `<section><div class="label">Continue Writing</div>${row(site.lead, site.lead.meta)}</section>` : ''}
      ${site.scheduled.length ? `<section><div class="label">Scheduled</div>${site.scheduled.map(p => row(p, p.when)).join('')}</section>` : ''}
      ${!site.lead && !site.scheduled.length ? `<p class="empty">${emptyLine(site)}</p>` : ''}</div>`
  }

  const mark = cls => `<svg class="${cls}" viewBox="72 22 106 215" aria-hidden="true"><path fill-rule="evenodd" d="M178 22C174 47 163 70 147 91C160 84 166 75 169 68C168 89 154 113 135 130C151 123 159 111 163 104C157 128 142 149 120 162C137 154 146 145 150 138C140 165 120 184 92 190C79 173 77 157 82 137C81 151 84 160 88 165C82 141 89 122 101 106C96 120 94 133 97 141C92 121 102 100 113 90C105 106 104 119 106 126C103 104 119 86 129 74C119 91 118 104 119 109C121 79 144 40 178 22ZM170 37C144 79 111 138 91 188L94 188C114 138 146 78 170 37Z"/><path d="M92 181C85 200 79 218 72 237L81 230C85 214 91 198 97 183Z"/></svg>`
  function cuv(site) {
    const lead = site.lead
      ? `<a class="btn" href="#">Continue “${esc(site.lead.title)}”</a><p class="desc">${esc(site.lead.meta)}</p>`
      : `<p class="desc">${emptyLine(site)}</p>`
    const sched = site.scheduled.length
      ? `<div class="sched">${site.scheduled.map(p => `<a href="#"><b>${esc(p.title)}</b> · ${esc(p.when)}</a>`).join('<br>')}</div>` : ''
    return `<div class="cuv">${mark('mark')}<div class="site">Siolon</div>${lead}${sched}</div>`
  }

  function grouped(site) {
    const nothing = !site.lead && !site.scheduled.length
    if (nothing) {
      return `<div class="cuv">${mark('mark')}<div class="site">Siolon</div><p class="desc">${emptyLine(site)}</p></div>`
    }
    const item = (p, meta) => `<a class="item" href="#"><span class="sym" style="background:var(--${p.status})">${SYMBOL[p.status]}</span>
      <span class="body"><div class="t">${esc(p.title)}</div><div class="s">${esc(meta)}</div></span><span class="chev">›</span></a>`
    const icon = opts.icon === 'yes' ? '<img src="https://www.siolon.com/wp-content/uploads/Icon.png" alt="">' : ''
    const head = `<div class="head">${icon}<div><div class="site">Siolon</div><div class="host">siolon.com</div></div></div>`
    return `<div class="grouped">${head}
      ${site.lead ? `<section><div class="label">Continue Writing</div><div class="box">${item(site.lead, site.lead.meta)}</div></section>` : ''}
      ${site.scheduled.length ? `<section><div class="label">Scheduled</div><div class="box">${site.scheduled.map(p => item(p, p.when)).join('')}</div></section>` : ''}
</div>`
  }

  function render() {
    document.body.classList.toggle('dark', opts.theme === 'dark')
    document.getElementById('about').innerHTML = ABOUT[opts.dir]
    document.getElementById('sidebar-rows').innerHTML = SITES[opts.data].noItems ? '' : SIDEBAR.map(([t, s, sub]) =>
      `<div class="srow"><div class="t">${esc(t)}</div><div class="s">${dot(s)}<span>${esc(sub)}</span></div></div>`).join('')
    document.getElementById('main').innerHTML = { mast, rows, cuv, grouped }[opts.dir](SITES[opts.data])
    const site = SITES[opts.data]
    const listing = opts.dir === 'grouped' && (site.lead || site.scheduled.length)
    document.getElementById('bg').innerHTML = listing && opts.bg !== 'off' ? mark('bgmark ' + opts.bg + (opts.strength === 'faint' ? ' faint' : '')) : ''
    document.getElementById('detail').classList.toggle('narrow', opts.width === 'narrow')
  }

  document.querySelectorAll('.seg').forEach(seg => {
    seg.querySelectorAll('button').forEach(btn => {
      btn.setAttribute('role', 'radio')
      btn.setAttribute('aria-checked', btn.classList.contains('on'))
      btn.addEventListener('click', () => {
        seg.querySelectorAll('button').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-checked', 'false') })
        btn.classList.add('on'); btn.setAttribute('aria-checked', 'true')
        opts[seg.dataset.opt] = btn.dataset.v
        render()
      })
    })
  })
  document.addEventListener('click', e => { if (e.target.closest('a[href="#"]')) e.preventDefault() })
  render()
</script>
</body>
</html>
